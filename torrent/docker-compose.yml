services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ../.env
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=Netherlands
    ports:
      - "8080:8080"   # qBittorrent web UI (exposed here since qbittorrent shares this network)
      - "9696:9696"   # Prowlarr web UI (exposed here since prowlarr shares this network)
      - "8191:8191"   # FlareSolverr (exposed here since flaresolverr shares this network)
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"   # all traffic routed through Gluetun
    depends_on:
      - gluetun
    environment:
      - TZ=America/Chicago
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"   # all traffic routed through Gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - ./prowlarr/config:/config
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"   # all traffic routed through Gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=994  # run: id qbittorrent
      - PGID=1001      # run: getent group plex-rw
      - TZ=America/Chicago
      - WEBUI_PORT=8080
      - UMASK=002  # group-writable files so sonarr/radarr can hardlink and delete
    volumes:
      - ./config:/config
      - ./config/torrent/nova3/engines:/config/torrent/nova3/engines  # search plugins
      - /mnt/plex01:/mnt/plex01
      - /mnt/plex02:/mnt/plex02
    mem_limit: 4g
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=988  # run: id sonarr
      - PGID=1001 # run: getent group plex-rw
      - TZ=America/Chicago
    volumes:
      - ./sonarr/config:/config
      - /mnt/plex01:/mnt/plex01
      - /mnt/plex02:/mnt/plex02
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=987  # run: id radarr
      - PGID=1001 # run: getent group plex-rw
      - TZ=America/Chicago
    volumes:
      - ./radarr/config:/config
      - /mnt/plex01:/mnt/plex01
      - /mnt/plex02:/mnt/plex02
    ports:
      - "7878:7878"
    restart: unless-stopped
