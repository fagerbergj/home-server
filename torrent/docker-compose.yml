services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ../.env
    environment:
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=Netherlands
      # Port forwarding is static on AirVPN — reserve a port in the Client Area,
      # set AIRVPN_FORWARDED_PORT in ../.env, and use it as qBittorrent's listen port.
      - FIREWALL_VPN_INPUT_PORTS=${AIRVPN_FORWARDED_PORT}
    ports:
      - "8080:8080"   # qBittorrent web UI (exposed here since qbittorrent shares this network)
      - "9696:9696"   # Prowlarr web UI (exposed here since prowlarr shares this network)
      - "9117:9117"   # Jackett web UI (exposed here since jackett shares this network)
      - "8191:8191"   # FlareSolverr (exposed here since flaresolverr shares this network)
      - "6881:6881"
      - "6881:6881/udp"
    # Built-in Gluetun healthcheck verifies the VPN tunnel is up, not just the
    # process. Dependents below gate on this so watchtower-triggered restarts
    # don't leave qBittorrent stuck in "firewalled" with a stale namespace.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--tries=1", "--timeout=5", "https://airvpn.org"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"   # all traffic routed through Gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - TZ=America/Chicago
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"   # all traffic routed through Gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - ./prowlarr/config:/config
    restart: unless-stopped

  # Jackett kept alongside Prowlarr for manual backfill of older content —
  # Sonarr/Radarr handle ongoing releases via Prowlarr, but Jackett's UI is
  # better suited for hand-searching legacy stuff.
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    network_mode: "service:gluetun"   # all traffic routed through Gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - AUTO_UPDATE=true
    volumes:
      - ./jackett/config:/config
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"   # all traffic routed through Gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - PUID=994  # run: id qbittorrent
      - PGID=1001      # run: getent group plex-rw
      - TZ=America/Chicago
      - WEBUI_PORT=8080
      - UMASK=002  # group-writable files so sonarr/radarr can hardlink and delete
    volumes:
      - ./config:/config
      - ./config/torrent/nova3/engines:/config/torrent/nova3/engines  # search plugins
      - /mnt/media:/mnt/media
    mem_limit: 4g
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=988  # run: id sonarr
      - PGID=1001 # run: getent group plex-rw
      - TZ=America/Chicago
    volumes:
      - ./sonarr/config:/config
      - /mnt/media:/mnt/media
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=987  # run: id radarr
      - PGID=1001 # run: getent group plex-rw
      - TZ=America/Chicago
    volumes:
      - ./radarr/config:/config
      - /mnt/media:/mnt/media
    ports:
      - "7878:7878"
    restart: unless-stopped

  configarr:
    image: ghcr.io/raydak-labs/configarr:latest
    container_name: configarr
    environment:
      - TZ=America/Chicago
    volumes:
      - ./configarr/config:/app/config
      - ./configarr/dockerrepos:/app/repos
      - ./configarr/custom/cfs:/app/cfs
      - ./configarr/custom/templates:/app/templates
    restart: "no"

  # Optional second Tailscale exit node, sharing Gluetun's network namespace
  # so its outbound is forced through AirVPN. From a phone or laptop, pick
  # `vpn-exit` as the exit node in the Tailscale app to route that device's
  # traffic through AirVPN; pick `jason-server` (or none) for direct.
  #
  # Requires TS_AUTHKEY_VPN_EXIT in ../.env — generate at
  # https://login.tailscale.com/admin/settings/keys (reusable, ephemeral off).
  # After first boot, approve the new node and toggle "Use as exit node" in
  # the admin console.
  tailscale-vpn-exit:
    image: tailscale/tailscale:latest
    container_name: tailscale-vpn-exit
    hostname: vpn-exit
    network_mode: "service:gluetun"
    env_file:
      - ../.env
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY_VPN_EXIT}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--advertise-exit-node --accept-dns=false
    volumes:
      - ./tailscale-vpn-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    restart: unless-stopped
