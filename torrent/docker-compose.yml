services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ../.env
    environment:
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=Netherlands
      # Port forwarding is static on AirVPN — reserve a port in the Client Area,
      # set AIRVPN_FORWARDED_PORT in ../.env, and use it as qBittorrent's listen port.
      - FIREWALL_VPN_INPUT_PORTS=${AIRVPN_FORWARDED_PORT}
    ports:
      - "8080:8080"   # qBittorrent web UI (exposed here since qbittorrent shares this network)
      - "9696:9696"   # Prowlarr web UI (exposed here since prowlarr shares this network)
      - "8191:8191"   # FlareSolverr (exposed here since flaresolverr shares this network)
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"   # all traffic routed through Gluetun
    depends_on:
      - gluetun
    environment:
      - TZ=America/Chicago
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"   # all traffic routed through Gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - ./prowlarr/config:/config
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"   # all traffic routed through Gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=994  # run: id qbittorrent
      - PGID=1001      # run: getent group plex-rw
      - TZ=America/Chicago
      - WEBUI_PORT=8080
      - UMASK=002  # group-writable files so sonarr/radarr can hardlink and delete
    volumes:
      - ./config:/config
      - ./config/torrent/nova3/engines:/config/torrent/nova3/engines  # search plugins
      - /mnt/media:/mnt/media
    mem_limit: 4g
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=988  # run: id sonarr
      - PGID=1001 # run: getent group plex-rw
      - TZ=America/Chicago
    volumes:
      - ./sonarr/config:/config
      - /mnt/media:/mnt/media
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=987  # run: id radarr
      - PGID=1001 # run: getent group plex-rw
      - TZ=America/Chicago
    volumes:
      - ./radarr/config:/config
      - /mnt/media:/mnt/media
    ports:
      - "7878:7878"
    restart: unless-stopped

  configarr:
    image: ghcr.io/raydak-labs/configarr:latest
    container_name: configarr
    environment:
      - TZ=America/Chicago
    volumes:
      - ./configarr/config:/app/config
      - ./configarr/dockerrepos:/app/repos
      - ./configarr/custom/cfs:/app/cfs
      - ./configarr/custom/templates:/app/templates
    restart: "no"
