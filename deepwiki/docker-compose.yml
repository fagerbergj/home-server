services:
  deepwiki:
    image: ghcr.io/asyncfuncai/deepwiki-open:sha-cbd1ebd
    container_name: deepwiki
    # No env_file: this image prints its whole environment to stdout at startup,
    # so anything passed in lands in `docker logs`. It clones public repos
    # anonymously and needs no credential of ours.
    environment:
      - PORT=8001
      - NODE_ENV=production
      - SERVER_BASE_URL=http://localhost:8001
      - LITELLM_BASE_URL=http://llm-swap:11436
      - OPENROUTER_BASE_URL=http://llm-swap:11436/v1
      - DEEPWIKI_EMBEDDER_TYPE=litellm
      # adalflow constructs an OpenAI client even under the litellm embedder and
      # hard-fails without these. llm-swap does not authenticate, so the key is a
      # placeholder; the base URL keeps any OpenAI-client path on llm-swap rather
      # than reaching for api.openai.com.
      - OPENAI_API_KEY=noauth
      - OPENAI_BASE_URL=http://llm-swap:11436/v1
      - OPENAI_API_BASE=http://llm-swap:11436/v1
      - EMBEDDING_MODEL=qwen3-embed
      - GENERATOR_MODEL=qwen3.5-9b
      - DEEPWIKI_MAX_CONCURRENT_WIKI_TASKS=1
      - DEEPWIKI_WIKI_PAGE_CONCURRENCY=1
    ports:
      # Broad bind like the arr stack - reachable on the LAN and the tailnet,
      # but never port-forwarded and with no NPM proxy host, so it stays off
      # the public internet.
      - "3007:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deepwiki.rule=Host(`deepwiki.jasonfagerberg.duckdns.org`)"
      - "traefik.http.routers.deepwiki.entrypoints=api"
      - "traefik.http.services.deepwiki.loadbalancer.server.port=3000"
    networks:
      - api_gateway
      - llm_default
    volumes:
      # Both configs pin a provider at llm-swap. EMBEDDING_MODEL/GENERATOR_MODEL
      # are not honoured: the image ships default_provider google and an embedder
      # hardcoded to text-embedding-3-small, so unpinned calls leave the network.
      - ./config/embedder.json:/app/api/config/embedder.json:ro
      - ./config/generator.json:/app/api/config/generator.json:ro
      # Image ships a LiteLLMClient built against a different adalflow: it passes
      # kwargs this one rejects, so the provider TypeErrors before any request.
      - ./config/litellm.py:/app/api/clients/litellm.py:ro
      - ./config/openrouter.py:/app/api/clients/openrouter.py:ro
      - deepwiki-db:/root/.adalflow
      - /home/jason-server/workspace/home-server:/repos/home-server:ro
      - /home/jason-server/workspace/document-pipeline:/repos/document-pipeline:ro
      - /home/jason-server/workspace/games:/repos/games:ro
    restart: unless-stopped

volumes:
  deepwiki-db:

networks:
  api_gateway:
    external: true
  llm_default:
    external: true
