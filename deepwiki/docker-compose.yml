services:
  deepwiki:
    build: ./deepwiki-open
    container_name: deepwiki
    env_file:
      - ../.env
    environment:
      - PORT=8001
      - NODE_ENV=production
      - SERVER_BASE_URL=http://localhost:8001
      - LITELLM_BASE_URL=http://llm-swap:11436
      - DEEPWIKI_EMBEDDER_TYPE=litellm
      - EMBEDDING_MODEL=text-embedding-3-small
      - GENERATOR_MODEL=qwen/qwen2.5-72b-instruct
      - DEEPWIKI_MAX_CONCURRENT_WIKI_TASKS=1
      - DEEPWIKI_WIKI_PAGE_CONCURRENCY=1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deepwiki.rule=Host(`deepwiki.jasonfagerberg.duckdns.org`)"
      - "traefik.http.routers.deepwiki.entrypoints=api"
      - "traefik.http.services.deepwiki.loadbalancer.server.port=3000"
    networks:
      - api_gateway
      - llm_default
    volumes:
      - deepwiki-db:/root/.adalflow
      - /home/fagerbergj/workspace/nightsout:/repos/nightsout:ro
      - /home/fagerbergj/workspace/home-server:/repos/home-server:ro
      - /home/fagerbergj/workspace/dotagents:/repos/dotagents:ro
      - /home/fagerbergj/workspace/document-pipeline:/repos/document-pipeline:ro
      - /home/fagerbergj/workspace/games:/repos/games:ro
    restart: unless-stopped

volumes:
  deepwiki-db:

networks:
  api_gateway:
    external: true
  llm_default:
    external: true
