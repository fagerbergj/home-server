http:
  middlewares:

    # ── Authentik forward auth ─────────────────────────────────────────────────
    # Traefik calls this before routing any protected request.
    # 2xx → request proceeds; X-authentik-* headers forwarded to backend.
    # 401 → browser is redirected to the Authentik login page.
    #
    # Usage in service labels:
    #   traefik.http.routers.<name>.middlewares=authentik@file
    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version

    # ── CORS headers ───────────────────────────────────────────────────────────
    # Attach to public routes that browser JS calls cross-origin.
    #
    # Usage: traefik.http.routers.<name>.middlewares=cors@file
    cors:
      headers:
        accessControlAllowMethods:
          - GET
          - OPTIONS
          - POST
          - PUT
          - DELETE
          - PATCH
        accessControlAllowHeaders:
          - "*"
        accessControlAllowOriginList:
          - "https://api.jasonfagerberg.duckdns.org"
        accessControlMaxAge: 100
        addVaryHeader: true

    # ── Rate limiter ───────────────────────────────────────────────────────────
    # Attach as needed per route.
    #
    # Usage: traefik.http.routers.<name>.middlewares=rate-limit@file
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
