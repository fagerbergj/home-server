# Public LLM API: api.jasonfagerberg.duckdns.org/openai/v1/* -> llm-swap-media
# (the media box's llama-swap, which peers to jaison for the big models).
# The key comes from the traefik container's environment (api/docker-compose.yml
# passes LLM_API_KEY through) via the file provider's Go templating.
http:
  routers:
    llm-swap:
      rule: "Host(`api.jasonfagerberg.duckdns.org`) && PathPrefix(`/openai`)"
      entryPoints: [api]
      middlewares: [llm-apikey, llm-strip]
      service: llm-swap
  services:
    llm-swap:
      loadBalancer:
        servers:
          - url: "http://llm-swap-media:11436"
  middlewares:
    # Public base URL is .../openai/v1 ; strip /openai so llama-swap sees /v1/*
    llm-strip:
      stripPrefix:
        prefixes: ["/openai"]
    # Standard OpenAI auth: Authorization: Bearer <key>. bearerToken mode parses
    # "Bearer <key>" out of headerName, so headerName=Authorization.
    llm-apikey:
      plugin:
        traefik-api-key-auth:
          headerName: Authorization
          bearerToken: true
          keys:
            - "{{ env "LLM_API_KEY" }}"
