# API gateway stack: Traefik + Authentik + Swagger UI + SearXNG + crawl4ai.
# Secrets come from the repo-root export-style .env (`set -a && . ../.env`
# before `docker compose`); this directory has no .env of its own.
# This project owns the shared `api_gateway` network that quack, llm-swap and
# notes join - never `docker compose down` here, it would remove that network.
services:

  # ── Traefik ──────────────────────────────────────────────────────────────────
  # API gateway: path-based routing, Authentik forward auth middleware.
  # NPM proxies api.jasonfagerberg.duckdns.org → :8090.
  traefik:
    image: traefik:v3.6
    container_name: traefik
    ports:
      - "8090:8090"   # NPM ingress
      - "8091:8080"   # Dashboard — http://192.168.50.186:8091/dashboard/ (LAN only)
    environment:
      # read by traefik/dynamic/llm.yml ({{ env "LLM_API_KEY" }}) for the /openai route
      - LLM_API_KEY=${LLM_API_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/dynamic:/dynamic:ro
    restart: unless-stopped
    networks:
      - default
      - api_gateway

  # ── Authentik server + embedded outpost ───────────────────────────────────────
  # Identity provider: OAuth2/OIDC, login UI, session management.
  # The embedded outpost serves /outpost.goauthentik.io/* which Traefik calls
  # for forward auth on protected routes.
  #
  authentik-server:
    image: ghcr.io/goauthentik/server:2025.10
    container_name: authentik-server
    command: server
    ports:
      - "9000:9000"   # LAN only — never forward through NPM
    env_file:
      - ../.env
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST:-}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT:-587}
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD:-}
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL__FROM:-}
    volumes:
      - ./data/authentik-media:/media
      - ./data/authentik-certs:/certs
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
    labels:
      # Route the Authentik outpost endpoint through Traefik so the OIDC
      # redirect flow works under api.jasonfagerberg.duckdns.org
      - "traefik.enable=true"
      - "traefik.http.routers.authentik-outpost.rule=Host(`api.jasonfagerberg.duckdns.org`) && PathPrefix(`/outpost.goauthentik.io`)"
      - "traefik.http.routers.authentik-outpost.entrypoints=api"
      - "traefik.http.services.authentik-outpost.loadbalancer.server.port=9000"
      # Public auth UI at auth.jasonfagerberg.duckdns.org
      - "traefik.http.routers.authentik-ui.rule=Host(`auth.jasonfagerberg.duckdns.org`)"
      - "traefik.http.routers.authentik-ui.entrypoints=api"
      - "traefik.http.services.authentik-ui.loadbalancer.server.port=9000"

  # ── Authentik worker ──────────────────────────────────────────────────────────
  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.10
    container_name: authentik-worker
    command: worker
    env_file:
      - ../.env
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
    volumes:
      - ./data/authentik-media:/media
      - ./data/authentik-certs:/certs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  # ── Authentik Postgres ────────────────────────────────────────────────────────
  authentik-postgres:
    image: postgres:17-alpine
    container_name: authentik-postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${AUTHENTIK_DB_NAME}
      POSTGRES_USER: ${AUTHENTIK_DB_USER}
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
    volumes:
      - ./data/authentik-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTHENTIK_DB_USER} -d ${AUTHENTIK_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Authentik Redis ───────────────────────────────────────────────────────────
  authentik-redis:
    image: redis:alpine
    container_name: authentik-redis
    volumes:
      - ./data/authentik-redis:/data
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Swagger UI ────────────────────────────────────────────────────────────────
  # Public OpenAPI docs at https://api.jasonfagerberg.duckdns.org/docs
  #
  # To add a new service's spec, append to URLS and run:
  #   docker compose up -d swagger-ui
  #
  # Example URLS entry:
  #   {"url": "https://api.jasonfagerberg.duckdns.org/api/v1/documents/openapi.json", "name": "Documents"}
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui
    environment:
      BASE_URL: /docs
      URLS: '[{"url": "https://api.jasonfagerberg.duckdns.org/api/v1/documents/openapi.json", "name": "Documents"}]'
    restart: unless-stopped
    networks:
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.swagger-ui.rule=Host(`api.jasonfagerberg.duckdns.org`) && PathPrefix(`/docs`)"
      - "traefik.http.routers.swagger-ui.entrypoints=api"
      - "traefik.http.services.swagger-ui.loadbalancer.server.port=8080"
      # Public — no auth middleware

  # ── OpenSearch ────────────────────────────────────────────────────────────────
  # Single-node full-text search index for document-pipeline Lucene queries.
  # Other services can create their own indices on the same instance.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    environment:
      # Overrides server.secret_key at load time (settings_defaults.py); real
      # value comes from the gitignored root .env, not the committed settings.
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - default
      - api_gateway

  # ── crawl4ai (render + extract) ───────────────────────────────────────────────
  # Keyless render/scrape backend, replaces browserless. Quack's `web_fetch` tool
  # POSTs a URL to http://crawl4ai:11235/md and gets back clean Markdown (links
  # preserved) — it fetches + JS-renders (Playwright) + Readability-filters in one
  # call, and clears more anti-bot walls than a bare browserless render. Pairs with
  # SearXNG: search returns URLs, crawl4ai reads the ones worth reading.
  #
  # Keyless: JWT auth is off by default (security.jwt_enabled: false). No Traefik
  # route — internal networks only. NB: it renders arbitrary URLs server-side, so
  # the caller must guard against SSRF (see setup.md).
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    # Browser pool needs shared memory; the default 64MB /dev/shm crashes Chromium.
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - default
      - api_gateway

networks:
  default:
  api_gateway:
    name: api_gateway   # explicit name so external services can reference it
  llm_default:
    external: true
