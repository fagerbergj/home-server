services:

  # ── Traefik ──────────────────────────────────────────────────────────────────
  # API gateway: path-based routing, Authentik forward auth middleware.
  # NPM proxies api.jasonfagerberg.duckdns.org → :8090.
  traefik:
    image: traefik:v3.6
    container_name: traefik
    ports:
      - "8090:8090"   # NPM ingress
      - "8091:8080"   # Dashboard — http://192.168.50.186:8091/dashboard/ (LAN only)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/dynamic:/dynamic:ro
    restart: unless-stopped
    networks:
      - default
      - api_gateway

  # ── Authentik server + embedded outpost ───────────────────────────────────────
  # Identity provider: OAuth2/OIDC, login UI, session management.
  # The embedded outpost serves /outpost.goauthentik.io/* which Traefik calls
  # for forward auth on protected routes.
  #
  authentik-server:
    image: ghcr.io/goauthentik/server:2025.10
    container_name: authentik-server
    command: server
    ports:
      - "9000:9000"   # LAN only — never forward through NPM
    env_file:
      - ../.env
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST:-}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT:-587}
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD:-}
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL__FROM:-}
    volumes:
      - ./data/authentik-media:/media
      - ./data/authentik-certs:/certs
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
    labels:
      # Route the Authentik outpost endpoint through Traefik so the OIDC
      # redirect flow works under api.jasonfagerberg.duckdns.org
      - "traefik.enable=true"
      - "traefik.http.routers.authentik-outpost.rule=Host(`api.jasonfagerberg.duckdns.org`) && PathPrefix(`/outpost.goauthentik.io`)"
      - "traefik.http.routers.authentik-outpost.entrypoints=api"
      - "traefik.http.services.authentik-outpost.loadbalancer.server.port=9000"
      # Public auth UI at auth.jasonfagerberg.duckdns.org
      - "traefik.http.routers.authentik-ui.rule=Host(`auth.jasonfagerberg.duckdns.org`)"
      - "traefik.http.routers.authentik-ui.entrypoints=api"
      - "traefik.http.services.authentik-ui.loadbalancer.server.port=9000"

  # ── Authentik worker ──────────────────────────────────────────────────────────
  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.10
    container_name: authentik-worker
    command: worker
    env_file:
      - ../.env
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
    volumes:
      - ./data/authentik-media:/media
      - ./data/authentik-certs:/certs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  # ── Authentik Postgres ────────────────────────────────────────────────────────
  authentik-postgres:
    image: postgres:17-alpine
    container_name: authentik-postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${AUTHENTIK_DB_NAME}
      POSTGRES_USER: ${AUTHENTIK_DB_USER}
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
    volumes:
      - ./data/authentik-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTHENTIK_DB_USER} -d ${AUTHENTIK_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Authentik Redis ───────────────────────────────────────────────────────────
  authentik-redis:
    image: redis:alpine
    container_name: authentik-redis
    volumes:
      - ./data/authentik-redis:/data
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Swagger UI ────────────────────────────────────────────────────────────────
  # Public OpenAPI docs at https://api.jasonfagerberg.duckdns.org/docs
  #
  # To add a new service's spec, append to URLS and run:
  #   docker compose up -d swagger-ui
  #
  # Example URLS entry:
  #   {"url": "https://api.jasonfagerberg.duckdns.org/api/v1/documents/openapi.json", "name": "Documents"}
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui
    environment:
      BASE_URL: /docs
      URLS: '[{"url": "https://api.jasonfagerberg.duckdns.org/api/v1/documents/openapi.json", "name": "Documents"}]'
    restart: unless-stopped
    networks:
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.swagger-ui.rule=Host(`api.jasonfagerberg.duckdns.org`) && PathPrefix(`/docs`)"
      - "traefik.http.routers.swagger-ui.entrypoints=api"
      - "traefik.http.services.swagger-ui.loadbalancer.server.port=8080"
      # Public — no auth middleware

  # ── OpenSearch ────────────────────────────────────────────────────────────────
  # Single-node full-text search index for document-pipeline Lucene queries.
  # Other services can create their own indices on the same instance.
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    # Single-node never reaches green (no replica to allocate), so wait for
    # yellow. Lets dependents gate on actual readiness instead of just process
    # start — document-pipeline used to race the boot and disable search.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - default

  # ── Shared PostgreSQL ─────────────────────────────────────────────────────────
  # Single Postgres instance for all services; each service uses its own schema.
  shared-postgres:
    image: postgres:17-alpine
    container_name: shared-postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${SHARED_DB_USER}
      POSTGRES_PASSWORD: ${SHARED_DB_PASSWORD}
      POSTGRES_DB: shared
    volumes:
      - ./data/shared-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHARED_DB_USER} -d shared"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  # ── Document Pipeline ─────────────────────────────────────────────────────────
  # OCR + classification pipeline for reMarkable documents.
  # Receives webhook from rmfakecloud (notes stack) on new uploads.
  document-pipeline:
    image: document-pipeline:latest
    container_name: document-pipeline
    env_file:
      - ../.env
    environment:
      - OCR_MODEL=${OCR_MODEL}
      - CLARIFY_MODEL=${CLARIFY_MODEL}
      - CLASSIFY_MODEL=${CLASSIFY_MODEL}
      - EMBED_MODEL=${EMBED_MODEL}
      - CONTEXTUAL_MODEL=${CONTEXTUAL_MODEL}
      - CHAT_MODEL=${CHAT_MODEL}
      - LLM_URL=http://llm-swap:11436
      - LLM_API_KEY=${LLM_API_KEY:-}
      - WHISPER_URL=${WHISPER_URL:-http://faster-whisper:8000}
      - WHISPER_MODEL=${WHISPER_MODEL:-Systran/faster-whisper-large-v3}
      - SUMMARIZE_MODEL=${SUMMARIZE_MODEL:-${CLARIFY_MODEL}}
      - VAULT_PATH=/vault
      - DATABASE_URL=postgresql://${SHARED_DB_USER}:${SHARED_DB_PASSWORD}@shared-postgres:5432/shared?search_path=document_pipeline
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-documents}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - OPEN_WEBUI_URL=${OPEN_WEBUI_URL}
      - OPEN_WEBUI_API_KEY=${OPEN_WEBUI_API_KEY}
      - OPEN_WEBUI_KNOWLEDGE_ID=${OPEN_WEBUI_KNOWLEDGE_ID}
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_INDEX=${OPENSEARCH_INDEX:-documents}
      - PIPELINE_SYSTEM_USER_ID=4fc55e8a27ebf91f9650c48a59468793350b8d49b4777021966e2eb2d2b0dfb5
    depends_on:
      shared-postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    volumes:
      - /mnt/personal/documents:/vault
      - remarkable-bridge-data:/data
    networks:
      - default
      - api_gateway
      - llm_default
      - audio_default
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.document-pipeline.loadbalancer.server.port=8000"
      # Protected: all /api/v1/documents routes require Authentik login
      - "traefik.http.routers.document-pipeline.rule=Host(`api.jasonfagerberg.duckdns.org`) && PathPrefix(`/api/v1/documents`)"
      - "traefik.http.routers.document-pipeline.entrypoints=api"
      - "traefik.http.routers.document-pipeline.service=document-pipeline"
      - "traefik.http.routers.document-pipeline.middlewares=authentik@file"
      # Chat routes: protected by Authentik
      - "traefik.http.routers.document-pipeline-chats.rule=Host(`api.jasonfagerberg.duckdns.org`) && PathPrefix(`/api/v1/chats`)"
      - "traefik.http.routers.document-pipeline-chats.entrypoints=api"
      - "traefik.http.routers.document-pipeline-chats.service=document-pipeline"
      - "traefik.http.routers.document-pipeline-chats.middlewares=authentik@file"
      # Public: OpenAPI spec (Swagger UI fetches this without auth)
      - "traefik.http.routers.document-pipeline-spec.rule=Host(`api.jasonfagerberg.duckdns.org`) && Path(`/api/v1/documents/openapi.json`)"
      - "traefik.http.routers.document-pipeline-spec.entrypoints=api"
      - "traefik.http.routers.document-pipeline-spec.service=document-pipeline"
      # UI: documents.jasonfagerberg.duckdns.org
      - "traefik.http.services.document-pipeline-ui.loadbalancer.server.port=8000"
      - "traefik.http.routers.document-pipeline-ui.rule=Host(`documents.jasonfagerberg.duckdns.org`)"
      - "traefik.http.routers.document-pipeline-ui.entrypoints=api"
      - "traefik.http.routers.document-pipeline-ui.service=document-pipeline-ui"
      - "traefik.http.routers.document-pipeline-ui.middlewares=authentik@file"

networks:
  default:
  api_gateway:
    name: api_gateway   # explicit name so external services can reference it
  llm_default:
    external: true
  audio_default:
    external: true

volumes:
  remarkable-bridge-data:
  opensearch-data:
