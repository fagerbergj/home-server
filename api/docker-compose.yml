services:
  document-pipeline:
    # Published by document-pipeline's publish.yml on every push to main.
    # Pin to an immutable X.Y.Z here when a deploy should be deliberate.
    image: ghcr.io/fagerbergj/document-pipeline:latest
    container_name: document-pipeline
    environment:
      - OCR_MODEL=${OCR_MODEL}
      - CLARIFY_MODEL=${CLARIFY_MODEL}
      - CLASSIFY_MODEL=${CLASSIFY_MODEL}
      - EMBED_MODEL=${EMBED_MODEL}
      - CONTEXTUAL_MODEL=${CONTEXTUAL_MODEL}
      - CHAT_MODEL=${CHAT_MODEL}
      - LLM_URL=http://llm-swap:11436
      - LLM_API_KEY=${LLM_API_KEY:-}
      - WHISPER_URL=${WHISPER_URL:-http://faster-whisper:8000}
      - WHISPER_MODEL=${WHISPER_MODEL:-Systran/faster-whisper-large-v3}
      - SUMMARIZE_MODEL=${SUMMARIZE_MODEL:-${CLARIFY_MODEL}}
      - VAULT_PATH=/vault
      - DATABASE_URL=postgresql://${SHARED_DB_USER}:${SHARED_DB_PASSWORD}@shared-postgres:5432/shared?search_path=document_pipeline
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-documents}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - OPEN_WEBUI_URL=${OPEN_WEBUI_URL}
      - OPEN_WEBUI_API_KEY=${OPEN_WEBUI_API_KEY}
      - OPEN_WEBUI_KNOWLEDGE_ID=${OPEN_WEBUI_KNOWLEDGE_ID}
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_INDEX=${OPENSEARCH_INDEX:-documents}
      - PIPELINE_SYSTEM_USER_ID=4fc55e8a27ebf91f9650c48a59468793350b8d49b4777021966e2eb2d2b0dfb5
      # Read via os.Getenv, never interpolated here - unset leaves the MCP
      # endpoint unauthenticated rather than failing, so it must be named.
      - MCP_API_KEY=${MCP_API_KEY}
    depends_on:
      shared-postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    volumes:
      - /mnt/personal/documents:/vault
      - remarkable-bridge-data:/data
    networks:
      - default
      - api_gateway
      - llm_default
      - audio_default
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.document-pipeline.loadbalancer.server.port=8000"
      - "traefik.http.routers.document-pipeline-mcp.rule=Host(`api.jasonfagerberg.duckdns.org`) && PathPrefix(`/api/v1/documents/mcp`)"
      - "traefik.http.routers.document-pipeline-mcp.entrypoints=api"
      - "traefik.http.routers.document-pipeline-mcp.service=document-pipeline"
      - "traefik.http.routers.document-pipeline.rule=Host(`api.jasonfagerberg.duckdns.org`) && PathPrefix(`/api/v1/documents`) && !PathPrefix(`/api/v1/documents/mcp`)"
      - "traefik.http.routers.document-pipeline.entrypoints=api"
      - "traefik.http.routers.document-pipeline.service=document-pipeline"
      - "traefik.http.routers.document-pipeline.middlewares=authentik@file"
      - "traefik.http.routers.document-pipeline-chats.rule=Host(`api.jasonfagerberg.duckdns.org`) && PathPrefix(`/api/v1/chats`)"
      - "traefik.http.routers.document-pipeline-chats.entrypoints=api"
      - "traefik.http.routers.document-pipeline-chats.service=document-pipeline"
      - "traefik.http.routers.document-pipeline-chats.middlewares=authentik@file"
      - "traefik.http.routers.document-pipeline-spec.rule=Host(`api.jasonfagerberg.duckdns.org`) && Path(`/api/v1/documents/openapi.json`)"
      - "traefik.http.routers.document-pipeline-spec.entrypoints=api"
      - "traefik.http.routers.document-pipeline-spec.service=document-pipeline"
      - "traefik.http.services.document-pipeline-ui.loadbalancer.server.port=8000"
      - "traefik.http.routers.document-pipeline-ui.rule=Host(`documents.jasonfagerberg.duckdns.org`)"
      - "traefik.http.routers.document-pipeline-ui.entrypoints=api"
      - "traefik.http.routers.document-pipeline-ui.service=document-pipeline-ui"
      - "traefik.http.routers.document-pipeline-ui.middlewares=authentik@file"

  shared-postgres:
    image: postgres:17-alpine
    container_name: shared-postgres
    environment:
      POSTGRES_USER: ${SHARED_DB_USER}
      POSTGRES_PASSWORD: ${SHARED_DB_PASSWORD}
      POSTGRES_DB: shared
    volumes:
      - ./data/shared-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHARED_DB_USER} -d shared"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  opensearch:
    image: opensearchproject/opensearch:3
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - default

networks:
  default:
  api_gateway:
    name: api_gateway
  llm_default:
    external: true
  audio_default:
    external: true

volumes:
  remarkable-bridge-data:
  opensearch-data:
