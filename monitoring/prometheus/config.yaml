global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['192.168.50.186:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: nvidia
    static_configs:
      - targets: ['nvidia-exporter:9835']

  - job_name: smartctl
    static_configs:
      - targets: ['smartctl-exporter:9633']
