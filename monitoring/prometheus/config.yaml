global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['192.168.50.186:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: amd_gpu
    static_configs:
      - targets: ['amd-exporter:5000']

  - job_name: smartctl
    static_configs:
      - targets: ['smartctl-exporter:9633']

  - job_name: otel-collector   # quack's OTel metrics (staged with the tempo/collector services)
    static_configs:
      - targets: ['otel-collector:8889']
