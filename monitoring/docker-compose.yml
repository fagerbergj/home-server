services:
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    hostname: jason-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19999/api/v1/alive"]
      interval: 1m
      timeout: 10s
      retries: 3
    ports:
      - "19999:19999"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./config:/etc/netdata
      - ./lib:/var/lib/netdata
      - ./cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/plex01:/mnt/plex01
      - /mnt/plex02:/mnt/plex02
      - /mnt/personal01:/mnt/personal01
    restart: unless-stopped
