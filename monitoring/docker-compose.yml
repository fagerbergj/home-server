services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ./grafana:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
      - ./grafana-dashboards:/var/lib/grafana/dashboards
    environment:
      - TZ=America/Chicago
    ports:
      - "3004:3000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/config.yaml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "9090:9090"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: host
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --housekeeping_interval=10s
      - --docker_only=true
    ports:
      - "8082:8080"
    restart: unless-stopped

  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:latest
    container_name: smartctl-exporter
    user: root
    privileged: true
    security_opt:
      - apparmor:unconfined
    volumes:
      - /dev:/dev
    command:
      - --smartctl.device=/dev/sda
      - --smartctl.device=/dev/sdb
      - --smartctl.device=/dev/sdc
      - --smartctl.device=/dev/sdd
      - --smartctl.device=/dev/sde
      - --smartctl.device=/dev/sdf
      - --smartctl.device=/dev/nvme0n1
    ports:
      - "9633:9633"
    restart: unless-stopped

  amd-exporter:
    image: rocm/device-metrics-exporter:v1.5.1
    container_name: amd-exporter
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    volumes:
      - /sys:/sys:ro
    ports:
      - "9836:5000"
    restart: unless-stopped

  # ---- OTel spine for quack (staged 2026-07-17; see quack .quack/otel-observability-plan.md)
  # otel-collector joins the shared llm_default network so the quack container
  # reaches it as http://otel-collector:4318 (same pattern quack->llm-swap uses).
  # Grafana is the trace UI (Tempo datasource provisioned) — no bespoke React.
  tempo:
    image: grafana/tempo:3.0.3
    container_name: tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - ./tempo/data:/var/tempo
    ports:
      - "100.81.155.8:3200:3200" # Tempo query API on the TAILSCALE interface only —
                                 # curl/TraceQL from first-party tooling (same pattern
                                 # as quack's 18080); Grafana still uses the internal net
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      # Basic <base64 pk:sk> for langfuse ingest — see monitoring/.env.example.
      - LANGFUSE_OTLP_AUTH=${LANGFUSE_OTLP_AUTH}
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - default
      - llm_default
      - langfuse_default
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - ./uptime-kuma:/app/data
    restart: unless-stopped

networks:
  llm_default:
    external: true
  langfuse_default:
    external: true
