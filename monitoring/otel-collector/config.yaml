# Routes quack's OTLP: traces -> tempo, metrics -> prometheus scrape (:8889).
# Logs stay on slog/stdout for now (Loki is a later, separate decision).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Reached over the shared langfuse_default network (same external-network
  # pattern as llm_default). otlphttp appends /v1/traces to this endpoint.
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: ${env:LANGFUSE_OTLP_AUTH}
  prometheus:
    endpoint: 0.0.0.0:8889
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, otlphttp/langfuse]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
