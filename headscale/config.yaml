# Headscale: self-hosted Tailscale control server, on trial beside Tailscale (see README).
server_url: https://headscale.jasonfagerberg.duckdns.org
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# Tailscale's public relays only carry already-encrypted packets; the embedded DERP needs UDP 3478 forwarded
derp:
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: true
  update_frequency: 3h

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

log:
  level: info

# no policy file: every node can reach every node, fine while only my devices are enrolled
policy:
  mode: file
  path: ""

dns:
  magic_dns: true
  base_domain: hs.internal
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"
