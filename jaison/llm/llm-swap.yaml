# jaison: one llama-swap for all four R9700s; each model is a `docker run` it starts and stops.
# Bind-mount paths in cmds are HOST paths (the daemon resolves them).
healthCheckTimeout: 1200   # vLLM cold torch.compile; 256k KV pools
timeouts:
  responseHeader: 0   # never guillotine long first-byte waits
logLevel: info
hooks:
  on_startup:
    preload: ["qwen3-embed"]

macros:
  hf: /mnt/cache/huggingface
  llm_dir: /home/jason/workspace/home-server/jaison/llm
  gpu: >
    --device /dev/kfd --device /dev/dri --group-add video --group-add 991
  llama_common: >
    --jinja --reasoning-format deepseek
    --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0
    -fa on -ngl 999 --cache-type-k q8_0 --cache-type-v q8_0 --metrics --host 0.0.0.0

groups:
  # The embedder sits outside every exclusive group: persistent, so no swap ever unloads it.
  "embed":
    swap: false
    exclusive: false
    persistent: true
    members: ["qwen3-embed"]
  # Resident default. exclusive: loading it unloads everything else (GLM).
  "27b":
    swap: false
    exclusive: true
    members: ["qwen3.8-27b"]
  # Whole box + host RAM: GLM IQ4_XS on four cards, ~70 GB of experts in RAM. Drains/unloads the 27B.
  "glm":
    swap: true
    exclusive: true
    members: ["glm-5.3-flash"]
  # Eval only: Ornith Q5 tensor-split over four cards. Drains/unloads the 27B.
  "ornith":
    swap: true
    exclusive: true
    members: ["ornith-1.5-122b"]

models:
  # Qwen3-Embedding-4B Q8 on the CPU (the cards belong to the big models); the media router reaches it through its peers list.
  # 2560-dim: switching embed models means dropping quack's Qdrant collections. 17-token query ~62 ms, 674-token doc ~2.0 s at -t 24.
  "qwen3-embed":
    proxy: "http://127.0.0.1:9995"
    ttl: 0
    cmd: >
      docker run --rm --init --name embed --no-healthcheck
      -v ${hf}:/root/.cache/huggingface:ro -p 127.0.0.1:9995:9995
      ghcr.io/ggml-org/llama.cpp:server-b11371
      -m /root/.cache/huggingface/hub/models--Qwen--Qwen3-Embedding-4B-GGUF/snapshots/f4602530db1d980e16da9d7d3a70294cf5c190be/Qwen3-Embedding-4B-Q8_0.gguf
      --embedding --pooling last -ngl 0 -t 24
      -c 16384 --parallel 4 -ub 2048 -b 2048
      --host 0.0.0.0 --port 9995 --metrics
    cmdStop: docker stop embed

  # vLLM TP=4, FP8 weights + DFlash2 draft: 90k 3813 prefill / 108 decode t/s (int4 was 126; 8-bit chosen for quality). MAXSEQS 6, bf16 KV. ttl 0: resident; GLM swaps it out.
  "qwen3.8-27b":
    proxy: "http://127.0.0.1:9993"
    checkEndpoint: /health
    useModelName: qwen3.8-27b-vllm   # what the launcher registers with vLLM
    ttl: 0
    env:
      - "GPU=0,1,2,3"
      - "TP=4"
      - "MAXLEN=262144"
      - "MAXSEQS=6"   # bf16 KV pool ~1.15M tokens = 4 worst-case 262k seqs; vLLM queues beyond that, never OOMs
      - "KV_DTYPE=bfloat16"   # ~1 pt quality over fp8 KV; no measured speed cost on gfx1201
      - "PORT=9993"
      - "NAME=qwen38-27b-vllm"
      - "IMAGE=docker.io/stilldeadcode/vllm-radiance:0.9.3"
      - "MODEL_DIR=/mnt/cache/vllm/qwen3.8-27b-fp8"
      - "QUANT=fp8"   # official Qwen block-fp8; launcher defaults to auto_gptq for AutoRound
      - "DRAFT_DIR=/mnt/cache/vllm/qwen3.8-27b-dflash2-int4"
      - "CACHE_DIR=/mnt/cache/vllm/cache"
      - "REASONING_EFFORT=medium"
      - "MAX_NEW_TOKENS=32768"   # 16k cut heavy plan-writing steps mid-think (empty outputs)
      - "PATCH_DIR=/home/jason/workspace/home-server/jaison/llm/vllm-patches"   # macros do not expand in env
    cmd: ${llm_dir}/run-jaison.sh
    cmdStop: docker stop -t 120 qwen38-27b-vllm   # hard kills of a TP vLLM wedge the GPU (MES/sdma reset); let it drain

  # GLM-5.3-Flash 320B/A18B, llama.cpp b11580 + glm/patches (RDNA4 sparse FA). UD-IQ4_XS, own MTP head n2, q8_0 KV:
  # 1 stream ~21 t/s code / ~20 prose, 4 streams ~26 aggregate. Prefill 294 t/s @30k, 268 @106k, 246 @170k;
  # 4 x 256k slots still lean on prompt-prefix reuse. See run-glm.sh.
  "glm-5.3-flash":
    proxy: "http://127.0.0.1:9998"
    checkEndpoint: /health
    ttl: 3600
    env:
      - "PORT=9998"
      - "NAME=glm"
    cmd: ${llm_dir}/run-glm.sh
    cmdStop: docker stop glm

  # Ornith-1.5-122B (Flash-Next fine-tune) UD-Q5_K_XL, ~95 GB, tensor split; no MTP file shipped, so no drafting.
  "ornith-1.5-122b":
    proxy: "http://127.0.0.1:9992"
    checkEndpoint: /health
    ttl: 3600
    env:
      - "PORT=9992"
      - "NAME=ornith"
      - "REPO=unsloth--Ornith-1.5-122B-GGUF"
      - "QUANT=UD-Q5_K_XL"
      - "PARALLEL=2"
      - "CTX=524288"   # 2 x 262k; only every 4th layer keeps KV
    cmd: ${llm_dir}/run-flashnext.sh
    cmdStop: docker stop ornith
