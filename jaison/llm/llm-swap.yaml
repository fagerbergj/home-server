# jaison: one llama-swap for both R9700s. Every model is a `docker run` of its own
# runtime image; llama-swap starts/stops those containers like processes. Bind-mount
# paths in the cmds are HOST paths (the daemon resolves them), so this container
# mounts this dir at its host path and runs the vLLM launcher from there.
healthCheckTimeout: 1200   # vLLM cold torch.compile; 256k KV pools
logLevel: info

macros:
  hf: /mnt/cache/huggingface
  llm_dir: /home/jason/workspace/home-server/jaison/llm
  gpu: >
    --device /dev/kfd --device /dev/dri --group-add video --group-add 991
  llama_common: >
    --jinja --reasoning-format deepseek
    --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0
    -fa on -ngl 999 --cache-type-k q8_0 --cache-type-v q8_0 --metrics --host 0.0.0.0

groups:
  # Resident default. exclusive: loading it unloads everything else (Flash-Next).
  "27b":
    swap: false
    exclusive: true
    members: ["qwen3.8-27b"]
  # Whole box: both cards + CPU experts. Loading it drains and unloads the 27B.
  "flash-next":
    swap: true
    exclusive: true
    members: ["qwen3.8-flash-next"]
  # On-demand extras (Vulkan llama.cpp); they evict each other and the groups above.
  "extras":
    swap: true
    exclusive: true
    members: ["qwen3-omni-30b", "muse-glimmer-30b"]

models:
  # Dense 27B on vLLM, TP=2 across both cards, one id for worker and judge (alias).
  # int4 AutoRound + DFlash2 W4A16 draft, 262k context, 2 concurrent sequences.
  # Measured 2026-08-30: 90k prompt 2455 prefill / 106 decode t/s (llama.cpp DFlash2
  # on one card: ~650 / 39); two concurrent 90k streams 74 + 62 t/s. Boot ~3 min warm.
  # ttl 0: stays resident; Flash-Next requests swap it out, and the next 27B call
  # pays the boot.
  "qwen3.8-27b":
    aliases: ["qwen3.8-27b-judge"]
    proxy: "http://127.0.0.1:9993"
    checkEndpoint: /health
    ttl: 0
    env:
      - "GPU=0,1"
      - "TP=2"
      - "MAXLEN=262144"
      - "MAXSEQS=2"
      - "PORT=9993"
      - "NAME=qwen38-27b-vllm"
      - "IMAGE=docker.io/stilldeadcode/vllm-radiance:0.9.3"
      - "MODEL_DIR=/mnt/cache/vllm/qwen3.8-27b-autoround"
      - "DRAFT_DIR=/mnt/cache/vllm/qwen3.8-27b-dflash2-int4"
      - "CACHE_DIR=/mnt/cache/vllm/cache"
      - "REASONING_EFFORT=medium"
      - "PATCH_DIR=${llm_dir}/vllm-patches"
    cmd: ${llm_dir}/run-jaison.sh
    cmdStop: docker stop qwen38-27b-vllm

  # Qwen3.8-Flash-Next 125B-A6B + 51B n-gram table, UD-Q3_K_XL, on the MTP fork image
  # (llm/mtp, `make mtp-image`; PR 27836 not merged). MTP n3 p0.75: 28/28/21.6 t/s
  # (prose/code/5k) vs 23/23/20 with ngram-mod. -ncmoe 8 + -ot pin the n-gram table
  # to CPU; -ts leans on card 0 because -ncmoe offloads the FIRST N layers.
  "qwen3.8-flash-next":
    proxy: "http://127.0.0.1:9992"
    ttl: 3600
    cmd: >
      docker run --rm --init --name flash-next ${gpu}
      -e HF_HUB_OFFLINE=1 -e GPU_MAX_HW_QUEUES=1
      -v ${hf}:/root/.cache/huggingface:ro -p 127.0.0.1:9992:9992
      llama-mtp:gfx1201
      -m /root/.cache/huggingface/hub/models--unsloth--Qwen3.8-Flash-Next-GGUF/snapshots/8bdc666649440e9bdc97e16f3f75782c98478ff5/UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf
      --mmproj /root/.cache/huggingface/hub/models--unsloth--Qwen3.8-Flash-Next-GGUF/snapshots/178b998806b7b406c311a3e6174aa99cf6304eaf/mmproj-BF16.gguf
      ${llama_common}
      --split-mode layer -ts 0.58,0.42 -ncmoe 8 -ot "per_layer_token_embd=CPU"
      -c 131072 --parallel 1 -t 12 -ub 1024 -b 2048
      -md /root/.cache/huggingface/hub/models--dzannotti--Qwen3.8-Flash-Next-MTP-GGUF/snapshots/0b2551d191548168d3254ddea4ab943a5ef4f809/Qwen3.8-Flash-Next-MTP-Q4_K_M.gguf
      --spec-type draft-mtp --spec-draft-n-max 3 --spec-draft-p-min 0.75
      --port 9992
    cmdStop: docker stop flash-next

  # Audio-capable media reader (the 27B has vision, not audio). Vulkan llama.cpp.
  "qwen3-omni-30b":
    proxy: "http://127.0.0.1:9999"
    ttl: 1800
    cmd: >
      docker run --rm --init --name omni ${gpu}
      -e HF_HUB_OFFLINE=1
      -v ${hf}:/root/.cache/huggingface:ro -p 127.0.0.1:9999:9999
      ghcr.io/ggml-org/llama.cpp:server-vulkan
      -m /root/.cache/huggingface/Qwen3-Omni-30B-A3B-Instruct-Q4_K_M.gguf
      --mmproj /root/.cache/huggingface/mmproj-Qwen3-Omni-30B-A3B-Instruct-bf16.gguf
      ${llama_common}
      --reasoning-budget 512 --presence-penalty 1.5 --temp 0.6
      --split-mode layer -c 32768 --parallel 1 -ub 2048 -b 2048
      --image-min-tokens 2048 --image-max-tokens 8192
      --port 9999
    cmdStop: docker stop omni

  # Untested agentic candidate; kept loadable.
  "muse-glimmer-30b":
    proxy: "http://127.0.0.1:9996"
    ttl: 600
    cmd: >
      docker run --rm --init --name muse ${gpu}
      -e HF_HUB_OFFLINE=1
      -v ${hf}:/root/.cache/huggingface:ro -p 127.0.0.1:9996:9996
      ghcr.io/ggml-org/llama.cpp:server-vulkan
      -m /root/.cache/huggingface/hub/models--unsloth--Muse-Glimmer-30B-GGUF/snapshots/faa5b025c584459c13febfa5c59883516710ae39/Muse-Glimmer-30B-UD-Q4_K_XL.gguf
      --mmproj /root/.cache/huggingface/hub/models--unsloth--Muse-Glimmer-30B-GGUF/snapshots/faa5b025c584459c13febfa5c59883516710ae39/mmproj-Muse-Glimmer-30B-Q8_0.gguf
      ${llama_common}
      --top-k 64 -c 131072 --parallel 1 -ub 2048 -b 2048
      --port 9996
    cmdStop: docker stop muse
