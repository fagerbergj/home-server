# jaison: one llama-swap for all four R9700s; each model is a `docker run` it starts and stops.
# Bind-mount paths in cmds are HOST paths (the daemon resolves them).
healthCheckTimeout: 2400   # vLLM cold torch.compile; large mmap + KV pools can run past 20 min cold
timeouts:
  responseHeader: 0   # never guillotine long first-byte waits
logLevel: info
hooks:
  on_startup:
    preload: ["qwen3-embed", "qwen3.8-flash-next"]

macros:
  hf: /mnt/cache/huggingface
  llm_dir: /home/jason/workspace/home-server/jaison/llm

groups:
  # The embedder sits outside every exclusive group: persistent, so no swap ever unloads it.
  "embed":
    swap: false
    exclusive: false
    persistent: true
    members: ["qwen3-embed"]
  # Resident default (Strata strata-split-4-amd + DFlash2 + Vision, 199.6 tok/s decode, 416k INT8 KV).
  "flash-next":
    swap: false
    exclusive: true
    members: ["qwen3.8-flash-next"]
  # On-demand fallback (vLLM FP8 TP4 + DFlash2 + rank-96 super-adapter LoRA).
  "27b":
    swap: true
    exclusive: true
    members: ["qwen3.8-27b"]
  # Whole box + host RAM, 63.5 GB Engram table paged from NVMe. Drains/unloads the resident model.
  "hy4":
    swap: true
    exclusive: true
    members: ["hy4-flash"]

models:
  # Qwen3-Embedding-4B Q8 on the CPU (the cards belong to the big models); the media router reaches it through its peers list.
  # 2560-dim: switching embed models means dropping quack's Qdrant collections. 17-token query ~62 ms, 674-token doc ~2.0 s at -t 24.
  # -ub 4096 -b 4096 matches the 4096-token per-slot context window (embedding inputs must fit in one ubatch).
  "qwen3-embed":
    concurrencyLimit: 1000
    proxy: "http://127.0.0.1:9995"
    checkEndpoint: /health
    ttl: 0
    cmd: >
      docker run --rm --init --name embed --no-healthcheck
      -v ${hf}:/root/.cache/huggingface:ro -p 127.0.0.1:9995:9995
      ghcr.io/ggml-org/llama.cpp:server-b11371
      -m /root/.cache/huggingface/hub/models--Qwen--Qwen3-Embedding-4B-GGUF/snapshots/f4602530db1d980e16da9d7d3a70294cf5c190be/Qwen3-Embedding-4B-Q8_0.gguf
      --embedding --pooling last -ngl 0 -t 24
      -c 16384 --parallel 4 -ub 4096 -b 4096
      --host 0.0.0.0 --port 9995 --metrics
    cmdStop: docker stop embed

  # Qwen3.8-Flash-Next via Strata v0.2.19 (strata-split-4-amd + DFlash2 + GPU Vision, UD-Q4_K_XL).
  # Resident default: 199.6 tok/s coding decode, 167 tok/s 4-way aggregate, 416k INT8 KV (262k ctx, 8 lanes),
  # 32.6s cold boot. See run-flashnext-strata.sh.
  "qwen3.8-flash-next":
    concurrencyLimit: 1000   # backpressure is the engine's (Strata queues past its 8 lanes); the router must not 429 quack's judge fan-out
    proxy: "http://127.0.0.1:9994"
    checkEndpoint: /health
    ttl: 0
    env:
      - "PORT=9994"
      - "NAME=flash-next"
    cmd: ${llm_dir}/run-flashnext-strata.sh
    cmdStop: docker stop -t 60 flash-next

  # vLLM TP=4, FP8 weights (harness-hub super-adapter offline-merged via merge-lora-fp8.py) + DFlash2 draft.
  # 131 tok/s single-stream decode (vs 73 tok/s with runtime LoRA), 1.18M bf16 KV pool (4.5x @ 262k). On-demand fallback.
  "qwen3.8-27b":
    concurrencyLimit: 1000
    proxy: "http://127.0.0.1:9993"
    checkEndpoint: /health
    useModelName: qwen3.8-27b-vllm
    ttl: 3600
    env:
      - "GPU=0,1,2,3"
      - "TP=4"
      - "MAXLEN=262144"
      - "MAXSEQS=6"   # bf16 KV pool ~1.18M tokens = 4.5 worst-case 262k seqs; vLLM queues beyond that, never OOMs
      - "KV_DTYPE=bfloat16"   # ~1 pt quality over fp8 KV; no measured speed cost on gfx1201
      - "PORT=9993"
      - "NAME=qwen38-27b-vllm"
      - "IMAGE=docker.io/stilldeadcode/vllm-radiance:0.9.3"
      - "MODEL_DIR=/mnt/cache/vllm/qwen3.8-27b-super-fp8"   # super-adapter merged offline into Qwen block-fp8
      - "QUANT=fp8"   # official Qwen block-fp8; launcher defaults to auto_gptq for AutoRound
      - "DRAFT_DIR=/mnt/cache/vllm/qwen3.8-27b-dflash2-int4"
      - "CACHE_DIR=/mnt/cache/vllm/cache"
      - "REASONING_EFFORT=medium"
      - "MAX_NEW_TOKENS=32768"   # 16k cut heavy plan-writing steps mid-think (empty outputs)
      - "PATCH_DIR=/home/jason/workspace/home-server/jaison/llm/vllm-patches"   # macros do not expand in env
    cmd: ${llm_dir}/run-jaison.sh
    cmdStop: docker stop -t 120 qwen38-27b-vllm   # hard kills of a TP vLLM wedge the GPU (MES/sdma reset); let it drain

  # Tencent Hy4-flash 220B/A11B, llama.cpp Hy4 PR #32517 build. AngelSlim Q4_K_M, 63.5 GB Engram table
  # paged from NVMe on demand (mmap + lazy). Text-only until the projector-type mismatch is fixed
  # upstream (AngelSlim's mmproj says hy_v4_flash; this build registers hy_v4_vl) — NO_MM=1 below.
  # No spec drafter in the GGUF (DFly2 layers dropped by the converter). Sampling per model card:
  # temp 0.9, top_p 1.0, top_k off. See run-hy4.sh.
  "hy4-flash":
    concurrencyLimit: 1000
    proxy: "http://127.0.0.1:9991"
    checkEndpoint: /health
    ttl: 3600
    env:
      - "PORT=9991"
      - "NAME=hy4"
      - "NO_MM=1"
    cmd: ${llm_dir}/run-hy4.sh
    cmdStop: docker stop -t 60 hy4   # drain like deepseek: RCCL multi-GPU + abrupt stop
