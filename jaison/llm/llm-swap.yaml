# jaison: one llama-swap for both R9700s; each model is a `docker run` it starts and stops.
# Bind-mount paths in cmds are HOST paths (the daemon resolves them).
healthCheckTimeout: 1200   # vLLM cold torch.compile; 256k KV pools
timeouts:
  responseHeader: 0   # never guillotine long first-byte waits
logLevel: info
hooks:
  on_startup:
    preload: ["qwen3-embed"]

macros:
  hf: /mnt/cache/huggingface
  llm_dir: /home/jason/workspace/home-server/jaison/llm
  gpu: >
    --device /dev/kfd --device /dev/dri --group-add video --group-add 991
  llama_common: >
    --jinja --reasoning-format deepseek
    --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0
    -fa on -ngl 999 --cache-type-k q8_0 --cache-type-v q8_0 --metrics --host 0.0.0.0

groups:
  # The embedder sits outside every exclusive group: persistent, so no swap ever unloads it.
  "embed":
    swap: false
    exclusive: false
    persistent: true
    members: ["qwen3-embed"]
  # Resident default. exclusive: loading it unloads everything else (Flash-Next).
  "27b":
    swap: false
    exclusive: true
    members: ["qwen3.8-27b"]
  # Whole box: both cards + CPU experts. Loading it drains and unloads the 27B.
  "flash-next":
    swap: true
    exclusive: true
    members: ["qwen3.8-flash-next"]
  # Whole box + host RAM: MXFP4 on four cards with 23 expert layers on the CPU. Drains/unloads the 27B.
  "mimo":
    swap: true
    exclusive: true
    members: ["mimo-v2.6-flash"]
  # Whole box + host RAM: GLM IQ4_XS on four cards, ~70 GB of experts in RAM. Drains/unloads the 27B.
  "glm":
    swap: true
    exclusive: true
    members: ["glm-5.3-flash"]
  # On-demand extras (Vulkan llama.cpp); they evict each other and the groups above.
  "extras":
    swap: true
    exclusive: true
    members: ["qwen3-omni-30b", "muse-glimmer-30b"]

models:
  # Qwen3-Embedding-4B Q8 on the CPU (the cards belong to the big models); the media router reaches it through its peers list.
  # 2560-dim: switching embed models means dropping quack's Qdrant collections. 17-token query ~62 ms, 674-token doc ~2.0 s at -t 24.
  "qwen3-embed":
    proxy: "http://127.0.0.1:9995"
    ttl: 0
    cmd: >
      docker run --rm --init --name embed --no-healthcheck
      -v ${hf}:/root/.cache/huggingface:ro -p 127.0.0.1:9995:9995
      ghcr.io/ggml-org/llama.cpp:server-b11371
      -m /root/.cache/huggingface/hub/models--Qwen--Qwen3-Embedding-4B-GGUF/snapshots/f4602530db1d980e16da9d7d3a70294cf5c190be/Qwen3-Embedding-4B-Q8_0.gguf
      --embedding --pooling last -ngl 0 -t 24
      -c 16384 --parallel 4 -ub 2048 -b 2048
      --host 0.0.0.0 --port 9995 --metrics
    cmdStop: docker stop embed

  # vLLM TP=4, FP8 weights + DFlash2 draft: 90k 3813 prefill / 108 decode t/s (int4 was 126; 8-bit chosen for quality). MAXSEQS 6, bf16 KV. ttl 0: resident; Flash-Next swaps it out.
  "qwen3.8-27b":
    proxy: "http://127.0.0.1:9993"
    checkEndpoint: /health
    useModelName: qwen3.8-27b-vllm   # what the launcher registers with vLLM
    ttl: 0
    env:
      - "GPU=0,1,2,3"
      - "TP=4"
      - "MAXLEN=262144"
      - "MAXSEQS=6"   # bf16 KV pool ~1.15M tokens = 4 worst-case 262k seqs; vLLM queues beyond that, never OOMs
      - "KV_DTYPE=bfloat16"   # ~1 pt quality over fp8 KV; no measured speed cost on gfx1201
      - "PORT=9993"
      - "NAME=qwen38-27b-vllm"
      - "IMAGE=docker.io/stilldeadcode/vllm-radiance:0.9.3"
      - "MODEL_DIR=/mnt/cache/vllm/qwen3.8-27b-fp8"
      - "QUANT=fp8"   # official Qwen block-fp8; launcher defaults to auto_gptq for AutoRound
      - "DRAFT_DIR=/mnt/cache/vllm/qwen3.8-27b-dflash2-int4"
      - "CACHE_DIR=/mnt/cache/vllm/cache"
      - "REASONING_EFFORT=medium"
      - "MAX_NEW_TOKENS=32768"   # 16k cut heavy plan-writing steps mid-think (empty outputs)
      - "PATCH_DIR=/home/jason/workspace/home-server/jaison/llm/vllm-patches"   # macros do not expand in env
    cmd: ${llm_dir}/run-jaison.sh
    cmdStop: docker stop -t 120 qwen38-27b-vllm   # hard kills of a TP vLLM wedge the GPU (MES/sdma reset); let it drain

  # Whole box, tensor parallel: UD-Q4_K_XL + MTP n2, 1 x 262k, llama.cpp b11429 + mtp4/patches. ~73 t/s code / ~54 prose;
  # prefill 1,523 t/s @32k, 1,188 @116k, 849 @250k; decode 60 / 40 / 30 t/s at those depths.
  # Drains/unloads the 27B when loaded. See run-flashnext.sh.
  "qwen3.8-flash-next":
    proxy: "http://127.0.0.1:9992"
    checkEndpoint: /health
    ttl: 3600
    env:
      - "PORT=9992"
      - "NAME=flash-next"
    cmd: ${llm_dir}/run-flashnext.sh
    cmdStop: docker stop flash-next

  # MiMo-V2.6-Flash-RL 309B/A15B, llama.cpp b11429 + mimo/patches. MXFP4 lossless, TrevorJS DFlash drafter, vision/audio projector:
  # 1 stream ~39 t/s code, prefill ~430 @10k / 360 @126k (1 slot), 4 streams ~46 aggregate. 4 slots x 128k from one 512k pool: past ~150k the ROCm
  # flash-attention f16 accumulators lose MiMo's full-attention layers (recall verified correct to 139k).
  # Weights read without mmap; launcher drops the page cache after boot.
  "mimo-v2.6-flash":
    proxy: "http://127.0.0.1:9994"
    checkEndpoint: /health
    ttl: 3600
    env:
      - "PORT=9994"
      - "NAME=mimo"
      - "NCMOE=23"
      - "CTX=524288"
      - "PARALLEL=4"
    cmd: ${llm_dir}/run-mimo.sh
    cmdStop: docker stop mimo

  # GLM-5.3-Flash 320B/A18B, llama.cpp b11429 + glm/patches (NextN MTP, RDNA4 sparse FA). UD-IQ4_XS, own MTP head n2, q8_0 KV:
  # 1 stream ~21 t/s code / ~20 prose, 4 streams ~26 aggregate. Prefill 294 t/s @30k, 268 @106k, 246 @170k;
  # 4 x 256k slots still lean on prompt-prefix reuse. See run-glm.sh.
  "glm-5.3-flash":
    proxy: "http://127.0.0.1:9998"
    checkEndpoint: /health
    ttl: 3600
    env:
      - "PORT=9998"
      - "NAME=glm"
    cmd: ${llm_dir}/run-glm.sh
    cmdStop: docker stop glm

  # Audio-capable media reader. Vulkan llama.cpp.
  "qwen3-omni-30b":
    proxy: "http://127.0.0.1:9999"
    ttl: 1800
    cmd: >
      docker run --rm --init --name omni ${gpu}
      -e HF_HUB_OFFLINE=1
      -v ${hf}:/root/.cache/huggingface:ro -p 127.0.0.1:9999:9999
      ghcr.io/ggml-org/llama.cpp:server-vulkan
      -m /root/.cache/huggingface/Qwen3-Omni-30B-A3B-Instruct-Q4_K_M.gguf
      --mmproj /root/.cache/huggingface/mmproj-Qwen3-Omni-30B-A3B-Instruct-bf16.gguf
      ${llama_common}
      --reasoning-budget 512 --presence-penalty 1.5 --temp 0.6
      --split-mode layer -c 32768 --parallel 1 -ub 2048 -b 2048
      --image-min-tokens 2048 --image-max-tokens 8192
      --port 9999
    cmdStop: docker stop omni

  # Untested agentic candidate; kept loadable.
  "muse-glimmer-30b":
    proxy: "http://127.0.0.1:9996"
    ttl: 600
    cmd: >
      docker run --rm --init --name muse ${gpu}
      -e HF_HUB_OFFLINE=1
      -v ${hf}:/root/.cache/huggingface:ro -p 127.0.0.1:9996:9996
      ghcr.io/ggml-org/llama.cpp:server-vulkan
      -m /root/.cache/huggingface/hub/models--unsloth--Muse-Glimmer-30B-GGUF/snapshots/faa5b025c584459c13febfa5c59883516710ae39/Muse-Glimmer-30B-UD-Q4_K_XL.gguf
      --mmproj /root/.cache/huggingface/hub/models--unsloth--Muse-Glimmer-30B-GGUF/snapshots/faa5b025c584459c13febfa5c59883516710ae39/mmproj-Muse-Glimmer-30B-Q8_0.gguf
      ${llama_common}
      --top-k 64 -c 131072 --parallel 1 -ub 2048 -b 2048
      --port 9996
    cmdStop: docker stop muse
