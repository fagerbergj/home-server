# Exporters scraped by the media box's Prometheus (monitoring/prometheus/config.yaml);
# Grafana dashboard `jaison` lives there too. Ports 9100/9836/8082 must be open
# to 192.168.50.186 (scripts/phase1-firewall.sh).
services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: host
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    restart: unless-stopped

  # ROCm device metrics for the four R9700s (gpu_* series). Its 30 s polls are safe
  # only because phase3-gpu.sh pins the cards' power/control=on; polling a
  # runtime-suspended R9700 is what hung the media box on 2026-08-29.
  amd-exporter:
    image: rocm/device-metrics-exporter:v1.5.1
    container_name: amd-exporter
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:            # numeric: the image's /etc/group has neither name (getent group render video)
      - "44"    # video
      - "991"   # render on jaison (993 on the media box)
    volumes:
      - /sys:/sys:ro
    ports:
      - "9836:5000"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --housekeeping_interval=10s
      - --docker_only=true
    ports:
      - "8082:8080"
    restart: unless-stopped

  # Headscale trial: a second Tailscale client beside the host's tailscaled. Userspace mode adds no kernel
  # routes, so the two never fight over routing; inbound tailnet connections reach this host's loopback.
  headscale-client:
    image: tailscale/tailscale:stable
    container_name: headscale-client
    network_mode: host
    environment:
      - TS_HOSTNAME=jaison
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_EXTRA_ARGS=--login-server=https://headscale.jasonfagerberg.duckdns.org
      - TS_TAILSCALED_EXTRA_ARGS=--port=41642   # the host tailscaled owns 41641
    volumes:
      - headscale-client:/var/lib/tailscale
    restart: unless-stopped

  # HTTPS front for Collie (phone UI for herdr); Headscale DNS points collie.jasonfagerberg.duckdns.org at jaison
  collie-proxy:
    build: collie-proxy
    container_name: collie-proxy
    network_mode: host
    env_file: collie-proxy/.env   # DUCKDNS_TOKEN, copied from networking/.env on the media box
    volumes:
      - collie-proxy:/data
    restart: unless-stopped

volumes:
  headscale-client:
  collie-proxy:
