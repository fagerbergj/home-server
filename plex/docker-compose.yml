services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=999    # run: id plex
      - PGID=1002 # run: getent group plex-ro
      - TZ=America/Chicago
      - VERSION=docker
      # RTX 3090 NVENC/NVDEC via the nvidia container runtime (needs
      # nvidia-container-toolkit on the host). Plex picks the GPU up automatically.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    runtime: nvidia
    volumes:
      - ./config:/config
      - /mnt/media:/mnt/media
    restart: unless-stopped
