services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    networks:
      - frontend
      - backend
    ports:
      - "2283:2283"
    environment:
      - PUID=996         # run: id immich
      - PGID=1003    # run: getent group personal-rw
      # DB_URL supersedes DB_HOSTNAME/PORT/USERNAME/PASSWORD/DB_DATABASE_NAME
      # entirely (server's config.repository.ts) — those are dead once this is set.
      - DB_URL=${DB_URL}
      - REDIS_HOSTNAME=${REDIS_HOSTNAME}
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"    # video
      - "993"   # render
    volumes:
      - /mnt/personal/photos:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  immich-machine-learning:
    # Pinned to v2.4.1 — release-rocm uses MIGraphXExecutionProvider which crashes on all
    # recent RDNA generations (gfx1030–gfx1201). v2.4.1 uses ROCMExecutionProvider instead.
    # Do not upgrade until https://github.com/immich-app/immich/issues/27387 is resolved.
    image: ghcr.io/immich-app/immich-machine-learning:v2.4.1-rocm
    container_name: immich-machine-learning
    networks:
      - backend
    # No env_file: immich_ml/config.py reads only MACHINE_LEARNING_*/IMMICH_HOST/
    # PORT/LOG_LEVEL vars, none of which this stack sets anywhere — defaults apply.
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "44"    # video
      - "993"   # render
    volumes:
      - ./ml-cache:/cache
    restart: unless-stopped

  redis:
    image: docker.io/redis:6.2-alpine
    container_name: immich-redis
    networks:
      - backend
    restart: unless-stopped

  postgres:
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0
    container_name: immich-postgres
    networks:
      - backend
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_DB=${DB_DATABASE_NAME}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true
