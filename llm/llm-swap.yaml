healthCheckTimeout: 1200  # 70b loading + large KV cache init takes time
logLevel: debug

groups:
  # Only one chat model loaded at a time; won't evict the embed group.
  main:
    swap: true
    exclusive: false
    members:
      - llama-3.3-70b
      - qwen3.6-35b
      - qwen3.5-9b
      - qwen3-vl-8b
      - qwen3-coder-next

  # Stays loaded regardless of what the main group is doing.
  embed:
    swap: false
    exclusive: false
    persistent: true
    members:
      - qwen3-embed

models:
  "llama-3.3-70b":
    proxy: "http://127.0.0.1:9999"
    ttl: 3600
    # --skip-chat-parsing: workaround for unfixed Llama 3.x tool-call parser
    # bug — when tool descriptions are long, the model mimics the OpenAI
    # envelope shape ({"type":"function","name":...,"parameters":...}) instead
    # of canonical Meta format ({"name":...,"parameters":...} or
    # <|python_tag|>{...}), llama-server's parser returns HTTP 500 instead of
    # degrading to text. See PRs #20800 / #20806 (both closed without merge)
    # and umbrella issue #20650. With this flag, llama-server returns raw
    # model output as `content` and the client parses tool calls itself.
    cmd: >
      /app/llama-server
      -hf unsloth/Llama-3.3-70B-Instruct-GGUF:Q4_K_M
      --jinja
      --no-mmap
      --split-mode tensor
      -fit off
      -ngl 999
      -c 16384
      --port 9999
      --skip-chat-parsing

  "qwen3.6-35b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -hf unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_M
      --jinja
      -ngl 999
      -c 16384
      --cache-type-k q8_0
      --cache-type-v q8_0
      --port 9999

  "qwen3.5-9b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -hf unsloth/Qwen3.5-9B-GGUF:Q4_K_M
      --jinja
      -ngl 999
      -c 16384
      --cache-type-k q8_0
      --cache-type-v q8_0
      --chat-template-kwargs '{"enable_thinking": false}'
      --port 9999

  "qwen3-vl-8b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -hf unsloth/Qwen3-VL-8B-Instruct-GGUF:Q4_K_M
      --mmproj-hf unsloth/Qwen3-VL-8B-Instruct-GGUF:mmproj-F16
      --jinja
      -ngl 999
      -c 8192
      --port 9999

  # --no-mmap is critical for large models (>30GB): mmap'd reads serialize on
  # page faults (single-threaded), turning a 1-min load into 30+ minutes.
  # Direct sequential reads load 45GB in ~37s. Costs: higher peak RSS during
  # load (full model in RAM, ~45GB) and no warm-restart page cache benefit.
  "qwen3-coder-next":
    proxy: "http://127.0.0.1:9999"
    ttl: 3600
    cmd: >
      /app/llama-server
      -hf unsloth/Qwen3-Coder-Next-GGUF:Q4_K_M
      --jinja
      --no-mmap
      --split-mode tensor
      -fit off
      -ngl 999
      -c 16384
      --port 9999

  # CPU-only (-ngl 0): 0.6B model is fast on CPU anyway, frees ~0.7 GB VRAM
  # and avoids any GPU contention with the main group's chat/coder models.
  "qwen3-embed":
    proxy: "http://127.0.0.1:9998"
    ttl: -1
    cmd: >
      /app/llama-server
      -hf Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0
      --embedding
      --pooling cls
      -ngl 0
      --port 9998
