healthCheckTimeout: 1200  # gpt-oss-120b + 256K KV cache for coder takes time to init
logLevel: debug

matrix:
  vars:
    # Quack GPU workers
    g:   "qwen3.6-35b"       # chat / web-researcher
    q:   "qwen3-omni-30b"    # media-reader (image + audio)
    v:   "qwen3-vl-32b"      # image-reader (dense OCR / handwriting)
    c:   "qwen3-coder-next"  # coding — evicts everyone for full VRAM
    # Live Quack judge (GPU)
    j:   "gemma4-26b-a4b"
    # Large GPU fallbacks
    p:   "gpt-oss-120b"      # heavy reasoner
    n9:  "qwen3.5-9b"        # doc-pipeline workhorse
    sl:  "selene"            # promptfoo GPU judge
    # Always-on
    e:   "qwen3-embed"
    # CPU-only eval judges (batch grading only)
    g12: "gemma4-12b"
    sm:  "selene-mini"

  costs:
    j:   50    # keep the judge warm across worker switches (g→q evicts g at 1, not j)
    e:   9999  # CPU-only, never worth evicting
    g12: 9999  # CPU-only, never worth evicting
    sm:  9999  # CPU-only, never worth evicting

  sets:
    # & e is required: without it, Quack's frequent embed calls (memory recall,
    # node-handoff) would pick the "embed" set and evict the GPU worker instead.
    workers:  "(g | q | v) & j & e"
    # j excluded: coder (~48GB) + GPU judge (~15GB) exceed 63.7GB. A verdict swaps
    # gemma in/out around the coder (~1-2min each way) - accepted over the CPU
    # judge's 3-5min+timeouts. j stays resident via the `workers` set instead.
    coding:   "c & e"
    # Gives a mid-coding verdict a satisfiable state without a GPU worker. Without
    # it, gemma launched on top of the resident coder, didn't fit, and llama-server
    # SEGFAULTED into a restart loop (every gated run then delivered unvetted).
    judge:    "j & e"
    # No judge/embed - a 59GB model has room for neither; an embed here pays a swap.
    fallback: "(p | n9 | sl) & e"
    # Pure-embed request when no GPU worker is loaded → just e.
    embed:    "e"
    # CPU-only eval judges - batch grading, never evicted (see costs above).
    cpu:      "g12 | sm"

models:
  # All entries load via -m (direct path), not -hf: HF_HUB_OFFLINE=1 + an
  # inconsistent HF cache makes -hf resolution exit 1 before load.
  "gpt-oss-120b":
    proxy: "http://127.0.0.1:9999"
    ttl: 1800
    env:
      - "GPU_MAX_HW_QUEUES=1"
    # --no-mmap: page-fault-serialized mmap reads take 30+min on 65GB+ models;
    # direct reads load in under a minute (costs full-model peak RSS at load).
    # --split-mode layer, NOT tensor: tensor parallelism's AllReduce init fails
    # when GPU1 is contended. (-ts/--tensor-split is a RATIO and is unaffected.)
    # MXFP4 is gpt-oss's native trained precision (not a lesser quant) - the f16
    # upcast is ~6GB larger for no quality gain; that headroom funds native -c 131072.
    # --reasoning-format auto: without it, harmony's analysis channel leaks into content.
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/direct/gpt-oss-120b-MXFP4.gguf
      --jinja
      --reasoning-format auto
      --temp 1.0
      --top-p 1.0
      --top-k 0
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -ncmoe 4
      -c 131072
      -fa on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --parallel 1
      --port 9999

  # Reasoning ON, --reasoning-budget 512 (bounded): thinking lets the model
  # self-regulate - removing it entirely caused runaway tool-calling (100s of
  # calls). Don't retune the budget to chase empty answers; Quack's OpenAI
  # adapter recovers misrouted tool-calls/answers from reasoning_content client-side.
  # --reasoning-format deepseek (not auto): auto mis-routes this model's tool-call
  # XML into content.
  # --no-mmap: ~25GB Q5, cold mmap reload ~15min.
  # -c 262144 --parallel 1 = one 256K slot shared by both concurrent DAG nodes
  # (dag.max_active_nodes=2 queues for it rather than getting its own). -ncmoe 4
  # leaves headroom for the GPU gemma judge (~15GB) to co-reside in `workers`.
  "qwen3.6-35b":
    proxy: "http://127.0.0.1:9999"
    ttl: 1800
    env:
      - "GPU_MAX_HW_QUEUES=1"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/snapshots/a483e9e6cbd595906af30beda3187c2663a1118c/Qwen3.6-35B-A3B-UD-Q5_K_XL.gguf
      --jinja
      --reasoning-format deepseek
      --reasoning-budget 512
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      -fa on
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -ncmoe 2
      -c 262144
      --parallel 1
      -ub 2048
      -b 2048
      --cache-type-k q8_0
      --cache-type-v q8_0
      --port 9999

  # Dense 27B (~18GB Q4, no -ncmoe) - small enough to co-reside with the 15GB
  # gemma judge (unlike the 49GB coder-next). -c 65536/parallel 1 keeps KV
  # modest for co-residence; raise once proven out.
  "qwen3.6-27b":
    proxy: "http://127.0.0.1:9993"
    ttl: 1800
    env:
      - "GPU_MAX_HW_QUEUES=1"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/direct/Qwen3.6-27B-UD-Q4_K_XL.gguf
      --jinja
      --reasoning-format deepseek
      --reasoning-budget 512
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 0
      -fa on
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -c 131072
      --parallel 1
      -ub 2048
      -b 2048
      --cache-type-k q8_0
      --cache-type-v q8_0
      --port 9993

  # 80B/3B-active hybrid MoE: only ~12 attention layers (2 KV heads) keep the KV
  # cache small, so 256K native context fits despite the ~49GB Q4 size.
  # --repeat-penalty 1.05 over a 1024-token window (not the 64-token default): a
  # tool-call cycle runs ~150+ tokens, so the default window let repeated calls
  # go unpenalized and the model wedged into identical-call loops mid-task.
  # --no-mmap: >30GB. NEW arch (Qwen3-Next/DeltaNet) - verify it still loads and
  # accepts q8 KV if the model file changes.
  # -c 262144 --parallel 1 = one 256K slot (~57GB, runs alone); a 2nd concurrent
  # node queues for it rather than halving context. 2x256K would need -c 524288 (OOMs).
  "qwen3-coder-next":
    proxy: "http://127.0.0.1:9999"
    ttl: 1800
    env:
      - "GPU_MAX_HW_QUEUES=1"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--Qwen3-Coder-Next-GGUF/snapshots/ce09c67b53bc8739eef83fe67b2f5d293c270632/Qwen3-Coder-Next-UD-Q4_K_XL.gguf
      --jinja
      --temp 1.0
      --top-p 0.95
      --top-k 40
      --repeat-penalty 1.05
      --repeat-last-n 16384
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -c 262144
      --parallel 1
      -ub 2048
      -b 2048
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa on
      --port 9999

  "qwen3.5-9b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--Qwen3.5-9B-GGUF/snapshots/3885219b6810b007914f3a7950a8d1b469d598a5/Qwen3.5-9B-UD-Q4_K_XL.gguf
      --jinja
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      -ngl 999
      -c 32768
      --cache-type-k q8_0
      --cache-type-v q8_0
      --chat-template-kwargs '{"enable_thinking": false}'
      --port 9999

  # Vision-mode sampling (temp .7/top_p .8/top_k 20/presence 1.5/repeat 1.0) -
  # NOT the text-mode profile (1.0/1.0/40/presence 2.0) used for other Qwen models.
  # --mmproj-url (no --mmproj-hf on this build); F32 projector for OCR accuracy.
  "qwen3-vl-32b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--Qwen3-VL-32B-Instruct-GGUF/snapshots/b9262a359f54dead8e2609f6146e2fc3398fd0d9/Qwen3-VL-32B-Instruct-UD-Q4_K_XL.gguf
      --mmproj-url https://huggingface.co/unsloth/Qwen3-VL-32B-Instruct-GGUF/resolve/main/mmproj-F32.gguf
      --jinja
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      --repeat-penalty 1.0
      -ngl 999
      -c 32768
      --image-min-tokens 2048
      --image-max-tokens 8192
      --port 9999

  # M4 media-reader (native image+audio+text). MoE (3B active) co-resides with
  # gemma4-26b-a4b (~15GB) comfortably in 64GB. Reasoning-format/budget: same
  # rationale as qwen3.6-35b (shares the Qwen3 thinking architecture).
  # --no-mmap: 17+GB, cold mmap serializes on page faults.
  # Audio ROCm support is recent - verify on first deploy; if it fails to load,
  # drop the --mmproj arg and run image-only until a confirmed build ships with audio.
  "qwen3-omni-30b":
    proxy: "http://127.0.0.1:9999"
    ttl: 1800
    env:
      - "GPU_MAX_HW_QUEUES=1"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/Qwen3-Omni-30B-A3B-Instruct-Q4_K_M.gguf
      --mmproj /root/.cache/huggingface/mmproj-Qwen3-Omni-30B-A3B-Instruct-bf16.gguf
      --jinja
      --reasoning-format deepseek
      --reasoning-budget 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -c 32768
      --image-min-tokens 2048
      --image-max-tokens 8192
      --parallel 1
      -ub 2048
      -b 2048
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa on
      --port 9999

  # >30GB, so --no-mmap + --split-mode tensor (both GPUs, model under test is
  # swapped out). KV stays fp16 here: quantized KV needs -fa, which this lacks.
  # -c 32768 is sized for the compare phase (holds all four models' full
  # responses at once); per-suite grading needs far less.
  "selene":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--mradermacher--Selene-1-Llama-3.3-70B-i1-GGUF/snapshots/2c66624be930abf9d354e8cd16a9d85f38ac3ff8/Selene-1-Llama-3.3-70B.i1-Q4_K_M.gguf
      --alias selene
      --jinja
      --temp 0
      --top-k 1
      --no-mmap
      --split-mode tensor
      -fit off
      -ngl 999
      -c 32768
      -ub 2048
      -b 2048
      -fa on
      --parallel 1
      --port 9999

  # CPU-only 4B Q8 (~4GB) - 8B was too slow on CPU (minutes/embed under load).
  # -t 8 (not 24): all-core embeds hit Tjmax (92-101C) and thermal-throttle
  # (119ms cool vs ~6s hot); fewer threads trades peak speed for consistency.
  # 4B emits 2560-dim vectors (8B was 4096): switching embed models requires
  # dropping the existing Qdrant memory collections (dimension is set once, on creation).
  "qwen3-embed":
    proxy: "http://127.0.0.1:9998"
    # ttl 0 (always resident, ~4GB RAM/0 VRAM): at ttl 600 it idle-unloaded during
    # long explore nodes, then cold-loaded (~95s) on handoff - blowing Quack's
    # 60s embed budget and thrashing the worker GPU.
    ttl: 0
    # CPU-only for now, pending llm-swap experimentation. GPUs hidden because the
    # ROCm build holds a ~1.8GB HIP context on GPU0 even at -ngl 0.
    env:
      - "HIP_VISIBLE_DEVICES="
      - "ROCR_VISIBLE_DEVICES="
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--Qwen--Qwen3-Embedding-4B-GGUF/snapshots/f4602530db1d980e16da9d7d3a70294cf5c190be/Qwen3-Embedding-4B-Q8_0.gguf
      --embedding
      --pooling last
      -ngl 0
      -c 4096
      -t 8
      -ub 2048
      -b 2048
      --port 9998

  # CPU-only, resident (like qwen3-embed) so it never swaps the GPU main group;
  # GPUs hidden so the ROCm build doesn't hold a HIP context.
  # --parallel 2 x -c 65536: the G-Eval prompt measured 10-16K tokens in
  # practice - the old 4x8K slots rejected calls with a 400, so answers surfaced unvetted.
  "selene-mini":
    proxy: "http://127.0.0.1:9997"
    ttl: 1800
    env:
      - "HIP_VISIBLE_DEVICES="
      - "ROCR_VISIBLE_DEVICES="
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--mradermacher--Selene-1-Mini-Llama-3.1-8B-GGUF/snapshots/d77990ca9a17c406260b64defada9ce396ffdfd6/Selene-1-Mini-Llama-3.1-8B.Q8_0.gguf
      --alias selene-mini
      --jinja
      --temp 0
      --top-k 1
      -ngl 0
      -t 24
      -c 65536
      -ub 2048
      -b 2048
      --parallel 2
      --port 9997

  # ── Judge candidates (eval only, promptfoo `judge` suite) ──────────────────
  # enable_thinking off: rubric reasoning lives in the JSON verdict's "reason"
  # fields, not a thinking channel; also keeps decode short.
  # --no-mmproj: these are vision GGUFs so -hf auto-pulls a projector, and this
  # build can't load gemma-4's projector (aborts at load) - we only need text.

  # Dense 12B — the slower-but-simpler control (12B active on CPU).
  "gemma4-12b":
    proxy: "http://127.0.0.1:9995"
    ttl: 600
    env:
      - "HIP_VISIBLE_DEVICES="
      - "ROCR_VISIBLE_DEVICES="
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--gemma-4-12b-it-GGUF/snapshots/3249fa54d5efa384afc552cc6700ad091efd5c39/gemma-4-12b-it-UD-Q6_K_XL.gguf
      --no-mmproj
      --alias gemma4-12b
      --jinja
      --temp 0
      --top-k 1
      -ngl 0
      -t 24
      -c 16384
      -ub 2048
      -b 2048
      --chat-template-kwargs '{"enable_thinking": false}'
      --port 9995

  # 26B-A4B MoE, ~15GB GPU: co-resides with `workers` (25-32GB workers fit); can't
  # co-reside with the coder, so it swaps in for code-review verdicts instead
  # (see `sets.coding` above). Compaction stays on the coder - no swap there.
  # -ncmoe 18 (raised from 12): with -fit off the VRAM ask is fixed, and too low
  # SIGABRTs when launched against an already-busy worker - 18 is the margin
  # that stopped repeated 502s on code nodes.
  # To revert to CPU-only (no swaps, slower): -ngl 0, hide HIP/ROCR env, drop
  # --split-mode/-fit/-fa/cache-type, and add j back to the `coding` set.
  "gemma4-26b-a4b":
    proxy: "http://127.0.0.1:9994"
    ttl: 1800   # live agent-researcher judge — 30 min keeps it warm between calls
    env:
      - "GPU_MAX_HW_QUEUES=1"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/snapshots/3bb10d594514ef4edb7f3a65d41a7e4eb8c5767a/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
      --alias gemma4-26b-a4b
      --jinja
      --temp 0.3
      --top-p 0.95
      --top-k 64
      --split-mode layer
      -fit off
      -ngl 999
      -ncmoe 18
      -fa on
      -c 131072
      -ub 2048
      -b 2048
      --parallel 1
      --cache-type-k q8_0
      --cache-type-v q8_0
      --chat-template-kwargs '{"enable_thinking": false}'
      --port 9994
