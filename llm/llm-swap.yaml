healthCheckTimeout: 1200  # gpt-oss-120b + 256K KV cache models take time to init
logLevel: debug

matrix:
  vars:
    # Quack GPU workers
    g:   "qwen3.6-35b"       # chat / web-researcher
    q:   "qwen3-omni-30b"    # media-reader (image + audio)
    v:   "qwen3-vl-32b"      # image-reader (dense OCR / handwriting)
    g38: "qwen3.8-27b"       # dense hybrid, native vision - candidate chat/vision worker
    # Live Quack judge (GPU)
    j:   "gemma4-26b-a4b"
    # Large GPU fallbacks
    p:   "gpt-oss-120b"      # heavy reasoner
    n9:  "qwen3.5-9b"        # doc-pipeline workhorse
    # Always-on
    e:   "qwen3-embed"

  costs:
    j:   50    # keep the judge warm across worker switches (g→q evicts g at 1, not j)
    e:   9999  # always resident (ttl 0), never worth evicting

  sets:
    # & e is required: without it, Quack's frequent embed calls (memory recall,
    # node-handoff) would pick the "embed" set and evict the GPU worker instead.
    workers:  "(g | q | v | g38) & j & e"
    judge:    "j & e"
    # No judge/embed - a 59GB model has room for neither; an embed here pays a swap.
    fallback: "(p | n9) & e"
    # Pure-embed request when no GPU worker is loaded → just e.
    embed:    "e"

models:
  # All entries load via -m (direct path), not -hf: HF_HUB_OFFLINE=1 + an
  # inconsistent HF cache makes -hf resolution exit 1 before load.
  "gpt-oss-120b":
    proxy: "http://127.0.0.1:9999"
    ttl: 1800
    env:
      - "GPU_MAX_HW_QUEUES=1"
    # --no-mmap: page-fault-serialized mmap reads take 30+min on 65GB+ models;
    # direct reads load in under a minute (costs full-model peak RSS at load).
    # --split-mode layer, NOT tensor: no XGMI between the two cards, so tensor
    # parallelism's per-token AllReduce crosses PCIe - measured 30% slower.
    # (-ts/--tensor-split is a RATIO, a separate flag, and is unaffected.)
    # MXFP4 is gpt-oss's native trained precision (not a lesser quant) - the f16
    # upcast is ~6GB larger for no quality gain; that headroom funds native -c 131072.
    # --reasoning-format auto: without it, harmony's analysis channel leaks into content.
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/direct/gpt-oss-120b-MXFP4.gguf
      --jinja
      --reasoning-format auto
      --temp 1.0
      --top-p 1.0
      --top-k 0
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -ncmoe 4
      -c 131072
      -fa on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --parallel 1
      --port 9999

  # Reasoning ON, --reasoning-budget 512 (bounded): thinking lets the model
  # self-regulate - removing it entirely caused runaway tool-calling (100s of
  # calls). Don't retune the budget to chase empty answers; Quack's OpenAI
  # adapter recovers misrouted tool-calls/answers from reasoning_content client-side.
  # --reasoning-format deepseek (not auto): auto mis-routes this model's tool-call
  # XML into content.
  # --no-mmap: ~25GB Q5, cold mmap reload ~15min.
  # -c 262144 --parallel 1 = one 256K slot shared by both concurrent DAG nodes
  # (dag.max_active_nodes=2 queues for it rather than getting its own). -ncmoe 4
  # leaves headroom for the GPU gemma judge (~15GB) to co-reside in `workers`.
  "qwen3.6-35b":
    proxy: "http://127.0.0.1:9999"
    ttl: 1800
    env:
      - "GPU_MAX_HW_QUEUES=1"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/snapshots/a483e9e6cbd595906af30beda3187c2663a1118c/Qwen3.6-35B-A3B-UD-Q5_K_XL.gguf
      --jinja
      --reasoning-format deepseek
      --reasoning-budget 512
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      -fa on
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -ncmoe 2
      -c 262144
      --parallel 1
      -ub 2048
      -b 2048
      --cache-type-k q8_0
      --cache-type-v q8_0
      --port 9999

  # Dense 27B, hybrid Gated DeltaNet + Gated Attention (Qwen3-Next lineage, same
  # arch family as the old coder-next) with native image+video vision. NEW arch
  # for this file - if the mmproj aborts at load or KV quant segfaults, drop
  # --cache-type-k/v first, then --mmproj (text-only) if still unstable.
  # Sampling is Qwen's published thinking-mode preset (matches qwen3.6-35b's).
  # --spec-type draft-mtp: self-speculative decoding off the GGUF's own baked-in
  # MTP head (blk.64.nextn.* - otherwise logged "unused tensor... ignoring" at
  # load). --spec-draft-n-max 2 (default 3): idle-GPU A/B, 8 runs each -
  # 29.4 t/s vs 27.7 t/s, acceptance 38% vs 30%; at ~30% the third draft
  # token is mostly waste. --spec-draft-p-min 0.65 was tried and LOST (25.7
  # t/s): acceptance doubles to 66% but drafting is cheap here, so filtering
  # forgoes more wins than it saves. Quant grid (same bench): unsloth Q4_0
  # 32.0 t/s, bartowski Q4_K_M 29.0, bartowski Q6_K 26.4 - kept UD-Q4_K_XL
  # over the faster Q4_0 because UD spends more bits on sensitive layers and
  # the reviewer's job is being right. ggml-org Q4_K_M has NO MTP head
  # (draft-mtp refuses to load) - do not use it. MTP's own draft context costs enough VRAM that
  # native 262144 didn't fit alongside gemma4-26b-a4b + a GPU-resident
  # qwen3-embed - raising gemma's -ncmoe didn't fix it (the extra offload landed
  # almost entirely on GPU0, not the GPU1 side embed needed) and neither did
  # rebalancing this model's own --tensor-split (still segfaulted 2/2 times even
  # once byte math said there was room - a real per-context floor ROCm needs
  # that isn't visible in the free-memory reading, or explicit split + -fit off
  # instability on this hybrid arch). The fix that actually worked: qwen3-embed
  # moved to CPU entirely (see its entry) - 100% resident dense weights need
  # 100% GPU, so the only real lever here was removing a competitor, not
  # reshuffling one. 1M/2x context extension don't work regardless (server
  # hard-caps n_ctx_slot to n_ctx_train=262144 regardless of --rope-scaling
  # yarn, wasting VRAM if requested higher).
  "qwen3.8-27b":
    proxy: "http://127.0.0.1:9993"
    ttl: 1800
    env:
      - "GPU_MAX_HW_QUEUES=1"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/direct/Qwen3.8-27B-UD-Q4_K_XL.gguf
      --mmproj /root/.cache/huggingface/direct/mmproj-Qwen3.8-27B-BF16.gguf
      --jinja
      --reasoning-format deepseek
      --reasoning-budget 512
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 0
      -fa on
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -c 262144
      --image-min-tokens 2048
      --image-max-tokens 8192
      --parallel 1
      -ub 2048
      -b 2048
      --cache-type-k q8_0
      --cache-type-v q8_0
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --port 9993

  "qwen3.5-9b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--Qwen3.5-9B-GGUF/snapshots/3885219b6810b007914f3a7950a8d1b469d598a5/Qwen3.5-9B-UD-Q4_K_XL.gguf
      --jinja
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      -ngl 999
      -c 32768
      --cache-type-k q8_0
      --cache-type-v q8_0
      --chat-template-kwargs '{"enable_thinking": false}'
      --port 9999

  # Vision-mode sampling (temp .7/top_p .8/top_k 20/presence 1.5/repeat 1.0) -
  # NOT the text-mode profile (1.0/1.0/40/presence 2.0) used for other Qwen models.
  # --mmproj-url (no --mmproj-hf on this build); F32 projector for OCR accuracy.
  "qwen3-vl-32b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--Qwen3-VL-32B-Instruct-GGUF/snapshots/b9262a359f54dead8e2609f6146e2fc3398fd0d9/Qwen3-VL-32B-Instruct-UD-Q4_K_XL.gguf
      --mmproj-url https://huggingface.co/unsloth/Qwen3-VL-32B-Instruct-GGUF/resolve/main/mmproj-F32.gguf
      --jinja
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      --repeat-penalty 1.0
      -ngl 999
      -c 32768
      --image-min-tokens 2048
      --image-max-tokens 8192
      --port 9999

  # M4 media-reader (native image+audio+text). MoE (3B active) co-resides with
  # gemma4-26b-a4b (~15GB) comfortably in 64GB. Reasoning-format/budget: same
  # rationale as qwen3.6-35b (shares the Qwen3 thinking architecture).
  # --no-mmap: 17+GB, cold mmap serializes on page faults.
  # Audio ROCm support is recent - verify on first deploy; if it fails to load,
  # drop the --mmproj arg and run image-only until a confirmed build ships with audio.
  "qwen3-omni-30b":
    proxy: "http://127.0.0.1:9999"
    ttl: 1800
    env:
      - "GPU_MAX_HW_QUEUES=1"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/Qwen3-Omni-30B-A3B-Instruct-Q4_K_M.gguf
      --mmproj /root/.cache/huggingface/mmproj-Qwen3-Omni-30B-A3B-Instruct-bf16.gguf
      --jinja
      --reasoning-format deepseek
      --reasoning-budget 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -c 32768
      --image-min-tokens 2048
      --image-max-tokens 8192
      --parallel 1
      -ub 2048
      -b 2048
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa on
      --port 9999

  # 4B Q8, CPU-only (was GPU1-pinned; moved to CPU to fund qwen3.8-27b's full
  # 262144 + MTP context - see its comment. This 4B is NOT the 8B that was too
  # slow on CPU (that's why the fleet moved to 4B in the first place). Measured
  # ~83ms/req idle; under real concurrent load (a live generation + judge call
  # running at once) it degraded to ~0.8-4s/req - still 15-70x under Quack's
  # 60s embed budget. Re-verify that margin if traffic patterns change a lot.
  # 4B emits 2560-dim vectors (8B was 4096): switching embed models requires
  # dropping the existing Qdrant memory collections (dimension is set once, on creation).
  "qwen3-embed":
    proxy: "http://127.0.0.1:9998"
    # ttl 0 (always resident): at ttl 600 it idle-unloaded during long explore
    # nodes, then cold-loaded on handoff - blowing Quack's 60s embed budget.
    # Still relevant on CPU (avoids ever hitting a cold-load in the hot path).
    ttl: 0
    # GPUs hidden so the ROCm build doesn't hold a HIP context - same both-empty
    # pattern as the old CPU-only judges (gemma4-12b/selene-mini, since retired).
    env:
      - "HIP_VISIBLE_DEVICES="
      - "ROCR_VISIBLE_DEVICES="
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--Qwen--Qwen3-Embedding-4B-GGUF/snapshots/f4602530db1d980e16da9d7d3a70294cf5c190be/Qwen3-Embedding-4B-Q8_0.gguf
      --embedding
      --pooling last
      -ngl 0
      -c 4096
      -t 24
      -ub 2048
      -b 2048
      --port 9998

  # Dense 30B agentic candidate (~16GB Q4), no set membership until it passes eval.
  # NEW arch, needs llama.cpp b10353+; if the mmproj aborts at load, run text-only.
  "muse-glimmer-30b":
    proxy: "http://127.0.0.1:9996"
    ttl: 600
    env:
      - "GPU_MAX_HW_QUEUES=1"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--Muse-Glimmer-30B-GGUF/snapshots/faa5b025c584459c13febfa5c59883516710ae39/Muse-Glimmer-30B-UD-Q4_K_XL.gguf
      --mmproj /root/.cache/huggingface/hub/models--unsloth--Muse-Glimmer-30B-GGUF/snapshots/faa5b025c584459c13febfa5c59883516710ae39/mmproj-Muse-Glimmer-30B-Q8_0.gguf
      --alias muse-glimmer-30b
      --jinja
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --no-mmap
      -ngl 999
      -c 131072
      --parallel 1
      -ub 2048
      -b 2048
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa on
      --port 9996

  # 26B-A4B MoE, ~15GB GPU: co-resides with `workers` (25-32GB workers fit).
  # -ncmoe 8 + -ts 78,22: -ts leans on GPU0 because the embedder owns 6GB of
  # GPU1. Retest a launch against a BUSY worker before lowering further - too
  # low used to SIGABRT there (it no longer does at 8).
  # To revert to CPU-only (no swaps, slower): -ngl 0, hide HIP/ROCR env, drop
  # --split-mode/-fit/-fa/cache-type.
  "gemma4-26b-a4b":
    proxy: "http://127.0.0.1:9994"
    ttl: 3600   # 2x the workers: called once per gated node, so 1800 expired between calls and every round re-prefilled cold (0 cached vs ~29K prompts)
    env:
      - "GPU_MAX_HW_QUEUES=1"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/snapshots/3bb10d594514ef4edb7f3a65d41a7e4eb8c5767a/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
      --alias gemma4-26b-a4b
      --jinja
      --temp 0.3
      --top-p 0.95
      --top-k 64
      --split-mode layer
      --tensor-split 78,22
      -fit off
      -ngl 999
      -ncmoe 8
      -fa on
      -c 131072
      -ub 2048
      -b 2048
      --parallel 1
      --cache-type-k q8_0
      --cache-type-v q8_0
      --chat-template-kwargs '{"enable_thinking": false}'
      --port 9994
