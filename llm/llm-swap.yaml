healthCheckTimeout: 1200  # gpt-oss-120b + 256K KV cache for coder takes time to init
logLevel: debug

groups:
  # Only one chat model loaded at a time; won't evict the embed group.
  main:
    swap: true
    exclusive: false
    members:
      - gpt-oss-120b
      - gpt-oss-20b
      - qwen3.6-35b
      - qwen3.6-27b
      - qwen3.5-9b
      - qwen3-vl-32b
      - minimax-m2-reap
      - selene   # promptfoo judge (Atla Selene 70B); swaps in for the batched
                 # grading phase after generation, so it never competes for VRAM
                 # with a model under test

  # Stays loaded regardless of what the main group is doing.
  embed:
    swap: false
    exclusive: false
    persistent: true
    members:
      - qwen3-embed

models:
  # --no-mmap is critical for the 65GB+ models in this group: mmap'd reads
  # serialize on page faults (single-threaded), turning a 1-min load into 30+
  # minutes. Direct sequential reads load 65GB in under a minute. Cost: peak
  # RSS during load equals the full model size and no warm-restart page cache.
  "gpt-oss-120b":
    proxy: "http://127.0.0.1:9999"
    ttl: 3600
    # Native MXFP4 GGUF (ggml-org), ~59 GiB — gpt-oss is TRAINED in MXFP4, so the
    # f16 upcast (unsloth :F16, 65.4 GB) added ~6 GB for zero quality gain. The
    # MXFP4 file is the canonical full-quality weights. The ~6 GB it frees lets
    # us run native 128K context (-c 131072) at -ncmoe 2 instead of 4.
    # --reasoning-format auto: extract the harmony `analysis` channel into
    # reasoning_content instead of leaving it inline in `content`. Without it
    # the model's planning text leaks into the answer.
    # -ncmoe 2: offload the expert FFN weights of 2 layers to CPU RAM (attention
    # + KV stay on GPU for ALL layers). Tune toward 0 if VRAM headroom allows at
    # 128K, up if it OOMs on load.
    cmd: >
      /app/llama-server
      -hf ggml-org/gpt-oss-120b-GGUF
      --jinja
      --reasoning-format auto
      --temp 1.0
      --top-p 1.0
      --top-k 0
      --no-mmap
      --split-mode tensor
      -fit off
      -ngl 999
      -ncmoe 2
      -c 131072
      -fa on
      --parallel 1
      --port 9999

  # gpt-oss-20b — small sibling (21B / 3.6B active). Native MXFP4 GGUF (ggml-org,
  # ~11.3 GiB) for the same full-quality-at-smaller-size reason as the 120b.
  # Fits one GPU, so no --no-mmap/tensor-split. At MXFP4 it runs native 128K
  # context (-c 131072, ~18 GB total) with room to spare — good for concurrent
  # doc-pipeline use where gpt-oss-120b has none.
  "gpt-oss-20b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -hf ggml-org/gpt-oss-20b-GGUF
      --jinja
      --reasoning-format auto
      --temp 1.0
      --top-p 1.0
      --top-k 0
      -ngl 999
      -c 131072
      -fa on
      --port 9999

  # Thinking left ON (backs the clarify stage). --reasoning-format auto keeps
  # reasoning out of `content`; needs a generous max_tokens (~4096+) or its
  # reasoning truncates before the answer.
  "qwen3.6-35b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -hf unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_M
      --jinja
      --reasoning-format auto
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      -fa on
      -ngl 999
      -c 40960
      --cache-type-k q8_0
      --cache-type-v q8_0
      --port 9999

  # Qwen3.6-27B (MTP build) — dense 27B (~16 GB Q4), fits one GPU (no tensor-split
  # / --no-mmap needed). Same Qwen3.6 sampling as the 35B. MTP (multi-token
  # prediction) heads are NOT used yet — the server-rocm image predates the MTP
  # PR (#22673) — so it runs as a plain dense 27B for now (faster once supported).
  "qwen3.6-27b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -hf unsloth/Qwen3.6-27B-MTP-GGUF:Q4_K_M
      --jinja
      --reasoning-format auto
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      -fa on
      -ngl 999
      -c 40960
      --cache-type-k q8_0
      --cache-type-v q8_0
      --port 9999

  "qwen3.5-9b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -hf unsloth/Qwen3.5-9B-GGUF:UD-Q4_K_XL
      --jinja
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      -ngl 999
      -c 32768
      --cache-type-k q8_0
      --cache-type-v q8_0
      --chat-template-kwargs '{"enable_thinking": false}'
      --port 9999

  # Qwen3-VL 32B — OCR/vision for the document-pipeline. Handwriting needs the
  # bigger model; OCR is offline/batch so the slower speed is fine. Vision-mode
  # sampling per Qwen's VL recommendation (temp 0.7, top_p 0.8, top_k 20,
  # presence 1.5, repeat 1.0 — NOT the text-mode 1.0/1.0/40/presence 2.0). mmproj
  # via --mmproj-url (this build has no --mmproj-hf); F32 projector is materially
  # better for OCR. OCR requests should set max_tokens up to 16384.
  "qwen3-vl-32b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -hf unsloth/Qwen3-VL-32B-Instruct-GGUF:UD-Q4_K_XL
      --mmproj-url https://huggingface.co/unsloth/Qwen3-VL-32B-Instruct-GGUF/resolve/main/mmproj-F32.gguf
      --jinja
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      --repeat-penalty 1.0
      -ngl 999
      -c 32768
      --image-min-tokens 2048
      --image-max-tokens 8192
      --port 9999

  # MiniMax-M2-REAP-139B — OFFICIAL Cerebras REAP (40% expert prune of M2 230B →
  # 139B, A10B). Pruning calibrated on Cerebras's coding/agentic mix (24.5K:
  # coding + reasoning + tool-calling), unlike the sketchy community 50% variant
  # (0xSero "repair-in-progress", unknown calibration). All-attention (heavy KV
  # ~248 KiB/tok → ~64-80K ctx at IQ2_M ~44GB). Fast (A10B). IQ2 is aggressive
  # but 40%-prune + coding-calibrated beats 50%-prune + unknown calibration.
  # INTERLEAVED THINKING: M2 requires <think> blocks be retained in history
  # across turns — do NOT strip them (no --reasoning-format). Sampling 1.0/0.95/40.
  # --split-mode layer (NOT tensor): M2's graph makes llama.cpp's tensor-parallel
  # meta-backend abort during warmup (GGML_ASSERT split-axis-0 in alloc_graph).
  # Layer-split (pipeline) avoids the cross-GPU AllReduce path entirely. Loads
  # and serves clean at ~47 t/s decode / ~114 t/s prefill.
  "minimax-m2-reap":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -hf bartowski/cerebras_MiniMax-M2-REAP-139B-A10B-GGUF:IQ2_M
      --jinja
      --temp 1.0
      --top-p 0.95
      --top-k 40
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -c 32768
      -fa on
      --port 9999

  # GPU promptfoo judge — Atla Selene-1 70B (purpose-trained for 1-5 rubric
  # scoring). As a >30GB model it needs --no-mmap + tensor split (KV quant is
  # incompatible with tensor split, so KV stays fp16). Grading runs after
  # generation with the model under test swapped out, so the judge has both GPUs.
  # --parallel 1: grading runs at concurrency 1 (one call at a time), so the
  # single slot gets the whole -c budget. -c 32768 is sized for the compare
  # phase, whose select-best prompt holds all four models' (long) responses at
  # once; per-suite grading needs far less.
  "selene":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -hf mradermacher/Selene-1-Llama-3.3-70B-i1-GGUF:Q4_K_M
      --alias selene
      --jinja
      --temp 0
      --top-k 1
      --no-mmap
      --split-mode tensor
      -fit off
      -ngl 999
      -c 32768
      -ub 2048
      -b 2048
      -fa on
      --parallel 1
      --port 9999

  # CPU-only (-ngl 0): 0.6B model is fast on CPU anyway, frees ~0.7 GB VRAM
  # and avoids any GPU contention with the main group's chat/coder models.
  "qwen3-embed":
    proxy: "http://127.0.0.1:9998"
    ttl: -1
    # CPU-only (-ngl 0) but the ROCm build still init'd a HIP context holding
    # ~1.8 GB on GPU0 — enough to push gpt-oss-120b's KV alloc over the VRAM
    # cliff. Hide the GPUs from this process so it's truly RAM-only.
    env:
      - "HIP_VISIBLE_DEVICES="
      - "ROCR_VISIBLE_DEVICES="
    cmd: >
      /app/llama-server
      -hf Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0
      --embedding
      --pooling cls
      -ngl 0
      -ub 2048
      -b 2048
      --port 9998
