healthCheckTimeout: 1200  # gpt-oss-120b + 256K KV cache for coder takes time to init
logLevel: debug

matrix:
  vars:
    # Quack GPU workers
    g:   "qwen3.6-35b"       # chat / web-researcher
    q:   "qwen3-omni-30b"    # media-reader (image + audio)
    v:   "qwen3-vl-32b"      # image-reader (dense OCR / handwriting)
    c:   "qwen3-coder-next"  # coding — evicts everyone for full VRAM
    # Live Quack judge (GPU)
    j:   "gemma4-26b-a4b"
    # Large GPU fallbacks
    p:   "gpt-oss-120b"      # heavy reasoner
    n9:  "qwen3.5-9b"        # doc-pipeline workhorse
    sl:  "selene"            # promptfoo GPU judge
    # Always-on
    e:   "qwen3-embed"
    # CPU-only eval judges (batch grading only)
    g12: "gemma4-12b"
    sm:  "selene-mini"

  costs:
    # j costs 50 to evict → solver prefers keeping the judge warm when switching
    # between workers (g→q switches evict g at cost 1, not j at cost 50).
    j:   50
    # e, g12, sm never touch GPU VRAM so evicting them is never justified. e is
    # also pinned into every GPU set (see `sets`) so it stays co-resident — this
    # cost just makes the solver prefer keeping it when a pick has a choice.
    e:   9999
    g12: 9999
    sm:  9999

  sets:
    # Each Quack worker co-resides with the judge AND the CPU embedder (e).
    # e is CPU-only (no VRAM), but the solver evicts any model NOT in the chosen
    # set's target — so without `& e` here an embed request (M6 runs one on most
    # turns via preload_memory recall) selects set "embed"=[e] and evicts the GPU
    # worker, which then reloads on the next chat: a ~1-2min swap each way. Pinning
    # e into every GPU set makes {worker, judge, embed} a valid loaded state, so an
    # embed request is satisfied by the already-loaded set (no swap). cost 9999
    # alone can't do this: it stops OTHER picks from evicting e, but if no set
    # CONTAINS both, e must be evicted to load the workers.
    # Solver mechanics for the GPU pair: switching g→q, [q,j,e] costs 1 (evict g)
    # vs [q] which costs more (evict g+j); solver keeps j+e warm across switches.
    workers:  "(g | q | v) & j & e"
    # The coder co-resides with the judge too: a code REVIEW runs the reviewer (c)
    # and the gate judge (j) in a tight loop, so without j here they thrashed (c
    # evicted j every verdict, then reloaded its 256K KV — minutes each way). j's
    # experts are offloaded to CPU (-ncmoe below) so its GPU footprint fits beside
    # the ~55GB coder. j stays warm across the plan(g)→review(c) switch (both sets
    # hold j & e), so a review takes ONE swap, not one per judge round.
    coding:   "c & j & e"
    # Large fallbacks one at a time; no judge (too big to co-reside), embed kept.
    fallback: "(p | n9 | sl) & e"
    # Pure-embed request when no GPU worker is loaded → just e.
    embed:    "e"
    # CPU-only eval judges — batch grading; cost 9999 means never evicted.
    cpu:      "g12 | sm"

models:
  # --no-mmap is critical for the 65GB+ models in this group: mmap'd reads
  # serialize on page faults (single-threaded), turning a 1-min load into 30+
  # minutes. Direct sequential reads load 65GB in under a minute. Cost: peak
  # RSS during load equals the full model size and no warm-restart page cache.
  "gpt-oss-120b":
    proxy: "http://127.0.0.1:9999"
    ttl: 1800
    env:
      - "GPU_MAX_HW_QUEUES=1"
    # Native MXFP4 GGUF (ggml-org), ~59 GiB — gpt-oss is TRAINED in MXFP4, so the
    # f16 upcast (unsloth :F16, 65.4 GB) added ~6 GB for zero quality gain. The
    # MXFP4 file is the canonical full-quality weights. The ~6 GB it frees lets
    # us run native 128K context (-c 131072) with only a modest -ncmoe offload.
    # --reasoning-format auto: extract the harmony `analysis` channel into
    # reasoning_content instead of leaving it inline in `content`. Without it
    # the model's planning text leaks into the answer.
    # --split-mode layer (NOT tensor): tensor-split's AllReduce init fails when
    # GPU1 is contended (e.g. the immich vaapi transcode holds a HIP context) ->
    # "AllReduce init failed (n_devices != 2?)" -> meta-backend butterfly fallback
    # -> GGML_ASSERT(buffer)/cudaMalloc OOM in graph_reserve at load (2026-05-25;
    # same bug family as minimax). Layer-split (pipeline) avoids the AllReduce path.
    # Dropping tensor-split also UNLOCKS KV quant (q8_0 below) — tensor-split forbids
    # it — which halves the KV and buys back headroom.
    # -ncmoe 4: offload the expert FFN of 4 layers to CPU for margin; with q8 KV
    # freeing VRAM this can likely drop back toward 2 for speed once it's stable.
    cmd: >
      /app/llama-server
      -hf ggml-org/gpt-oss-120b-GGUF
      --jinja
      --reasoning-format auto
      --temp 1.0
      --top-p 1.0
      --top-k 0
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -ncmoe 4
      -c 131072
      -fa on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --parallel 1
      --port 9999

  # Thinking ON, bounded (reverted 2026-06-14). We tried thinking OFF (--reasoning-
  # budget 0 + enable_thinking:false) to stop reasoning leaks, but it appears to have
  # REMOVED the model's ability to judge when it has enough: researchers ran away to
  # hundreds of tool calls (688 observed), blowing the context window and burning
  # 30+ min/node. Reasoning models use the think phase to self-regulate ("do I have
  # enough? then stop and answer"), so we restore it.
  # --reasoning-format deepseek: <think> → reasoning_content (out of content); the
  # answer AND tool calls stay in content where they parse (--reasoning-format auto
  # mis-routed qwen3.6's qwen3_coder tool-call XML, gh#20809 — do NOT use auto here).
  # --reasoning-budget 512: bound thinking so it can't run past max_tokens before
  # emitting an answer. Kept at the self-regulation sweet spot — do NOT tune it to
  # chase empty nodes. Empties were Qwen writing tool calls (and sometimes the whole
  # answer) inside an unclosed <think>, so deepseek filed them under reasoning_content
  # and content came back empty (llama.cpp#22684, closed not-planned). No budget value
  # fixes both: bump it and answers get trapped in reasoning; drop it and researchers
  # run away (688 tool calls). Quack's OpenAI adapter now RECOVERS the misclassification
  # client-side — parses <tool_call> XML out of reasoning_content into real tool calls,
  # and promotes a reasoning-only turn to the answer — so 512 is free to stay tuned for
  # reasoning quality, not empties.
  # Any leak into content is scrubbed by Quack's StripThinking + clean_output judge
  # criterion; runaway over-fetching is backstopped by a hard tool-call cap in the
  # gate (internal/vetting). Sampling = Qwen3 thinking profile (temp 1.0 / top-p 0.95
  # / top-k 20 / min-p 0 / presence 1.5).
  # --no-mmap: ~25 GB Q5, mmap'd reads serialize on page faults (cold reload ~15min).
  # --parallel 2 + -c 131072: 2 concurrent nodes (matches Quack's dag.max_active_nodes
  # =2), KV split into 2× 65536 slots. Context halved from 262144 to leave VRAM for
  # the co-resident gemma judge.
  "qwen3.6-35b":
    proxy: "http://127.0.0.1:9999"
    ttl: 1800
    env:
      - "GPU_MAX_HW_QUEUES=1"
    cmd: >
      /app/llama-server
      -hf unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q5_K_XL
      --jinja
      --reasoning-format deepseek
      --reasoning-budget 512
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      -fa on
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -c 131072
      --parallel 2
      -ub 2048
      -b 2048
      --cache-type-k q8_0
      --cache-type-v q8_0
      --port 9999

  # Qwen3-Coder-Next — 80B/3B-active HYBRID MoE (Gated DeltaNet + Gated Attention),
  # ~49 GB Q4, 256K native, non-thinking. The hybrid layout has only ~12 attention
  # layers (2 KV heads) so the KV cache stays small → 256K fits despite the size
  # (~55 GB w/ q8 KV). Sampling temp 1.0/top-p 0.95/top-k 40. --no-mmap (>30 GB).
  # NEW arch — VERIFY it loads on this image (Qwen3-Next/DeltaNet support is recent);
  # if unsupported or q8 KV rejects the recurrent state, that surfaces at load.
  "qwen3-coder-next":
    proxy: "http://127.0.0.1:9999"
    ttl: 1800
    env:
      - "GPU_MAX_HW_QUEUES=1"
    cmd: >
      /app/llama-server
      -hf unsloth/Qwen3-Coder-Next-GGUF:UD-Q4_K_XL
      --jinja
      --temp 1.0
      --top-p 0.95
      --top-k 40
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -c 262144
      -ub 2048
      -b 2048
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa on
      --port 9999

  "qwen3.5-9b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -hf unsloth/Qwen3.5-9B-GGUF:UD-Q4_K_XL
      --jinja
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      -ngl 999
      -c 32768
      --cache-type-k q8_0
      --cache-type-v q8_0
      --chat-template-kwargs '{"enable_thinking": false}'
      --port 9999

  # Qwen3-VL 32B — OCR/vision for the document-pipeline. Handwriting needs the
  # bigger model; OCR is offline/batch so the slower speed is fine. Vision-mode
  # sampling per Qwen's VL recommendation (temp 0.7, top_p 0.8, top_k 20,
  # presence 1.5, repeat 1.0 — NOT the text-mode 1.0/1.0/40/presence 2.0). mmproj
  # via --mmproj-url (this build has no --mmproj-hf); F32 projector is materially
  # better for OCR. OCR requests should set max_tokens up to 16384.
  "qwen3-vl-32b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -hf unsloth/Qwen3-VL-32B-Instruct-GGUF:UD-Q4_K_XL
      --mmproj-url https://huggingface.co/unsloth/Qwen3-VL-32B-Instruct-GGUF/resolve/main/mmproj-F32.gguf
      --jinja
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      --repeat-penalty 1.0
      -ngl 999
      -c 32768
      --image-min-tokens 2048
      --image-max-tokens 8192
      --port 9999

  # Qwen3-Omni 30B-A3B — M4 media-reader: native image + audio + text in one model.
  # Q4_K_M ~17.3 GB main GGUF + bf16 mmproj ~2.1 GB. MoE (3B active params) so it
  # co-resides with gemma4-26b-a4b (~15 GB) comfortably in 64 GB.
  # --reasoning-format deepseek + --reasoning-budget 512: same as qwen3.6-35b
  # (Omni shares the Qwen3 thinking architecture). --no-mmap: 17+ GB, cold mmap
  # serializes on page faults. --parallel 2: matches dag.max_active_nodes=2.
  # Audio ROCm support: verify on first deploy — llama.cpp omni audio is recent.
  # If audio fails to load, drop --mmproj-url and fall back to image-only until
  # a confirmed ROCm build ships with audio support.
  "qwen3-omni-30b":
    proxy: "http://127.0.0.1:9999"
    ttl: 1800
    env:
      - "GPU_MAX_HW_QUEUES=1"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/Qwen3-Omni-30B-A3B-Instruct-Q4_K_M.gguf
      --mmproj /root/.cache/huggingface/mmproj-Qwen3-Omni-30B-A3B-Instruct-bf16.gguf
      --jinja
      --reasoning-format deepseek
      --reasoning-budget 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -c 32768
      --image-min-tokens 2048
      --image-max-tokens 8192
      --parallel 1
      -ub 2048
      -b 2048
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa on
      --port 9999

  # GPU promptfoo judge — Atla Selene-1 70B (purpose-trained for 1-5 rubric
  # scoring). As a >30GB model it needs --no-mmap + tensor split (KV quant is
  # incompatible with tensor split, so KV stays fp16). Grading runs after
  # generation with the model under test swapped out, so the judge has both GPUs.
  # --parallel 1: grading runs at concurrency 1 (one call at a time), so the
  # single slot gets the whole -c budget. -c 32768 is sized for the compare
  # phase, whose select-best prompt holds all four models' (long) responses at
  # once; per-suite grading needs far less.
  "selene":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -hf mradermacher/Selene-1-Llama-3.3-70B-i1-GGUF:Q4_K_M
      --alias selene
      --jinja
      --temp 0
      --top-k 1
      --no-mmap
      --split-mode tensor
      -fit off
      -ngl 999
      -c 32768
      -ub 2048
      -b 2048
      -fa on
      --parallel 1
      --port 9999

  # CPU-only (-ngl 0): 4B (downgraded from 8B 2026-06 — 8B Q8 on CPU was slow,
  # up to minutes per embed under load). 4B Q8 (~4 GB) is materially faster and
  # plenty for memory recall. -t 8 (not 24): the all-core burst drove the die to
  # Tjmax (92-101°C observed in Prometheus) and thermal-throttled mid-embed, so
  # the same input ran 119ms cool vs ~6s hot; fewer threads = smaller thermal
  # spike + more consistent latency on this cooling-limited box. NOTE: 4B emits
  # 2560-dim vectors (8B was 4096) — drop the existing Qdrant memory collections
  # so Quack recreates them at the new dimension (it sizes one only on creation).
  "qwen3-embed":
    proxy: "http://127.0.0.1:9998"
    ttl: 600
    # CPU-only (-ngl 0) but the ROCm build still init'd a HIP context holding
    # ~1.8 GB on GPU0 — enough to push gpt-oss-120b's KV alloc over the VRAM
    # cliff. Hide the GPUs from this process so it's truly RAM-only.
    env:
      - "HIP_VISIBLE_DEVICES="
      - "ROCR_VISIBLE_DEVICES="
    cmd: >
      /app/llama-server
      -hf Qwen/Qwen3-Embedding-4B-GGUF:Q8_0
      --embedding
      --pooling last
      -ngl 0
      -t 8
      -ub 2048
      -b 2048
      --port 9998

  # CPU-only adversarial judge for Quack — Atla Selene-1 Mini 8B (same family as
  # the 70B `selene`, purpose-trained for 1-5 rubric scoring). Resident like the
  # embed model so it never swaps the GPU main group and always offers an
  # INDEPENDENT second opinion. GPUs hidden so the ROCm build doesn't hold a HIP
  # context (same fix as qwen3-embed). Deterministic grading (temp 0, top-k 1).
  # --parallel 2 × -c 65536 = 32K tokens per slot. The G-Eval prompt
  # (constitution + rubric + question + full answer + fetched-source samples)
  # measured 10-16K tokens in practice — the old 4×8K slots rejected every call
  # with a 400, so all answers surfaced unvetted. Two slots still cover
  # concurrent gate judging; with -t 24 each call uses most cores anyway.
  "selene-mini":
    proxy: "http://127.0.0.1:9997"
    ttl: 1800
    env:
      - "HIP_VISIBLE_DEVICES="
      - "ROCR_VISIBLE_DEVICES="
    cmd: >
      /app/llama-server
      -hf mradermacher/Selene-1-Mini-Llama-3.1-8B-GGUF:Q8_0
      --alias selene-mini
      --jinja
      --temp 0
      --top-k 1
      -ngl 0
      -t 24
      -c 65536
      -ub 2048
      -b 2048
      --parallel 2
      --port 9997

  # ── Judge candidates (eval only) ─────────────────────────────────────────
  # Benchmarked against selene-mini via the promptfoo `judge` suite: does a
  # different-family model grade the agent-researcher G-Eval rubric as well as
  # Selene, and how fast? Deterministic grading (temp 0, top-k 1). enable_thinking
  # off — the rubric's reasoning lives in the per-criterion "reason" fields of the
  # JSON verdict, not a separate thinking channel (matches selene-mini), and it
  # keeps decode short. CPU-only (-ngl 0, GPUs hidden) like selene-mini — the
  # deployment target is a resident CPU judge that never swaps the GPU main group.
  # --no-mmproj: these are vision GGUFs, so -hf auto-pulls an mmproj projector;
  # this build can't load gemma-4's 'gemma4uv' projector and aborts at load. We
  # only need text grading, so skip the projector entirely.

  # Dense 12B — the slower-but-simpler control (12B active on CPU).
  "gemma4-12b":
    proxy: "http://127.0.0.1:9995"
    ttl: 600
    env:
      - "HIP_VISIBLE_DEVICES="
      - "ROCR_VISIBLE_DEVICES="
    cmd: >
      /app/llama-server
      -hf unsloth/gemma-4-12b-it-GGUF:UD-Q6_K_XL
      --no-mmproj
      --alias gemma4-12b
      --jinja
      --temp 0
      --top-k 1
      -ngl 0
      -t 24
      -c 16384
      -ub 2048
      -b 2048
      --chat-template-kwargs '{"enable_thinking": false}'
      --port 9995

  # 26B-A4B MoE — 4B active. Attention/shared on GPU (-ngl 999), but the EXPERTS are
  # offloaded to CPU (-ncmoe 99, -t 24): a code review runs the ~55GB coder AND the
  # judge in a tight loop, and full-GPU gemma (~15GB) + coder blows the 64GB box, so
  # they thrashed. Experts-on-CPU shrinks gemma's GPU footprint to a few GB (KV + a
  # small dense part) so it co-resides in BOTH the `workers` (with qwen3.6) and
  # `coding` (with the coder) sets. 4B active on 24 CPU threads keeps the judge — on
  # Quack's critical path — acceptably fast on the 10-16K rubric prompt; -c 65536
  # (~32K/slot × 2) trims KV for margin. Full-GPU was faster but couldn't co-reside
  # with the coder. To revert to CPU-only: -ngl 0, drop --no-mmap/--split-mode/-fit/
  # -fa/cache-type, -c 81920 --parallel 4. --no-mmap + --split-mode layer like the other
  # large GPU models (layer-split avoids the AllReduce path on the contended 2nd
  # GPU; -fa + q8 KV halves the cache). --parallel 2 with -c 49152 = ~24K tokens/slot:
  # Quack G-Eval prompts run 10-16K plus a ~2K verdict, so each of the 2 concurrent
  # slots (matches dag.max_active_nodes=2) needs ~18K+ — 24K is safe.
  # To revert to CPU: restore the HIP/ROCR-hide env, -ngl 0, -t 24, drop --no-mmap/
  # --split-mode/-fit/-fa/cache-type, set -c 81920 --parallel 4.
  # Sampling: gemma-4's model card prescribes top_p 0.95 / top_k 64 as the
  # "standardized config across all use cases"; temp held LOW (0.3) so verdicts
  # stay near-deterministic. (Raise toward the card's 1.0 only if grading looks off.)
  "gemma4-26b-a4b":
    proxy: "http://127.0.0.1:9994"
    ttl: 1800   # live agent-researcher judge — 30 min keeps it warm between calls
    env:
      - "GPU_MAX_HW_QUEUES=1"
    cmd: >
      /app/llama-server
      -hf unsloth/gemma-4-26B-A4B-it-GGUF:UD-Q4_K_XL
      --alias gemma4-26b-a4b
      --jinja
      --temp 0.3
      --top-p 0.95
      --top-k 64
      --split-mode layer
      -fit off
      -ngl 999
      -ncmoe 99
      -t 24
      -fa on
      -c 65536
      -ub 2048
      -b 2048
      --parallel 2
      --cache-type-k q8_0
      --cache-type-v q8_0
      --chat-template-kwargs '{"enable_thinking": false}'
      --port 9994
