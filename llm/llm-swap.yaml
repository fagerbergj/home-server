healthCheckTimeout: 1200  # gpt-oss-120b + 256K KV cache for coder takes time to init
logLevel: debug

groups:
  # Only one chat model loaded at a time; won't evict the embed group.
  main:
    swap: true
    exclusive: false
    members:
      - gpt-oss-120b
      - qwen3.6-35b
      - qwen3.5-9b
      - qwen3-vl-8b
      - qwen3-coder-next
      - selene   # promptfoo judge; swaps with chat models so it only competes
                 # for VRAM during the (cached) compare phase, not alongside a
                 # model under test

  # Stays loaded regardless of what the main group is doing.
  embed:
    swap: false
    exclusive: false
    persistent: true
    members:
      - qwen3-embed

models:
  # --no-mmap is critical for the 65GB+ models in this group: mmap'd reads
  # serialize on page faults (single-threaded), turning a 1-min load into 30+
  # minutes. Direct sequential reads load 65GB in under a minute. Cost: peak
  # RSS during load equals the full model size and no warm-restart page cache.
  "gpt-oss-120b":
    proxy: "http://127.0.0.1:9999"
    ttl: 3600
    # --reasoning-format auto: extract the harmony `analysis` channel into
    # reasoning_content instead of leaving it inline in `content`. Without it
    # the model's planning text leaks into the answer.
    cmd: >
      /app/llama-server
      -hf unsloth/gpt-oss-120b-GGUF:F16
      --jinja
      --reasoning-format auto
      --no-mmap
      --split-mode tensor
      -fit off
      -ngl 999
      -c 32768
      --port 9999

  # Thinking left ON (backs the clarify stage). --reasoning-format auto keeps
  # reasoning out of `content`; needs a generous max_tokens (~4096+) or its
  # reasoning truncates before the answer.
  "qwen3.6-35b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -hf unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_M
      --jinja
      --reasoning-format auto
      -ngl 999
      -c 40960
      --cache-type-k q8_0
      --cache-type-v q8_0
      --port 9999

  "qwen3.5-9b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -hf unsloth/Qwen3.5-9B-GGUF:Q4_K_M
      --jinja
      -ngl 999
      -c 32768
      --cache-type-k q8_0
      --cache-type-v q8_0
      --chat-template-kwargs '{"enable_thinking": false}'
      --port 9999

  "qwen3-vl-8b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -hf unsloth/Qwen3-VL-8B-Instruct-GGUF:Q4_K_M
      --mmproj-hf unsloth/Qwen3-VL-8B-Instruct-GGUF:mmproj-F16
      --jinja
      -ngl 999
      -c 8192
      --port 9999

  # Hybrid Gated-DeltaNet + Attention MoE (80B/3B active, 12 of 48 layers
  # use real KV cache). KV quantization (--cache-type-k/v) is incompatible
  # with this architecture — causes segfault on init. The model's actual
  # KV cache is small enough (2 KV heads × 12 attention layers) that fp16
  # at 256K still fits comfortably.
  "qwen3-coder-next":
    proxy: "http://127.0.0.1:9999"
    ttl: 3600
    cmd: >
      /app/llama-server
      -hf unsloth/Qwen3-Coder-Next-GGUF:Q4_K_M
      --jinja
      --reasoning-format auto
      --no-mmap
      --split-mode tensor
      -fit off
      -ngl 999
      -c 262144
      --port 9999

  # GPU promptfoo judge (Atla Selene-1-Mini, trained for 1-5 rubric scoring).
  # In the main group so it swaps with the model under test — only ever
  # resident during the compare phase, which runs off cached model outputs so
  # the full GPU is free. For per-model rubric evals use the CPU llm-judge
  # container instead (it can coexist with any model under test).
  "selene":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    # -c is the TOTAL KV budget, split across --parallel slots. 32768 / 4 =
    # 8192 per slot — enough for a select-best prompt (all 4 models'
    # responses + rubric) while running 4 judge calls in parallel.
    cmd: >
      /app/llama-server
      -hf bartowski/Selene-1-Mini-Llama-3.1-8B-GGUF:Q4_K_M
      --alias selene
      --jinja
      -ngl 999
      -c 32768
      --parallel 4
      --port 9999

  # CPU-only (-ngl 0): 0.6B model is fast on CPU anyway, frees ~0.7 GB VRAM
  # and avoids any GPU contention with the main group's chat/coder models.
  "qwen3-embed":
    proxy: "http://127.0.0.1:9998"
    ttl: -1
    cmd: >
      /app/llama-server
      -hf Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0
      --embedding
      --pooling cls
      -ngl 0
      -ub 2048
      -b 2048
      --port 9998
