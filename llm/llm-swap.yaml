healthCheckTimeout: 1200  # 256K KV cache models take time to init
logLevel: debug

matrix:
  vars:
    # Quack GPU workers
    q:   "qwen3-omni-30b"    # media-reader: the only audio-capable model
    g38: "qwen3.8-27b"       # chat / research / code / vision - the default worker
    # Live Quack judge (GPU)
    j:   "gemma4-26b-a4b"
  # The embedder and qwen3.5-9b run on the media box's 3090 (llm-swap-media.yaml),
  # which peers here for these models. qwen3.8-flash-next runs in the sibling ROCm
  # container on this box (llm-swap-rocm.yaml, :11437) - it needs both cards and
  # the two containers can't evict each other, so it only loads when this one is idle.

  costs:
    j:   50    # keep the judge warm across worker switches (g→q evicts g at 1, not j)

  sets:
    workers:  "(g38 | q) & j"
    judge:    "j"

models:
  # All entries load via -m (direct path), not -hf: HF_HUB_OFFLINE=1 + an
  # inconsistent HF cache makes -hf resolution exit 1 before load.

  # Dense 27B hybrid, native vision. ALONE on the second card (GGML_VK_VISIBLE_DEVICES=0): decodes
  # ~47-48 t/s on one R9700 and the 2-card layer split bought nothing but contention
  # with gemma. -ub 512 (not 2048): FA scratch at large ubatch made short calls swing
  # 17-38 t/s. KV q8_0 (8.7GB at 262144): f16 would be 16GB and not fit; q4_0 on HIP
  # had no fast FA path at head_dim 256 (8 t/s/slot at 52k). Vulkan, one request at
  # 90k: Q4+q8_0@262k 36.3 decode / 488 prefill; Q5+f16@131k 40.2/623; HIP Q5 32.5/376.
  # --parallel 2 --kv-unified: slots share the whole 262144 pool rather than
  # splitting it, so one long node can still use it all. 2 not 4: at 30k prompts
  # 2 concurrent requests measured 151.9s vs 123.7s run serially (0.81x).
  # DFlash2 draft (incoai, 1.1 GB Q4_K_M) beats the built-in MTP head on jaison:
  # 56/50/39 t/s (short code / short prose / 90k) vs 50/48/37 at n-max 4; n-max 7
  # over-drafts and loses on prose (34) and at 90k (30). ROCm was slower for this
  # model in every combination (best 47/44/36 with f16 KV @131k), so it stays on Vulkan.
  # UD-Q4_K_XL: unsloth's dynamic quant (Q5 is +3GB for ~7% slower decode at 262k);
  # ggml-org Q4_K_M has no MTP head.
  # reasoning_effort low + a 4096 thinking budget: at medium/unbounded a single
  # step burned 8.8-18k reasoning tokens. The budget MESSAGE matters - the old
  # 512 test thrashed (105 tool calls vs 48) because it cut thinking off silently.
  # Thinking is ~95% of review decode (28k vs 1.4k output over 53 turns, ~530/turn):
  # the lever is turn count, not budget.
  "qwen3.8-27b":
    proxy: "http://127.0.0.1:9993"
    ttl: 1800
    env:
      - "GGML_VK_VISIBLE_DEVICES=0"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/snapshots/4ca720788d1e01f1bff70c033e0d0028fd02e502/Qwen3.8-27B-UD-Q4_K_XL.gguf
      --mmproj /root/.cache/huggingface/direct/mmproj-Qwen3.8-27B-BF16.gguf
      --jinja
      --reasoning-format deepseek
      --chat-template-kwargs '{"reasoning_effort":"low"}'
      --reasoning-budget 4096
      --reasoning-budget-message 'Thinking budget reached. Stop analyzing and give your best answer or tool call now, based on what you already know.'
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 0
      -fa on
      --no-mmap
      -fit off
      -ngl 999
      -c 262144
      --image-min-tokens 2048
      --image-max-tokens 8192
      --parallel 2
      --kv-unified
      -ub 512
      -b 2048
      --cache-type-k q8_0
      --cache-type-v q8_0
      -md /root/.cache/huggingface/hub/models--incoai--Qwen3.8-27B-DFlash2-GGUF/snapshots/51962825493a48b846b40126d35c799ac4093ad0/Qwen3.8-27B-DFlash2-Q4_K_M.gguf
      --spec-type draft-dflash
      --spec-draft-n-max 4
      --port 9993
      --metrics


  # M4 media-reader, kept for AUDIO only - qwen3.8-27b covers text/image/video.
  # MoE (3B active) co-resides with gemma4-26b-a4b (~15GB) comfortably in 64GB.
  # reasoning-format deepseek: auto mis-routes Qwen3 tool-call XML into content.
  # --no-mmap: 17+GB, cold mmap serializes on page faults.
  # Audio ROCm support is recent - verify on first deploy; if it fails to load,
  # drop the --mmproj arg and run image-only until a confirmed build ships with audio.
  "qwen3-omni-30b":
    proxy: "http://127.0.0.1:9999"
    ttl: 1800
    env:
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/Qwen3-Omni-30B-A3B-Instruct-Q4_K_M.gguf
      --mmproj /root/.cache/huggingface/mmproj-Qwen3-Omni-30B-A3B-Instruct-bf16.gguf
      --jinja
      --reasoning-format deepseek
      --reasoning-budget 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -c 32768
      --image-min-tokens 2048
      --image-max-tokens 8192
      --parallel 1
      -ub 2048
      -b 2048
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa on
      --port 9999
      --metrics


  # Dense 30B agentic candidate (~16GB Q4), no set membership until it passes eval.
  # NEW arch, needs llama.cpp b10353+; if the mmproj aborts at load, run text-only.
  "muse-glimmer-30b":
    proxy: "http://127.0.0.1:9996"
    ttl: 600
    env:
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--Muse-Glimmer-30B-GGUF/snapshots/faa5b025c584459c13febfa5c59883516710ae39/Muse-Glimmer-30B-UD-Q4_K_XL.gguf
      --mmproj /root/.cache/huggingface/hub/models--unsloth--Muse-Glimmer-30B-GGUF/snapshots/faa5b025c584459c13febfa5c59883516710ae39/mmproj-Muse-Glimmer-30B-Q8_0.gguf
      --alias muse-glimmer-30b
      --jinja
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --no-mmap
      -ngl 999
      -c 131072
      --parallel 1
      -ub 2048
      -b 2048
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa on
      --port 9996
      --metrics

  # 26B-A4B MoE, ~17GB, on the first card with the embedder, 11GB headroom. -ncmoe 8
  # kept from the shared era; retest lower before changing (it used to SIGABRT).
  # -ub 512: 2048 needs 1.3GB scratch, which OOMed next to a busy worker.
  "gemma4-26b-a4b":
    proxy: "http://127.0.0.1:9994"
    ttl: 3600   # 2x the workers: called once per gated node, so 1800 expired between calls and every round re-prefilled cold (0 cached vs ~29K prompts)
    env:
      - "GGML_VK_VISIBLE_DEVICES=1"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/snapshots/3bb10d594514ef4edb7f3a65d41a7e4eb8c5767a/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
      --alias gemma4-26b-a4b
      --jinja
      --temp 0.3
      --top-p 0.95
      --top-k 64
      -fit off
      -ngl 999
      -ncmoe 8
      -fa on
      -c 131072
      -ub 512
      -b 2048
      --parallel 2
      --kv-unified
      --cache-type-k q8_0
      --cache-type-v q8_0
      --chat-template-kwargs '{"enable_thinking": false}'
      --port 9994
      --metrics
