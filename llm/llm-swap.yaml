healthCheckTimeout: 1200  # gpt-oss-120b + 256K KV cache models take time to init
logLevel: debug

matrix:
  vars:
    # Quack GPU workers
    g:   "qwen3.6-35b"       # chat / web-researcher
    q:   "qwen3-omni-30b"    # media-reader (image + audio)
    v:   "qwen3-vl-32b"      # image-reader (dense OCR / handwriting)
    g38: "qwen3.8-27b"       # dense hybrid, native vision - candidate chat/vision worker
    # Live Quack judge (GPU)
    j:   "gemma4-26b-a4b"
    # Large GPU fallbacks
    p:   "gpt-oss-120b"      # heavy reasoner
    n9:  "qwen3.5-9b"        # doc-pipeline workhorse
    # Always-on
    e:   "qwen3-embed"

  costs:
    j:   50    # keep the judge warm across worker switches (g→q evicts g at 1, not j)
    e:   9999  # always resident (ttl 0), never worth evicting

  sets:
    # & e is required: without it, Quack's frequent embed calls (memory recall,
    # node-handoff) would pick the "embed" set and evict the GPU worker instead.
    workers:  "(g | q | v | g38) & j & e"
    judge:    "j & e"
    # No judge/embed - a 59GB model has room for neither; an embed here pays a swap.
    fallback: "(p | n9) & e"
    # Pure-embed request when no GPU worker is loaded → just e.
    embed:    "e"

models:
  # All entries load via -m (direct path), not -hf: HF_HUB_OFFLINE=1 + an
  # inconsistent HF cache makes -hf resolution exit 1 before load.
  "gpt-oss-120b":
    proxy: "http://127.0.0.1:9999"
    ttl: 1800
    env:
      - "GPU_MAX_HW_QUEUES=1"
    # --no-mmap: page-fault-serialized mmap reads take 30+min on 65GB+ models;
    # direct reads load in under a minute (costs full-model peak RSS at load).
    # --split-mode layer, NOT tensor: no XGMI between the two cards, so tensor
    # parallelism's per-token AllReduce crosses PCIe - measured 30% slower.
    # (-ts/--tensor-split is a RATIO, a separate flag, and is unaffected.)
    # MXFP4 is gpt-oss's native trained precision (not a lesser quant) - the f16
    # upcast is ~6GB larger for no quality gain; that headroom funds native -c 131072.
    # --reasoning-format auto: without it, harmony's analysis channel leaks into content.
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/direct/gpt-oss-120b-MXFP4.gguf
      --jinja
      --reasoning-format auto
      --temp 1.0
      --top-p 1.0
      --top-k 0
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -ncmoe 4
      -c 131072
      -fa on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --parallel 1
      --port 9999
      --metrics

  # Thinking UNBOUNDED: budget 512 made it thrash (105 tool calls / 20 min on a
  # PR review vs 48 calls / 14 min unbounded, same PR). Disabling thinking
  # entirely caused runaway tool-calling - leave it on with no budget.
  # --reasoning-format deepseek (not auto): auto mis-routes this model's tool-call
  # XML into content.
  # --no-mmap: ~25GB Q5, cold mmap reload ~15min.
  # -c 262144 --parallel 1 = one 256K slot shared by both concurrent DAG nodes
  # (dag.max_active_nodes=2 queues for it rather than getting its own). -ncmoe 4
  # leaves headroom for the GPU gemma judge (~15GB) to co-reside in `workers`.
  "qwen3.6-35b":
    proxy: "http://127.0.0.1:9999"
    ttl: 1800
    env:
      - "GPU_MAX_HW_QUEUES=1"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/snapshots/a483e9e6cbd595906af30beda3187c2663a1118c/Qwen3.6-35B-A3B-UD-Q5_K_XL.gguf
      --jinja
      --reasoning-format deepseek
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 0
      -fa on
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -ncmoe 2
      -c 262144
      --parallel 1
      -ub 512
      -b 2048
      --cache-type-k q8_0
      --cache-type-v q8_0
      --port 9999
      --metrics

  # Dense 27B hybrid, native vision. ALONE on GPU1 (ROCR_VISIBLE_DEVICES=1): decodes
  # ~47-48 t/s on one R9700 and the 2-card layer split bought nothing but contention
  # with gemma. -ub 512 (not 2048): FA scratch at large ubatch made short calls swing
  # 17-38 t/s. KV q4_0 (not q8): same decode,
  # frees ~4GB so 262144 fits alone. draft-mtp: n-max 2 beats 3; p-min 0.65 loses.
  # UD-Q4_K_XL kept over Q4_0 (+9%, coarser); ggml-org Q4_K_M has no MTP head.
  # Reasoning medium via chat_template_kwargs (the API field is ignored); no budget.
  "qwen3.8-27b":
    proxy: "http://127.0.0.1:9993"
    ttl: 1800
    env:
      - "GPU_MAX_HW_QUEUES=1"
      - "ROCR_VISIBLE_DEVICES=1"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/direct/Qwen3.8-27B-UD-Q5_K_XL.gguf
      --mmproj /root/.cache/huggingface/direct/mmproj-Qwen3.8-27B-BF16.gguf
      --jinja
      --reasoning-format deepseek
      --chat-template-kwargs '{"reasoning_effort":"medium"}'
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 0
      -fa on
      --no-mmap
      -fit off
      -ngl 999
      -c 262144
      --image-min-tokens 2048
      --image-max-tokens 8192
      --parallel 1
      -ub 512
      -b 2048
      --cache-type-k q4_0
      --cache-type-v q4_0
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --port 9993
      --metrics

  "qwen3.5-9b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--Qwen3.5-9B-GGUF/snapshots/3885219b6810b007914f3a7950a8d1b469d598a5/Qwen3.5-9B-UD-Q4_K_XL.gguf
      --jinja
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      -ngl 999
      -c 32768
      --cache-type-k q8_0
      --cache-type-v q8_0
      --chat-template-kwargs '{"enable_thinking": false}'
      --port 9999
      --metrics

  # Vision-mode sampling (temp .7/top_p .8/top_k 20/presence 1.5/repeat 1.0) -
  # NOT the text-mode profile (1.0/1.0/40/presence 2.0) used for other Qwen models.
  # --mmproj-url (no --mmproj-hf on this build); F32 projector for OCR accuracy.
  "qwen3-vl-32b":
    proxy: "http://127.0.0.1:9999"
    ttl: 600
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--Qwen3-VL-32B-Instruct-GGUF/snapshots/b9262a359f54dead8e2609f6146e2fc3398fd0d9/Qwen3-VL-32B-Instruct-UD-Q4_K_XL.gguf
      --mmproj-url https://huggingface.co/unsloth/Qwen3-VL-32B-Instruct-GGUF/resolve/main/mmproj-F32.gguf
      --jinja
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      --repeat-penalty 1.0
      -ngl 999
      -c 32768
      --image-min-tokens 2048
      --image-max-tokens 8192
      --port 9999
      --metrics

  # M4 media-reader (native image+audio+text). MoE (3B active) co-resides with
  # gemma4-26b-a4b (~15GB) comfortably in 64GB. Reasoning-format/budget: same
  # rationale as qwen3.6-35b (shares the Qwen3 thinking architecture).
  # --no-mmap: 17+GB, cold mmap serializes on page faults.
  # Audio ROCm support is recent - verify on first deploy; if it fails to load,
  # drop the --mmproj arg and run image-only until a confirmed build ships with audio.
  "qwen3-omni-30b":
    proxy: "http://127.0.0.1:9999"
    ttl: 1800
    env:
      - "GPU_MAX_HW_QUEUES=1"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/Qwen3-Omni-30B-A3B-Instruct-Q4_K_M.gguf
      --mmproj /root/.cache/huggingface/mmproj-Qwen3-Omni-30B-A3B-Instruct-bf16.gguf
      --jinja
      --reasoning-format deepseek
      --reasoning-budget 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      --no-mmap
      --split-mode layer
      -fit off
      -ngl 999
      -c 32768
      --image-min-tokens 2048
      --image-max-tokens 8192
      --parallel 1
      -ub 2048
      -b 2048
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa on
      --port 9999
      --metrics

  # 4B Q8 on GPU0 with gemma (ROCR_VISIBLE_DEVICES=0). Measured 15-64ms/req GPU vs
  # 0.8-4s on CPU under load. 2560-dim vectors: switching embed models means dropping
  # the Qdrant memory collections (dimension is fixed at creation).
  "qwen3-embed":
    proxy: "http://127.0.0.1:9998"
    # ttl 0 (always resident): at ttl 600 it idle-unloaded during long explore
    # nodes, then cold-loaded on handoff - blowing Quack's 60s embed budget.
    # Still relevant on CPU (avoids ever hitting a cold-load in the hot path).
    ttl: 0
    env:
      - "ROCR_VISIBLE_DEVICES=0"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--Qwen--Qwen3-Embedding-4B-GGUF/snapshots/f4602530db1d980e16da9d7d3a70294cf5c190be/Qwen3-Embedding-4B-Q8_0.gguf
      --embedding
      --pooling last
      -ngl 999
      -c 4096
      -t 24
      -ub 2048
      -b 2048
      --port 9998
      --metrics

  # Dense 30B agentic candidate (~16GB Q4), no set membership until it passes eval.
  # NEW arch, needs llama.cpp b10353+; if the mmproj aborts at load, run text-only.
  "muse-glimmer-30b":
    proxy: "http://127.0.0.1:9996"
    ttl: 600
    env:
      - "GPU_MAX_HW_QUEUES=1"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--Muse-Glimmer-30B-GGUF/snapshots/faa5b025c584459c13febfa5c59883516710ae39/Muse-Glimmer-30B-UD-Q4_K_XL.gguf
      --mmproj /root/.cache/huggingface/hub/models--unsloth--Muse-Glimmer-30B-GGUF/snapshots/faa5b025c584459c13febfa5c59883516710ae39/mmproj-Muse-Glimmer-30B-Q8_0.gguf
      --alias muse-glimmer-30b
      --jinja
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --no-mmap
      -ngl 999
      -c 131072
      --parallel 1
      -ub 2048
      -b 2048
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa on
      --port 9996
      --metrics

  # 26B-A4B MoE, ~17GB, on GPU0 with the embedder (ROCR_VISIBLE_DEVICES=0), 11GB
  # headroom. Decodes ~48 t/s with a card to itself. -ncmoe 8 kept from the shared
  # era; retest lower against a busy worker before changing (it used to SIGABRT).
  "gemma4-26b-a4b":
    proxy: "http://127.0.0.1:9994"
    ttl: 3600   # 2x the workers: called once per gated node, so 1800 expired between calls and every round re-prefilled cold (0 cached vs ~29K prompts)
    env:
      - "GPU_MAX_HW_QUEUES=1"
      - "ROCR_VISIBLE_DEVICES=0"
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/snapshots/3bb10d594514ef4edb7f3a65d41a7e4eb8c5767a/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
      --alias gemma4-26b-a4b
      --jinja
      --temp 0.3
      --top-p 0.95
      --top-k 64
      -fit off
      -ngl 999
      -ncmoe 8
      -fa on
      -c 131072
      -ub 2048
      -b 2048
      --parallel 1
      --cache-type-k q8_0
      --cache-type-v q8_0
      --chat-template-kwargs '{"enable_thinking": false}'
      --port 9994
      --metrics
