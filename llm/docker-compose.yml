services:
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_LOAD_TIMEOUT=10m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=1h
      - OLLAMA_CONTEXT_LENGTH=16384
      - OLLAMA_SCHED_SPREAD=1            # split layers across both R9700s
      - ROCBLAS_USE_HIPBLASLT=0          # bundled hipBLASLt lacks gfx1201 kernels; use rocBLAS's own (which does)
    volumes:
      - /mnt/cache/ollama:/root/.ollama
    init: true
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "993"   # render GID on host (group name doesn't exist inside ollama:rocm image)
    restart: unless-stopped

  # Opt-in: `docker compose --profile swap up -d --build llama-swap`
  # OpenAI-compatible API on port 11436 backed by llama-swap + llama.cpp.
  # Model routing is in llama-swap.yaml — update document-pipeline env vars to point here.
  llama-swap:
    build:
      context: .
      dockerfile: llama-swap.Dockerfile
    container_name: llama-swap
    profiles: ["swap"]
    ports:
      - "11436:11436"
    environment:
      - ROCBLAS_USE_HIPBLASLT=0
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./llama-swap.yaml:/app/config.yaml:ro
      - /mnt/cache/huggingface:/root/.cache/huggingface
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "993"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_API_KEYS=true
      - USER_PERMISSIONS_FEATURES_API_KEYS=true
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
    volumes:
      - ./open-webui:/app/backend/data
    depends_on:
      - ollama
      - qdrant
    restart: unless-stopped

volumes:
  qdrant-data:
