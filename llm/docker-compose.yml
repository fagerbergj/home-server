# Two boxes, one file, selected by profile:
#   jaison (AI box):   make swap-up   -> llm-swap only (profile `swap`)
#   jason-server:      make media-up  -> qdrant + open-webui (profile `media`)
# The media box reaches llm-swap at http://192.168.50.202:11436 (DHCP-reserved);
# Traefik's public /openai route lives in api/traefik/dynamic/llm.yml.
services:
  # Primary LLM runtime — OpenAI-compatible API on port 11436 backed by
  # llama-swap + llama.cpp. Model routing is in llm-swap.yaml.
  llm-swap:
    profiles: ["swap"]
    build:
      context: .
      dockerfile: llm-swap.Dockerfile
    container_name: llm-swap
    ports:
      - "11436:11436"
    environment:
      - ROCBLAS_USE_HIPBLASLT=0
      - HF_TOKEN=${HF_TOKEN:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      # Serve models from the local HF cache only — never phone home to resolve a
      # commit at startup. A fully-downloaded model must not fail because HF is
      # unreachable (that broke gpt-oss-120b's -hf load). Download models
      # out-of-band (hf download); serving is offline.
      - HF_HUB_OFFLINE=1
    volumes:
      - ./llm-swap.yaml:/app/config.yaml:ro
      - /mnt/cache/huggingface:/root/.cache/huggingface
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "993"
    restart: unless-stopped
    # Override base image's healthcheck (curls :8080); llama-swap listens on 11436
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11436/v1/models"]
      interval: 300s
      timeout: 5s
      retries: 3
      start_period: 30s

  qdrant:
    profiles: ["media"]
    image: qdrant/qdrant:latest
    container_name: qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  open-webui:
    profiles: ["media"]
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://192.168.50.202:11436/v1
      - OPENAI_API_KEY=unused
      - ENABLE_API_KEYS=true
      - USER_PERMISSIONS_FEATURES_API_KEYS=true
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
    volumes:
      - ./open-webui:/app/backend/data
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant-data:
