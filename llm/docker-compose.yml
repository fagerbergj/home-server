services:
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_LOAD_TIMEOUT=10m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=1h
      - OLLAMA_CONTEXT_LENGTH=16384
      - OLLAMA_SCHED_SPREAD=1            # split layers across both R9700s
      - ROCBLAS_USE_HIPBLASLT=0          # bundled hipBLASLt lacks gfx1201 kernels; use rocBLAS's own (which does)
    volumes:
      - /mnt/cache/ollama:/root/.ollama
    init: true
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "993"   # render GID on host (group name doesn't exist inside ollama:rocm image)
    restart: unless-stopped

  # Opt-in: `docker compose --profile vllm up -d vllm`.
  # Off by default because it will fight Ollama for VRAM (loads one model and
  # holds it). Intended for benchmarking 70b chat with tensor parallelism — see
  # bench.py --backend vllm.
  vllm:
    image: rocm/vllm-dev:nightly        # rocm/vllm:latest ships an aiter without gfx1201 (vllm#28649)
    container_name: vllm
    profiles: ["vllm"]
    ports:
      - "8000:8000"
    ipc: host                              # required for vLLM's NCCL/RCCL workers
    environment:
      # No HSA_OVERRIDE / HIP_VISIBLE_DEVICES — setting them (even empty) breaks
      # GPU discovery in this image (see commit 05ade2c for the same lesson on ollama).
      - ROCBLAS_USE_HIPBLASLT=0            # gfx1201 kernel coverage gap, same as ollama service
      - VLLM_MODEL=${VLLM_MODEL:-hugging-quants/Meta-Llama-3.1-70B-Instruct-AWQ-INT4}
      - VLLM_MAX_MODEL_LEN=${VLLM_MAX_MODEL_LEN:-16384}
      - VLLM_TP=${VLLM_TP:-2}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    entrypoint: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
    command: >
      --model ${VLLM_MODEL:-hugging-quants/Meta-Llama-3.1-70B-Instruct-AWQ-INT4}
      --tensor-parallel-size ${VLLM_TP:-2}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-16384}
      --dtype float16
      --gpu-memory-utilization 0.90
      --served-model-name ${VLLM_SERVED_NAME:-llama-70b}
    volumes:
      - /mnt/cache/huggingface:/root/.cache/huggingface
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "993"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_API_KEYS=true
      - USER_PERMISSIONS_FEATURES_API_KEYS=true
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
    volumes:
      - ./open-webui:/app/backend/data
    depends_on:
      - ollama
      - qdrant
    restart: unless-stopped

volumes:
  qdrant-data:
