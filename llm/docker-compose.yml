# Two boxes, one file, selected by profile:
#   jaison (AI box):   make swap-up   -> llm-swap router (profile `swap`); model runtimes are sibling containers
#   jason-server:      make media-up  -> llm-swap-media + qdrant + open-webui (profile `media`)
# llm-swap-media (RTX 3090) is the single endpoint everything on the media box
# uses (network alias `llm-swap`); it serves the embedder + 9B itself and peers
# to jaison for the rest (llm-swap-media.yaml). Traefik's public /openai route
# (api/traefik/dynamic/llm.yml) points at it too.
services:
  # jaison router: llama-swap only. Model runtimes are sibling containers it starts
  # over the Docker socket (llm-swap.yaml), so it needs host networking to reach
  # their 127.0.0.1 ports and the repo's llm/ dir at its HOST path for the vLLM
  # launcher's bind mounts.
  llm-swap:
    profiles: ["swap"]
    build:
      context: .
      dockerfile: llm-swap.Dockerfile
    container_name: llm-swap
    network_mode: host
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
    volumes:
      - ./llm-swap.yaml:/app/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/jason/workspace/home-server/llm:/home/jason/workspace/home-server/llm:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11436/v1/models"]
      interval: 300s
      timeout: 5s
      retries: 3
      start_period: 30s

  llm-swap-media:
    profiles: ["media"]
    build:
      context: .
      dockerfile: llm-swap-cuda.Dockerfile
    container_name: llm-swap-media
    runtime: nvidia
    ports:
      - "11436:11436"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HUB_OFFLINE=1
    volumes:
      - ./llm-swap-media.yaml:/app/config.yaml:ro
      # Both local models are always resident (ttl 0), so they load once from the
      # model archive on the ZFS pool (~40 s for 11 GB) and never touch disk again.
      - /mnt/media/models/huggingface:/root/.cache/huggingface
    networks:
      default:
        aliases: [llm-swap]   # quack/open-webui keep talking to http://llm-swap:11436
      api_gateway:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11436/v1/models"]
      interval: 300s
      timeout: 5s
      retries: 3
      start_period: 30s

  qdrant:
    profiles: ["media"]
    image: qdrant/qdrant:latest
    container_name: qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  open-webui:
    profiles: ["media"]
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://llm-swap:11436/v1
      - OPENAI_API_KEY=unused
      - ENABLE_API_KEYS=true
      - USER_PERMISSIONS_FEATURES_API_KEYS=true
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
    volumes:
      - ./open-webui:/app/backend/data
    depends_on:
      - qdrant
    restart: unless-stopped

networks:
  api_gateway:
    external: true

volumes:
  qdrant-data:
