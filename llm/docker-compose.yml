services:
  # Always-on judge for promptfoo — CPU-only (-ngl 0) to keep VRAM free for the
  # model under test. Evals are batch jobs so slower CPU inference is acceptable.
  # Port 11437. Point promptfoo's judge provider at http://jason-server:11437/v1.
  llm-judge:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llm-judge
    profiles: ["judge"]
    ports:
      - "11437:11437"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    command: >
      -hf bartowski/Selene-1-Mini-Llama-3.1-8B-GGUF:Q4_K_M
      --alias selene
      -ngl 0
      --threads 32
      -c 8192
      --host 0.0.0.0
      --port 11437
    volumes:
      - /mnt/cache/huggingface:/root/.cache/huggingface
    restart: unless-stopped

  # Primary LLM runtime — OpenAI-compatible API on port 11436 backed by
  # llama-swap + llama.cpp. Model routing is in llm-swap.yaml.
  llm-swap:
    build:
      context: .
      dockerfile: llm-swap.Dockerfile
    container_name: llm-swap
    ports:
      - "11436:11436"
    environment:
      - ROCBLAS_USE_HIPBLASLT=0
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./llm-swap.yaml:/app/config.yaml:ro
      - /mnt/cache/huggingface:/root/.cache/huggingface
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "993"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - ENABLE_OLLAMA_API=false
      - OPENAI_API_BASE_URL=http://llm-swap:11436/v1
      - OPENAI_API_KEY=sk-llm-swap-no-auth
      - ENABLE_API_KEYS=true
      - USER_PERMISSIONS_FEATURES_API_KEYS=true
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
    volumes:
      - ./open-webui:/app/backend/data
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant-data:
