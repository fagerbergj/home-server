services:
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_LOAD_TIMEOUT=10m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=1h
      - OLLAMA_CONTEXT_LENGTH=16384
      - OLLAMA_SCHED_SPREAD=1            # split layers across both R9700s
      - ROCBLAS_USE_HIPBLASLT=0          # bundled hipBLASLt lacks gfx1201 kernels; use rocBLAS's own (which does)
    volumes:
      - /mnt/cache/ollama:/root/.ollama
    init: true
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "993"   # render GID on host (group name doesn't exist inside ollama:rocm image)
    restart: unless-stopped

  # Always-on judge for promptfoo — CPU-only (-ngl 0) to keep VRAM free for the
  # model under test. Evals are batch jobs so slower CPU inference is acceptable.
  # Port 11437. Point promptfoo's judge provider at http://jason-server:11437/v1.
  llm-judge:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llm-judge
    profiles: ["judge"]
    ports:
      - "11437:11437"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    command: >
      -hf prometheus-eval/prometheus-7b-v2.0-GGUF:Q4_K_M
      --alias prometheus-7b
      -ngl 0
      -c 8192
      --host 0.0.0.0
      --port 11437
    volumes:
      - /mnt/cache/huggingface:/root/.cache/huggingface
    restart: unless-stopped

  # Opt-in: `docker compose --profile swap up -d --build llm-swap`
  # OpenAI-compatible API on port 11436 backed by llm-swap + llama.cpp.
  # Model routing is in llm-swap.yaml — update document-pipeline env vars to point here.
  llm-swap:
    build:
      context: .
      dockerfile: llm-swap.Dockerfile
    container_name: llm-swap
    profiles: ["swap"]
    ports:
      - "11436:11436"
    environment:
      - ROCBLAS_USE_HIPBLASLT=0
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./llm-swap.yaml:/app/config.yaml:ro
      - /mnt/cache/huggingface:/root/.cache/huggingface
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "993"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_API_KEYS=true
      - USER_PERMISSIONS_FEATURES_API_KEYS=true
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
    volumes:
      - ./open-webui:/app/backend/data
    depends_on:
      - ollama
      - qdrant
    restart: unless-stopped

volumes:
  qdrant-data:
