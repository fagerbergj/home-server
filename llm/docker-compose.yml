services:
  # Primary LLM runtime — OpenAI-compatible API on port 11436 backed by
  # llama-swap + llama.cpp. Model routing is in llm-swap.yaml.
  llm-swap:
    build:
      context: .
      dockerfile: llm-swap.Dockerfile
    container_name: llm-swap
    ports:
      - "11436:11436"
    environment:
      - ROCBLAS_USE_HIPBLASLT=0
      - HF_TOKEN=${HF_TOKEN:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
    volumes:
      - ./llm-swap.yaml:/app/config.yaml:ro
      - /mnt/cache/huggingface:/root/.cache/huggingface
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "993"
    networks:
      - default
      - api_gateway
    restart: unless-stopped
    # Override base image's healthcheck (curls :8080); llama-swap listens on 11436
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11436/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.llm-swap.loadbalancer.server.port=11436"
      - "traefik.http.routers.llm-swap.rule=Host(`api.jasonfagerberg.duckdns.org`) && PathPrefix(`/v1`)"
      - "traefik.http.routers.llm-swap.entrypoints=api"
      - "traefik.http.routers.llm-swap.service=llm-swap"
      - "traefik.http.routers.llm-swap.middlewares=llm-apikey"
      # Middleware defined here (not in the file provider) so compose expands
      # ${LLM_API_KEY} from .env — Traefik's file provider does NOT expand env vars.
      - "traefik.http.middlewares.llm-apikey.plugin.traefik-api-key-auth.headerName=X-API-Key"
      - "traefik.http.middlewares.llm-apikey.plugin.traefik-api-key-auth.keys[0]=${LLM_API_KEY}"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://llm-swap:11436/v1
      - OPENAI_API_KEY=unused
      - ENABLE_API_KEYS=true
      - USER_PERMISSIONS_FEATURES_API_KEYS=true
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
    volumes:
      - ./open-webui:/app/backend/data
    depends_on:
      - qdrant
    restart: unless-stopped

networks:
  api_gateway:
    external: true

volumes:
  qdrant-data:
