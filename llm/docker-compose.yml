services:
  # Primary LLM runtime — OpenAI-compatible API on port 11436 backed by
  # llama-swap + llama.cpp. Model routing is in llm-swap.yaml.
  llm-swap:
    build:
      context: .
      dockerfile: llm-swap.Dockerfile
    container_name: llm-swap
    ports:
      - "11436:11436"
    environment:
      - ROCBLAS_USE_HIPBLASLT=0
      - HF_TOKEN=${HF_TOKEN:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      # Serve models from the local HF cache only — never phone home to resolve a
      # commit at startup. A fully-downloaded model must not fail because HF is
      # unreachable (that broke gpt-oss-120b's -hf load). Download models
      # out-of-band (hf download); serving is offline.
      - HF_HUB_OFFLINE=1
    volumes:
      - ./llm-swap.yaml:/app/config.yaml:ro
      - /mnt/cache/huggingface:/root/.cache/huggingface
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "993"
    networks:
      - default
      - api_gateway
    restart: unless-stopped
    # Override base image's healthcheck (curls :8080); llama-swap listens on 11436
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11436/v1/models"]
      interval: 300s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.llm-swap.loadbalancer.server.port=11436"
      # Public base URL is .../openai/v1 ; strip /openai so llama-swap sees /v1/*
      - "traefik.http.routers.llm-swap.rule=Host(`api.jasonfagerberg.duckdns.org`) && PathPrefix(`/openai`)"
      - "traefik.http.routers.llm-swap.entrypoints=api"
      - "traefik.http.routers.llm-swap.service=llm-swap"
      - "traefik.http.routers.llm-swap.middlewares=llm-apikey,llm-strip"
      - "traefik.http.middlewares.llm-strip.stripprefix.prefixes=/openai"
      # Middleware defined here (not in the file provider) so compose expands
      # ${LLM_API_KEY} from .env — Traefik's file provider does NOT expand env vars.
      # NOTE: deploy with LLM_API_KEY in the environment (interactive shell, or
      # `set -a && . ../.env`); compose does not source the export-style root .env.
      # Standard OpenAI auth: Authorization: Bearer <key>. The plugin is either/or —
      # bearerToken mode parses "Bearer <key>" out of headerName, so headerName=Authorization.
      - "traefik.http.middlewares.llm-apikey.plugin.traefik-api-key-auth.headerName=Authorization"
      - "traefik.http.middlewares.llm-apikey.plugin.traefik-api-key-auth.bearerToken=true"
      - "traefik.http.middlewares.llm-apikey.plugin.traefik-api-key-auth.keys[0]=${LLM_API_KEY}"

  # Vulkan llama-swap, qwen3.8-27b only, on the card HIP calls GPU1 (see llm-swap-vk.yaml). Not on the
  # public gateway - quack's `vulkan` provider reaches it over llm_default.
  llm-swap-vk:
    build:
      context: .
      dockerfile: llm-swap-vk.Dockerfile
    container_name: llm-swap-vk
    environment:
      - HF_HUB_OFFLINE=1
    volumes:
      - ./llm-swap-vk.yaml:/app/config.yaml:ro
      - /mnt/cache/huggingface:/root/.cache/huggingface
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "993"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11437/v1/models"]
      interval: 300s
      timeout: 5s
      retries: 3
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://llm-swap:11436/v1
      - OPENAI_API_KEY=unused
      - ENABLE_API_KEYS=true
      - USER_PERMISSIONS_FEATURES_API_KEYS=true
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
    volumes:
      - ./open-webui:/app/backend/data
    depends_on:
      - qdrant
    restart: unless-stopped

networks:
  api_gateway:
    external: true

volumes:
  qdrant-data:
