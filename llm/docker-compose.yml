services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - "11434:11434"
    env_file:
      - ../.env
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
    volumes:
      - ./data:/root/.ollama
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "3000:8080"
    env_file:
      - ../.env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
    volumes:
      - ./open-webui:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped
