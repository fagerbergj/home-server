# Two boxes, one file, selected by profile:
#   jaison (AI box):   make swap-up   -> llm-swap (profile `swap`): the big models on 2x R9700
#   jason-server:      make media-up  -> llm-swap-media + qdrant + open-webui (profile `media`)
# llm-swap-media (RTX 3090) is the single endpoint everything on the media box
# uses (network alias `llm-swap`); it serves the embedder + 9B itself and peers
# to jaison for the rest (llm-swap-media.yaml). Traefik's public /openai route
# (api/traefik/dynamic/llm.yml) points at it too.
services:
  # Primary LLM runtime — OpenAI-compatible API on port 11436 backed by
  # llama-swap + llama.cpp. Model routing is in llm-swap.yaml.
  llm-swap:
    profiles: ["swap"]
    build:
      context: .
      dockerfile: llm-swap.Dockerfile
    container_name: llm-swap
    ports:
      - "11436:11436"
    environment:
      - ROCBLAS_USE_HIPBLASLT=0
      - HF_TOKEN=${HF_TOKEN:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      # Serve models from the local HF cache only — never phone home to resolve a
      # commit at startup. A fully-downloaded model must not fail because HF is
      # unreachable (that broke gpt-oss-120b's -hf load). Download models
      # out-of-band (hf download); serving is offline.
      - HF_HUB_OFFLINE=1
    volumes:
      - ./llm-swap.yaml:/app/config.yaml:ro
      - /mnt/cache/huggingface:/root/.cache/huggingface
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "993"
    restart: unless-stopped
    # Override base image's healthcheck (curls :8080); llama-swap listens on 11436
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11436/v1/models"]
      interval: 300s
      timeout: 5s
      retries: 3
      start_period: 30s

  llm-swap-media:
    profiles: ["media"]
    build:
      context: .
      dockerfile: llm-swap-cuda.Dockerfile
    container_name: llm-swap-media
    runtime: nvidia
    ports:
      - "11436:11436"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HUB_OFFLINE=1
    volumes:
      - ./llm-swap-media.yaml:/app/config.yaml:ro
      - /mnt/cache/huggingface:/root/.cache/huggingface
    networks:
      default:
        aliases: [llm-swap]   # quack/open-webui keep talking to http://llm-swap:11436
      api_gateway:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11436/v1/models"]
      interval: 300s
      timeout: 5s
      retries: 3
      start_period: 30s

  qdrant:
    profiles: ["media"]
    image: qdrant/qdrant:latest
    container_name: qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  open-webui:
    profiles: ["media"]
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://llm-swap:11436/v1
      - OPENAI_API_KEY=unused
      - ENABLE_API_KEYS=true
      - USER_PERMISSIONS_FEATURES_API_KEYS=true
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
    volumes:
      - ./open-webui:/app/backend/data
    depends_on:
      - qdrant
    restart: unless-stopped

networks:
  api_gateway:
    external: true

volumes:
  qdrant-data:
