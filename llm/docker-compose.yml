services:
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_LOAD_TIMEOUT=10m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=1h
      - OLLAMA_CONTEXT_LENGTH=16384
      - OLLAMA_SCHED_SPREAD=1            # split layers across both R9700s
      - ROCBLAS_USE_HIPBLASLT=0          # bundled hipBLASLt lacks gfx1201 kernels; use rocBLAS's own (which does)
    volumes:
      - /mnt/cache/ollama:/root/.ollama
    init: true
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "993"   # render GID on host (group name doesn't exist inside ollama:rocm image)
    restart: unless-stopped

  # Opt-in: `docker compose --profile tp up -d llama-tp`.
  # Spike of llama.cpp's experimental tensor parallelism (PR ggml-org/llama.cpp#19378,
  # merged 2026-04-09). The PR caveats that perf extensions are CUDA-only today —
  # the HIP path may end up slower than Ollama's --split-mode layer. Bench to find out.
  # Off by default; exposes OpenAI-compat /v1/completions, so:
  # bench.py --backend openai llama-70b
  llama-tp:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: llama-tp
    profiles: ["tp"]
    ports:
      - "8080:8080"
    environment:
      - ROCBLAS_USE_HIPBLASLT=0            # gfx1201 kernel coverage gap, same as ollama service
      - HF_TOKEN=${HF_TOKEN:-}
    command: >
      -hf ${LLAMA_TP_MODEL:-bartowski/Meta-Llama-3.3-70B-Instruct-GGUF:Q4_K_M}
      --alias ${LLAMA_TP_ALIAS:-llama-70b}
      --split-mode tensor
      -ngl 999
      -c ${LLAMA_TP_CTX:-16384}
      --host 0.0.0.0
      --port 8080
    volumes:
      - /mnt/cache/huggingface:/root/.cache/huggingface
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "993"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_API_KEYS=true
      - USER_PERMISSIONS_FEATURES_API_KEYS=true
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
    volumes:
      - ./open-webui:/app/backend/data
    depends_on:
      - ollama
      - qdrant
    restart: unless-stopped

volumes:
  qdrant-data:
