# Media-box llama-swap (RTX 3090, CUDA image; see llm-swap-cuda.Dockerfile).
# This is the endpoint quack, Open WebUI and Traefik's /openai route talk to.
# Small always-on models run here; every larger model is served by jaison's
# llama-swap and reached through the `peers` block below (llama-swap forwards by
# model name, so callers never know which box answered).
healthCheckTimeout: 900   # clef quantizes its bf16 checkpoint at every start (~7 min warm page cache; disk-cold unmeasured)
logLevel: info

models:
  # 4B Q8 embedder. Measured 15-64ms/req on GPU vs 0.8-4s on CPU under load.
  # 2560-dim vectors: switching embed models means dropping the Qdrant memory
  # collections (dimension is fixed at creation). ttl 0: at ttl 600 it idle-unloaded
  # during long explore nodes, then cold-loaded on handoff - blowing quack's 60s budget.
  "qwen3-embed":
    proxy: "http://127.0.0.1:9998"
    ttl: 0
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--Qwen--Qwen3-Embedding-4B-GGUF/snapshots/f4602530db1d980e16da9d7d3a70294cf5c190be/Qwen3-Embedding-4B-Q8_0.gguf
      --embedding
      --pooling last
      -ngl 999
      -c 16384
      --parallel 4
      -ub 2048
      -b 2048
      --port 9998
      --metrics

  # Clef 27B decisions (/upstream/clef/v1/systemone), served by the always-on compose service `clef`;
  # llama-swap only proxies and health-gates it, so cmd just holds the slot.
  "clef":
    proxy: "http://clef:8013"
    checkEndpoint: /health
    ttl: 0
    cmd: sleep infinity

# jaison (2x R9700, llm-swap.yaml). Unqualified model IDs resolve here when no
# local model has the name; keep this list in sync with jaison's llm-swap.yaml.
# Both residents on the 3090 at once; without a group llama-swap swaps one out for the other.
groups:
  resident:
    swap: false
    exclusive: false
    persistent: true
    members:
      - qwen3-embed
      - clef

peers:
  jaison:
    proxy: http://192.168.50.202:11436
    timeouts:
      responseHeader: 0   # v252 defaults 60s; non-stream calls >60s to first byte got 502 (killed plan runs)
    models:
      - qwen3.8-27b
      - qwen3.8-flash-next
      - mimo-v2.6-flash
      - glm-5.3-flash
      - qwen3-omni-30b
      - muse-glimmer-30b
