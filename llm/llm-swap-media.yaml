# Media-box llama-swap (RTX 3090, CUDA image; see llm-swap-cuda.Dockerfile).
# This is the endpoint quack, Open WebUI and Traefik's /openai route talk to.
# Clef and Omni run here; every other model (the embedder included) is served by jaison's
# llama-swap and reached through the `peers` block below (llama-swap forwards by
# model name, so callers never know which box answered).
healthCheckTimeout: 900   # clef loads in ~47 s from page cache; disk-cold from the ZFS pool unmeasured
logLevel: info
hooks:
  on_startup:
    preload: ["clef"]   # quack's decision timeout is shorter than a cold load

models:
  # Clef 27B decisions (/upstream/clef/v1/systemone): llama.cpp Q4_K_M, all 65 layers on the 3090 (~20 GB at ub 8192).
  # -ub is the hard input cap (the whole prompt is one ubatch); clef never batches across requests, so one slot.
  # -ngl 999 fails the load instead of letting --fit stream layers from host RAM (~1.4x slower per request).
  # The embedder (qwen3-embed) now runs on jaison's CPU and resolves through the peers list below.
  "clef":
    proxy: "http://127.0.0.1:9997"
    checkEndpoint: /health
    ttl: 0
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/hub/models--ggml-org--Clef-GGUF/snapshots/63840a1a68cb7084c88610cffc328509356b04cb/Clef-Q4_K_M.gguf
      --mmproj /root/.cache/huggingface/hub/models--ggml-org--Clef-GGUF/snapshots/63840a1a68cb7084c88610cffc328509356b04cb/mmproj-Clef-Q8_0.gguf --image-max-tokens 1024
      -c 8192 -b 8192 -ub 8192 -np 1
      -ngl 999
      --port 9997
      --metrics

  # quack's media-reader (image + audio). Shares the 3090 with Clef; no -ngl so --fit spills experts to RAM beside Plex/immich.
  "qwen3-omni-30b":
    proxy: "http://127.0.0.1:9999"
    checkEndpoint: /health
    ttl: 1800
    cmd: >
      /app/llama-server
      -m /root/.cache/huggingface/Qwen3-Omni-30B-A3B-Instruct-Q4_K_M.gguf
      --mmproj /root/.cache/huggingface/mmproj-Qwen3-Omni-30B-A3B-Instruct-bf16.gguf
      --jinja --reasoning-format deepseek --reasoning-budget 512
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0 --presence-penalty 1.5
      -fa on --cache-type-k q8_0 --cache-type-v q8_0
      -c 32768 --parallel 1 -ub 2048 -b 2048
      --image-min-tokens 2048 --image-max-tokens 8192
      --port 9999
      --metrics

groups:
  # Clef and Omni don't fit the 3090 together: Omni evicts Clef, and Clef's next call cold-loads (~47 s, past quack's 20 s decision timeout).
  "3090":
    swap: true
    exclusive: false
    members:
      - clef
      - qwen3-omni-30b

# jaison (2x R9700, llm-swap.yaml). Unqualified model IDs resolve here when no
# local model has the name; keep this list in sync with jaison's llm-swap.yaml.
peers:
  jaison:
    proxy: http://192.168.50.202:11436
    timeouts:
      responseHeader: 0   # v252 defaults 60s; non-stream calls >60s to first byte got 502 (killed plan runs)
    models:
      - qwen3-embed
      - qwen3.8-27b
      - glm-5.3-flash
      - ornith-1.5-122b
