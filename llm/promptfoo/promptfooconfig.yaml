# promptfoo config — local Ollama models judged by Claude Sonnet
#
# Run:  npx promptfoo@latest eval -c promptfooconfig.yaml -c tests.yaml
# View: npx promptfoo@latest view
#
# For cloud model calibration (Sonnet/Haiku judged by Prometheus2):
#   npx promptfoo@latest eval -c promptfooconfig.cloud.yaml -c tests.yaml
#
# Assertions are tiered by depth:
#   [baseline]   — fundamental knowledge, should always hit these
#   [proficient] — real understanding, distinguishes good from average
#   [expert]     — deep insight, changes how you think about the problem
#
# Targets: Sonnet ≥90%, Haiku ≥70%.
# Haiku at 70% is the bar — a local model beating Haiku is meaningful signal.
# Note: local Ollama models run on a separate machine; latency reflects that GPU.

evaluateOptions:
  maxConcurrency: 1
  timeoutMs: 600000  # 10 minutes — allows time for cold model loads

providers:
  - id: ollama:chat:qwen35-coder:latest
  - id: ollama:chat:gemma4:31b
  - id: ollama:chat:gemma4-26b:latest

prompts:
  - "{{task}}"

# Judge: Claude Sonnet (requires ANTHROPIC_API_KEY)
defaultTest:
  threshold: 0.66
  options:
    provider: anthropic:claude-sonnet-4-6
    rubricPrompt: |
      You are grading a technical response against a specific criterion.

      Criterion:
      {{rubric}}

      Response to grade:
      {{output}}

      Think through this step by step:
      1. What is the criterion specifically asking for?
      2. Does the response address it? Quote the relevant part if yes.
      3. If partial credit is warranted, explain why.

      Then output ONLY a JSON object on the last line:
      {"pass": true/false, "score": 0.0, "reason": "one sentence"}

      Score guide: 1.0 = fully satisfies criterion, 0.5 = partially, 0.0 = not addressed.
