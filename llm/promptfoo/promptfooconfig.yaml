# promptfoo config for comparing models on local Ollama
# Run: npx promptfoo@latest eval
# View: npx promptfoo@latest view
#
# maxConcurrency 1 = one test at a time. Ollama handles VRAM eviction automatically
# when switching between models — no keep_alive needed.
#
# Assertions are tiered by depth:
#   [baseline]   — fundamental knowledge, should always hit these
#   [proficient] — real understanding, distinguishes good from average
#   [expert]     — deep insight, changes how you think about the problem

evaluateOptions:
  maxConcurrency: 1
  timeoutMs: 600000  # 10 minutes — allows time for cold model loads

providers:
  - id: anthropic:claude-sonnet-4-6
  - id: anthropic:claude-haiku-4-5-20251001
  - id: ollama:chat:qwen35-coder:latest
  - id: ollama:chat:gemma4-26b:latest
  - id: ollama:chat:gemma4:31b
  - id: ollama:chat:glm-4.7-flash-coder

prompts:
  - "{{task}}"

# Claude Sonnet judges all assertions.
# Requires ANTHROPIC_API_KEY in the environment.
# To switch to a local Ollama judge, change the provider below.
defaultTest:
  threshold: 0.66
  options:
    provider: anthropic:claude-sonnet-4-6

tests:

  # ── Language / framework choice ───────────────────────────────────────────

  - description: "REST server: Go vs Python vs Kotlin"
    vars:
      task: >
        I need to build a REST API server for a backend service. I'm considering
        Go, Python, and Kotlin. Help me think through this decision.
    assert:
      - type: llm-rubric
        metric: "[baseline] Go concurrency model"
        value: >
          Does it explain Go's goroutine-based concurrency model as relevant to server
          workloads, beyond just saying Go is "fast" or "concurrent"?
      - type: llm-rubric
        metric: "[baseline] Python GIL"
        value: >
          Does it mention Python's GIL and explain what it limits?
      - type: llm-rubric
        metric: "[proficient] GIL nuance — IO vs CPU bound"
        value: >
          Does it distinguish CPU-bound vs IO-bound workloads when discussing the GIL —
          noting that async frameworks (asyncio, uvicorn) largely sidestep it for typical
          IO-bound REST APIs?
      - type: llm-rubric
        metric: "[proficient] Kotlin JVM ecosystem"
        value: >
          Does it explain that choosing Kotlin means choosing the JVM ecosystem — access to
          Spring Boot, mature libraries, and JVM operational tooling — not just a language?
      - type: llm-rubric
        metric: "[proficient] deployment differences"
        value: >
          Does it discuss deployment differences — Go's single static binary vs Python's
          runtime and dependency management vs Kotlin's JVM requirement?
      - type: llm-rubric
        metric: "[expert] cold start and memory footprint"
        value: >
          Does it address cold start time or memory footprint differences — relevant for
          containerized deployments, serverless, or resource-constrained environments?
      - type: llm-rubric
        metric: "[expert] type system depth"
        value: >
          Does it compare the type systems in a meaningful way — Kotlin's null safety and
          sealed classes vs Go's deliberate minimalism — and what that means for the kinds
          of bugs you catch at compile time?

  - description: "Message queue: Kafka vs RabbitMQ vs Redis Streams"
    vars:
      task: >
        I'm adding async messaging to a backend system that currently does everything
        synchronously over HTTP. I'm looking at Kafka, RabbitMQ, and Redis Streams.
        How should I think about choosing between them?
    assert:
      - type: llm-rubric
        metric: "[baseline] log vs delete-on-ack"
        value: >
          Does it explain the fundamental model difference — Kafka retains messages as a
          replayable log while RabbitMQ deletes messages on acknowledgement?
      - type: llm-rubric
        metric: "[baseline] ordering guarantees"
        value: >
          Does it address ordering guarantees in any meaningful way — for example, that
          Kafka guarantees ordering within a partition, or that RabbitMQ does not guarantee
          order when multiple consumers compete for the same queue? Either side counts;
          the point is that ordering behavior differs across these systems and matters for
          certain workloads.
      - type: llm-rubric
        metric: "[proficient] consumer model differences"
        value: >
          Does it explain consumer model differences — Kafka's offset-based consumer groups
          vs RabbitMQ's push-based delivery vs Redis Streams' XREADGROUP?
      - type: llm-rubric
        metric: "[proficient] durability differences"
        value: >
          Does it address durability and persistence — Redis Streams' durability depends on
          Redis persistence config (RDB/AOF), which is often not durable by default?
      - type: llm-rubric
        metric: "[proficient] when Kafka is justified"
        value: >
          Does it explain when Kafka's complexity is justified — multiple independent
          consumers, event sourcing, replay/audit — rather than only saying "Kafka is
          overkill for small systems"?
      - type: llm-rubric
        metric: "[expert] backpressure handling"
        value: >
          Does it discuss how each system handles consumer backpressure — Kafka's growing
          consumer lag, RabbitMQ's memory alarms, Redis' memory limits?
      - type: llm-rubric
        metric: "[expert] schema evolution"
        value: >
          Does it address schema evolution — how you version message formats over time
          (Schema Registry for Kafka, no built-in solution for RabbitMQ or Redis)?

  - description: "Data pipeline: batch vs streaming"
    vars:
      task: >
        I'm designing a data processing pipeline that ingests events from multiple
        sources and produces aggregated reports. I need to decide between a batch
        architecture and a streaming architecture.
    assert:
      - type: llm-rubric
        metric: "[baseline] latency as primary driver"
        value: >
          Does it name specific latency requirements — not just "real-time needs" — as the
          primary factor driving the batch vs streaming decision?
      - type: llm-rubric
        metric: "[baseline] batch simpler for correctness"
        value: >
          Does it explain that batch is simpler to reason about for correctness — fixed
          input, deterministic output, straightforward testing?
      - type: llm-rubric
        metric: "[proficient] streaming state management"
        value: >
          Does it discuss state management as the core operational challenge of streaming —
          checkpointing, state size growth, or recovery after failures?
      - type: llm-rubric
        metric: "[proficient] reprocessing and backfill"
        value: >
          Does it explain that batch pipelines are trivial to re-run when something goes
          wrong, while streaming requires careful offset management for reprocessing?
      - type: llm-rubric
        metric: "[proficient] testing complexity"
        value: >
          Does it address testing differences between batch and streaming — for example,
          that batch pipelines have fixed, deterministic inputs and outputs that are easy
          to test, while streaming introduces time-dependent behavior (event ordering,
          late arrivals, windows) that makes tests harder to write and reproduce? The
          specific mechanism matters more than the terminology.
      - type: llm-rubric
        metric: "[expert] cost model"
        value: >
          Does it discuss the cost model — streaming keeps compute running 24/7, while batch
          can use spot instances, scale to zero between runs, or share compute?
      - type: llm-rubric
        metric: "[expert] hybrid architectures"
        value: >
          Does it address hybrid approaches — using streaming for recent low-latency data
          and batch for historical reprocessing or backfill (lambda/kappa architecture)?

  - description: "Database: PostgreSQL vs MongoDB for a document-heavy app"
    vars:
      task: >
        My application stores semi-structured documents that vary in shape — some have
        nested fields, others are flat, and the schema evolves frequently. I'm deciding
        between PostgreSQL with JSONB and MongoDB.
    assert:
      - type: llm-rubric
        metric: "[baseline] JSONB as viable alternative"
        value: >
          Does it explain that PostgreSQL's JSONB can store and query semi-structured data,
          making it a real alternative rather than dismissing it for document workloads?
      - type: llm-rubric
        metric: "[baseline] transaction support"
        value: >
          Does it mention transaction support differences — PostgreSQL has full ACID
          multi-table transactions, while MongoDB's multi-document transactions are more
          limited and carry performance implications?
      - type: llm-rubric
        metric: "[proficient] query ergonomics"
        value: >
          Does it discuss query ergonomics — MongoDB's query language is designed for nested
          documents, while PostgreSQL's JSONB queries are more verbose and harder to optimize?
      - type: llm-rubric
        metric: "[proficient] stable core schema insight"
        value: >
          Does it point out that most "variable shape" data has a stable core schema — a
          relational table with a JSONB column for the variable parts is often the practical
          answer?
      - type: llm-rubric
        metric: "[expert] indexing differences"
        value: >
          Does it address indexing differences — GIN indexes on JSONB vs MongoDB's native
          document indexing and what that means for query patterns and performance?
      - type: llm-rubric
        metric: "[expert] horizontal scaling"
        value: >
          Does it discuss horizontal scaling — MongoDB was designed for sharding, while
          PostgreSQL's sharding story (Citus, partitioning) is more complex and less native?

  - description: "Auth: JWT vs session tokens"
    vars:
      task: >
        I'm implementing authentication for a web API that will need to scale
        horizontally. I'm choosing between JWTs and server-side session tokens.
        What should I understand before committing?
    assert:
      - type: llm-rubric
        metric: "[baseline] JWT revocation problem"
        value: >
          Does it explain the JWT revocation problem — JWTs cannot be invalidated before
          expiry without a server-side denylist, which partially defeats their stateless
          advantage?
      - type: llm-rubric
        metric: "[baseline] JWTs are not encrypted"
        value: >
          Does it mention that JWTs are not encrypted — the payload is base64-encoded
          and readable by anyone with the token, so sensitive data should not go in claims?
      - type: llm-rubric
        metric: "[proficient] refresh token patterns"
        value: >
          Does it discuss refresh token patterns — short-lived access JWTs paired with
          refresh tokens reintroduce server-side state, partially defeating the stateless
          argument?
      - type: llm-rubric
        metric: "[proficient] token storage tradeoffs"
        value: >
          Does it address where tokens are stored on the client — localStorage is vulnerable
          to XSS, httpOnly cookies need CSRF protection — and how that choice affects security?
      - type: llm-rubric
        metric: "[expert] token size on every request"
        value: >
          Does it discuss JWT size — tokens with claims grow large and are sent on every
          request, impacting latency on mobile or constrained networks?
      - type: llm-rubric
        metric: "[expert] the logout problem"
        value: >
          Does it address what "logout" actually means with JWTs vs sessions — can you
          guarantee that a logged-out user's token stops working immediately?

  # ── Design decisions ──────────────────────────────────────────────────────

  - description: "When to reach for a message queue vs direct HTTP calls"
    vars:
      task: >
        My services currently call each other over HTTP. I'm considering adding a message
        queue. What should I think through before making that change?
    assert:
      - type: llm-rubric
        metric: "[baseline] sync vs async as primary driver"
        value: >
          Does it identify the sync vs async question as the primary driver — does the
          caller need an immediate response? If yes, HTTP is usually the right answer.
      - type: llm-rubric
        metric: "[baseline] operational cost of queue infra"
        value: >
          Does it mention the operational cost of introducing queue infrastructure — another
          system to deploy, monitor, secure, and debug?
      - type: llm-rubric
        metric: "[proficient] failure mode differences"
        value: >
          Does it discuss failure mode differences — HTTP errors are immediate and visible
          (status codes), while queue failures are deferred (dead letter queues, silent drops)?
      - type: llm-rubric
        metric: "[proficient] backpressure as concrete advantage"
        value: >
          Does it explain backpressure or load leveling as a specific, concrete reason to
          use a queue — not vague "decoupling"?
      - type: llm-rubric
        metric: "[proficient] coupling moves to schema"
        value: >
          Does it warn that adding a queue doesn't eliminate coupling — the coupling just
          moves from direct HTTP contracts to the message schema or event contract? Accepts
          any framing that conveys this: "you still have a contract," "schema becomes the
          interface," "producers and consumers must agree on message format," etc. The key
          point is that "decoupling" is often oversold — something still has to agree on
          the shape of the data.
      - type: llm-rubric
        metric: "[expert] idempotency requirements"
        value: >
          Does it address idempotency — queues introduce at-least-once delivery, so
          consumers must handle duplicate messages?
      - type: llm-rubric
        metric: "[expert] hybrid pattern"
        value: >
          Does it suggest the hybrid pattern — HTTP for queries and command acknowledgment,
          queues for async side effects — rather than treating it as all-or-nothing?

  - description: "Monolith vs microservices for a new product"
    vars:
      task: >
        I'm starting a new backend product with a team of four engineers. I need to
        decide between starting with a monolith or microservices. What are the real
        costs and failure modes of each approach, including common mistakes teams make
        when they do choose microservices?
    assert:
      - type: llm-rubric
        metric: "[baseline] small team favors monolith"
        value: >
          Does it state that a small team should almost certainly start with a monolith,
          with reasoning beyond just "it's simpler"?
      - type: llm-rubric
        metric: "[baseline] microservice operational costs"
        value: >
          Does it list specific operational costs of microservices — distributed tracing,
          service discovery, per-service deployment pipelines, cross-service debugging?
      - type: llm-rubric
        metric: "[proficient] Conway's Law"
        value: >
          Does it discuss Conway's Law or organizational structure — that service boundaries
          which don't match team boundaries create ongoing friction?
      - type: llm-rubric
        metric: "[proficient] modular monolith"
        value: >
          Does it introduce the modular monolith as a middle path — clear internal module
          boundaries that can be extracted into services later when team size and scale
          justify it?
      - type: llm-rubric
        metric: "[expert] shared database anti-pattern"
        value: >
          Does it identify the shared database anti-pattern — microservices sharing a
          database get the worst of both worlds, coupling at the data layer?
      - type: llm-rubric
        metric: "[expert] cost asymmetry"
        value: >
          Does it address the cost asymmetry — extracting a service from a well-structured
          monolith is much easier than merging microservices back into one?

  - description: "When to write an abstraction vs inline the code"
    vars:
      task: >
        I keep going back and forth on when to extract an abstraction vs just duplicating
        a bit of logic. What's a good mental model for making that call?
    assert:
      - type: llm-rubric
        metric: "[baseline] concrete heuristic"
        value: >
          Does it give a concrete heuristic for when to abstract — rule of three, "wait
          until you see the pattern," or only when callers don't need to know the internals?
      - type: llm-rubric
        metric: "[baseline] premature abstraction cost"
        value: >
          Does it explain the specific cost of premature abstraction — wrong interface locks
          you in, harder to change when requirements for the abstracted cases diverge?
      - type: llm-rubric
        metric: "[proficient] wrong abstraction worse than duplication"
        value: >
          Does it state that the wrong abstraction is worse than duplication — prefer
          duplicating until the right abstraction becomes clear?
      - type: llm-rubric
        metric: "[proficient] signs of abstracting too late"
        value: >
          Does it name concrete signs of waiting too long — identical bug fixes applied in
          multiple places, or changes that require updating N copies in lockstep?
      - type: llm-rubric
        metric: "[expert] deduplication vs abstraction"
        value: >
          Does it distinguish between deduplication (mechanically removing repeated code)
          and genuine abstraction (creating a concept boundary that hides internals)?
      - type: llm-rubric
        metric: "[expert] domain-named abstractions"
        value: >
          Does it discuss how the right abstraction often has a domain name — it represents
          a real concept, not just "shared code"?

  # ── LLM / prompt engineering (relevant to document-pipeline work) ─────────

  - description: "Structured output: JSON vs XML vs custom delimiters"
    vars:
      task: >
        I'm building a pipeline where an LLM extracts structured data from unstructured
        text. I need to choose an output format — JSON, XML, or custom delimiters.
        How should I decide?
    assert:
      - type: llm-rubric
        metric: "[baseline] JSON failure modes"
        value: >
          Does it identify at least one specific LLM failure mode for JSON — unclosed
          brackets, invalid string escaping, or trailing commas?
      - type: llm-rubric
        metric: "[baseline] custom delimiters need custom parsers"
        value: >
          Does it note that custom delimiters require custom parsing logic, which is
          another source of bugs and maintenance burden?
      - type: llm-rubric
        metric: "[proficient] XML verbosity tradeoff"
        value: >
          Does it discuss XML's verbosity as a double-edged sword — explicit closing tags
          aid recovery from partial output but cost more tokens?
      - type: llm-rubric
        metric: "[proficient] constrained decoding"
        value: >
          Does it mention constrained decoding, guided generation, or provider-specific
          JSON mode as a way to guarantee valid structured output, changing the format
          reliability question entirely?
      - type: llm-rubric
        metric: "[expert] output complexity matters"
        value: >
          Does it address that the right choice depends on output complexity — flat
          key-value structures vs deeply nested documents have different failure profiles?
      - type: llm-rubric
        metric: "[expert] semantic validation"
        value: >
          Does it distinguish syntactic validity (well-formed JSON/XML) from semantic
          validity (correct content in the right fields) — and note that format choice
          doesn't solve the harder semantic problem?

  - description: "When does chain-of-thought actually help"
    vars:
      task: >
        I'm deciding whether to add chain-of-thought prompting to various steps in my
        LLM pipeline. When does asking a model to reason step-by-step actually improve
        results, and when doesn't it?
    assert:
      - type: llm-rubric
        metric: "[baseline] task type distinction"
        value: >
          Does it distinguish task types where CoT helps — multi-step reasoning, math,
          logic — from tasks where it doesn't — factual recall, simple classification?
      - type: llm-rubric
        metric: "[baseline] latency and cost tradeoffs"
        value: >
          Does it address latency and token cost as concrete engineering tradeoffs of
          using CoT, not just theoretical considerations?
      - type: llm-rubric
        metric: "[proficient] CoT can introduce errors"
        value: >
          Does it explain that CoT can hurt on simple tasks — the reasoning chain creates
          more opportunities for the model to talk itself into a wrong answer?
      - type: llm-rubric
        metric: "[proficient] concrete example where CoT hurts"
        value: >
          Does it give a concrete example of a task type where forcing CoT produces worse
          results — not just "simple tasks" but a specific case like sentiment classification
          or entity extraction?
      - type: llm-rubric
        metric: "[expert] zero-shot vs few-shot CoT"
        value: >
          Does it distinguish zero-shot CoT ("think step by step") from few-shot CoT
          (providing worked examples) and note they have different effectiveness profiles?
      - type: llm-rubric
        metric: "[expert] model-size dependence"
        value: >
          Does it address model-size dependence — CoT is most effective on larger models
          and can degrade performance on smaller ones?

  - description: "Single large prompt vs chaining smaller prompts"
    vars:
      task: >
        I'm building a document processing pipeline with multiple steps — extraction,
        classification, and summarization. I need to decide whether to handle everything
        in one prompt or chain separate prompts for each step.
    assert:
      - type: llm-rubric
        metric: "[baseline] error propagation in chains"
        value: >
          Does it explain the error propagation risk in chains — that a semantically wrong
          output from an early step (not just a format/parse error, but plausible-looking
          bad content) flows silently into later steps, corrupting results in ways that
          are hard to detect? Note: saying chaining is better because you can catch errors
          between steps is the *opposite* point — that describes the observability advantage,
          not this risk.
      - type: llm-rubric
        metric: "[baseline] observability advantage of chaining"
        value: >
          Does it identify observability as a chaining advantage — intermediate outputs are
          inspectable and failures are easier to isolate and debug?
      - type: llm-rubric
        metric: "[proficient] latency — sequential round trips"
        value: >
          Does it address latency — chaining adds sequential round trips, while a single
          prompt completes in one call?
      - type: llm-rubric
        metric: "[proficient] cost optimization with different models"
        value: >
          Does it discuss cost optimization — chaining lets you use different models for
          different steps (cheap fast model for extraction, expensive model for reasoning)?
      - type: llm-rubric
        metric: "[proficient] prompt coupling in single prompts"
        value: >
          Does it explain prompt coupling — in a single prompt, all instructions interact
          and adding a new step can break existing behavior?
      - type: llm-rubric
        metric: "[expert] interface design between chain steps"
        value: >
          Does it address the interface contract problem between chain steps — that each
          step's output becomes the next step's input, and mismatches (wrong field names,
          missing keys, unexpected types) tend to fail silently rather than loudly? Accepts
          any framing around step contracts, output schemas, or the difficulty of catching
          structural mismatches between steps.
      - type: llm-rubric
        metric: "[expert] evaluation difficulty"
        value: >
          Does it discuss evaluation — testing a single prompt is straightforward, while
          testing a chain requires integration tests across step boundaries?

  # ── Bug finding / code analysis ───────────────────────────────────────────

  - description: "Go: find all bugs in a concurrent fetch"
    vars:
      task: |
        Find all the bugs in this Go code. Assume Go 1.21. Don't stop at the first
        one — be exhaustive.

        ```go
        func fetchAll(urls []string) []string {
            results := make([]string, len(urls))
            var wg sync.WaitGroup
            for i, url := range urls {
                wg.Add(1)
                go func() {
                    defer wg.Done()
                    resp, err := http.Get(url)
                    if err != nil {
                        return
                    }
                    body, _ := io.ReadAll(resp.Body)
                    results[i] = string(body)
                }()
            }
            wg.Wait()
            return results
        }
        ```
    assert:
      - type: llm-rubric
        metric: "[baseline] loop variable capture"
        value: >
          Does it identify the loop variable capture bug — in Go 1.21, i and url are shared
          across goroutines, so all goroutines may read the last loop values? Does it explain
          why this causes incorrect results, not just name the issue?
      - type: llm-rubric
        metric: "[baseline] resp.Body never closed"
        value: >
          Does it identify that resp.Body is never closed — a resource leak (file descriptor
          and memory) on every successful request? Does it explain why, not just flag it?
      - type: llm-rubric
        metric: "[proficient] io.ReadAll error ignored"
        value: >
          Does it identify that the io.ReadAll error is silently discarded with _ — the
          function may return partial or empty results without any indication of failure?
      - type: llm-rubric
        metric: "[expert] no timeout or context"
        value: >
          Does it identify that http.Get has no timeout or context — goroutines can hang
          indefinitely on slow or unresponsive servers, and there is no way for the caller
          to cancel in-flight requests?

  - description: "Kotlin: find all bugs in a coroutine snippet"
    vars:
      task: |
        Find all the bugs in this Kotlin code. Consider both correctness and coroutine
        lifecycle issues.

        ```kotlin
        class UserService(private val repo: UserRepository) {
            private val scope = CoroutineScope(Dispatchers.IO)

            fun getUser(id: String): UserProfile {
                var result: UserProfile? = null
                scope.launch {
                    result = repo.findById(id)
                }
                Thread.sleep(1000)
                return result!!
            }

            fun shutdown() {
                scope.cancel()
            }
        }
        ```
    assert:
      - type: llm-rubric
        metric: "[baseline] race condition and NPE"
        value: >
          Does it identify the race between Thread.sleep and the coroutine — the coroutine
          may not complete within 1000ms, and result!! will throw NullPointerException?
          Does it explain the mechanism, not just say "it might be null"?
      - type: llm-rubric
        metric: "[baseline] blocking function should be suspend"
        value: >
          Does it identify that getUser is a blocking function pretending to be async — it
          should be a suspend function or return a Deferred, not use Thread.sleep to wait?
      - type: llm-rubric
        metric: "[proficient] shared mutable variable visibility"
        value: >
          Does it identify that result is a shared mutable variable between the coroutine
          (Dispatchers.IO thread pool) and the calling thread, with no visibility guarantee
          under the JVM memory model?
      - type: llm-rubric
        metric: "[proficient] unscoped lifecycle"
        value: >
          Does it identify that scope has no lifecycle management — it leaks if shutdown()
          is never called, and the caller has no way to know shutdown() is required?
      - type: llm-rubric
        metric: "[expert] silent coroutine failure"
        value: >
          Does it identify that if repo.findById throws an exception, the coroutine fails
          silently — result stays null, and the caller gets an NPE with no indication of
          the actual error?

  - description: "TypeScript: find all type and runtime bugs"
    vars:
      task: |
        Find all the bugs in this TypeScript — both type-level and runtime. Include
        places where the types look safe but aren't.

        ```typescript
        async function processEvents(events: unknown[]): Promise<void> {
          const results = await Promise.all(
            events.map(async (event) => {
              const e = event as { type: string; userId: string };
              if (e.type === "delete") {
                await deleteUser(e.userId);
              }
              return e.userId;
            })
          );
          console.log(`Processed ${results.length} events`);
        }
        ```
    assert:
      - type: llm-rubric
        metric: "[baseline] unsafe cast"
        value: >
          Does it identify that `as { type: string; userId: string }` is an unsafe cast —
          there is no runtime validation, so any value (null, number, wrong-shaped object)
          passes through the type system unchecked?
      - type: llm-rubric
        metric: "[baseline] Promise.all fails fast"
        value: >
          Does it identify that Promise.all fails fast — if one deleteUser call rejects,
          the remaining promises are abandoned and the error propagates with no cleanup?
      - type: llm-rubric
        metric: "[proficient] no error handling on deleteUser"
        value: >
          Does it identify that there is no error handling on deleteUser — if it throws,
          the entire function rejects and any remaining delete operations are abandoned
          mid-batch?
      - type: llm-rubric
        metric: "[proficient] no input validation"
        value: >
          Does it identify that there is no validation of individual events — nulls,
          primitives, or objects with unexpected shapes all silently pass the type assertion
          and may cause runtime errors downstream?
      - type: llm-rubric
        metric: "[expert] results contain untrusted data"
        value: >
          Does it identify that the results array accumulates e.userId for all events
          including non-delete ones, which may be undefined at runtime despite the type
          claiming string — downstream consumers of this array would trust invalid data?
