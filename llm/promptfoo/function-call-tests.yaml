# Berkeley Function Calling Leaderboard (BFCL) — simple subset
# Source: https://huggingface.co/datasets/gorilla-llm/Berkeley-Function-Calling-Leaderboard
# Entries: simple_0 through simple_5
#
# The model is given a function schema and a user request.
# It must call the right function with the right arguments.
# Assertions check function name and required argument values.

- description: "BFCL simple_0: calculate_triangle_area"
  vars:
    task: |
      You have access to this function:
      {"name": "calculate_triangle_area", "description": "Calculate the area of a triangle given its base and height.", "parameters": {"type": "object", "properties": {"base": {"type": "integer"}, "height": {"type": "integer"}, "unit": {"type": "string"}}, "required": ["base", "height"]}}

      User: Find the area of a triangle with a base of 10 units and height of 5 units.

      Respond with the function call you would make in JSON:
      {"name": "<function_name>", "arguments": {<args>}}
  assert:
    - type: javascript
      value: output.includes('calculate_triangle_area')
      metric: "[baseline] calls correct function"
    - type: javascript
      value: 'output.includes(''"base"'') && (output.includes(''"base": 10'') || output.includes(''"base":10''))'
      metric: "[baseline] base=10"
    - type: javascript
      value: 'output.includes(''"height"'') && (output.includes(''"height": 5'') || output.includes(''"height":5''))'
      metric: "[baseline] height=5"

- description: "BFCL simple_1: math.factorial"
  vars:
    task: |
      You have access to this function:
      {"name": "math.factorial", "description": "Calculate the factorial of a given number.", "parameters": {"type": "object", "properties": {"number": {"type": "integer"}}, "required": ["number"]}}

      User: Calculate the factorial of 5 using math functions.

      Respond with the function call you would make in JSON:
      {"name": "<function_name>", "arguments": {<args>}}
  assert:
    - type: javascript
      value: output.includes('factorial')
      metric: "[baseline] calls factorial function"
    - type: javascript
      value: 'output.includes(''"number"'') && (output.includes(''"number": 5'') || output.includes(''"number":5''))'
      metric: "[baseline] number=5"

- description: "BFCL simple_2: math.hypot"
  vars:
    task: |
      You have access to this function:
      {"name": "math.hypot", "description": "Calculate the Euclidean norm — the hypotenuse of a right triangle.", "parameters": {"type": "object", "properties": {"x": {"type": "integer"}, "y": {"type": "integer"}, "z": {"type": "integer"}}, "required": ["x", "y"]}}

      User: Calculate the hypotenuse of a right triangle given the lengths of the other two sides as 4 and 5.

      Respond with the function call you would make in JSON:
      {"name": "<function_name>", "arguments": {<args>}}
  assert:
    - type: javascript
      value: output.includes('hypot')
      metric: "[baseline] calls hypot function"
    - type: llm-rubric
      metric: "[proficient] correct arguments for sides 4 and 5"
      value: >
        Score 3: Calls math.hypot with both x and y arguments populated
        Score 4: Also uses values 4 and 5 (order doesn't matter — hypot is symmetric)
        Score 5: Also does not include z (it's optional and the problem doesn't mention a z-axis)

- description: "BFCL simple_3: quadratic_roots a=1, b=-3, c=2"
  vars:
    task: |
      You have access to this function:
      {"name": "algebra.quadratic_roots", "description": "Find the roots of a quadratic equation ax^2 + bx + c = 0.", "parameters": {"type": "object", "properties": {"a": {"type": "integer"}, "b": {"type": "integer"}, "c": {"type": "integer"}}, "required": ["a", "b", "c"]}}

      User: Find the roots of a quadratic equation with coefficients a=1, b=-3, c=2.

      Respond with the function call you would make in JSON:
      {"name": "<function_name>", "arguments": {<args>}}
  assert:
    - type: javascript
      value: output.includes('quadratic')
      metric: "[baseline] calls quadratic function"
    - type: javascript
      value: '(output.includes(''"a": 1'') || output.includes(''"a":1'')) && (output.includes(''"b": -3'') || output.includes(''"b":-3'')) && (output.includes(''"c": 2'') || output.includes(''"c":2''))'
      metric: "[baseline] correct coefficients a=1, b=-3, c=2"

- description: "BFCL simple_4: solve_quadratic a=2, b=6, c=5"
  vars:
    task: |
      You have access to this function:
      {"name": "solve_quadratic_equation", "description": "Solve the quadratic equation and return its roots.", "parameters": {"type": "object", "properties": {"a": {"type": "integer"}, "b": {"type": "integer"}, "c": {"type": "integer"}}, "required": ["a", "b", "c"]}}

      User: Solve a quadratic equation where a=2, b=6, and c=5.

      Respond with the function call you would make in JSON:
      {"name": "<function_name>", "arguments": {<args>}}
  assert:
    - type: javascript
      value: output.includes('solve_quadratic')
      metric: "[baseline] calls correct function"
    - type: javascript
      value: '(output.includes(''"a": 2'') || output.includes(''"a":2'')) && (output.includes(''"b": 6'') || output.includes(''"b":6'')) && (output.includes(''"c": 5'') || output.includes(''"c":5''))'
      metric: "[baseline] correct coefficients a=2, b=6, c=5"

- description: "BFCL simple_5: solve_quadratic a=3, b=-11, c=-4"
  vars:
    task: |
      You have access to this function:
      {"name": "solve_quadratic", "description": "Solve a quadratic equation. Optional root_type parameter: 'real' for real roots only (default), 'all' for real and complex.", "parameters": {"type": "object", "properties": {"a": {"type": "integer"}, "b": {"type": "integer"}, "c": {"type": "integer"}, "root_type": {"type": "string"}}, "required": ["a", "b", "c"]}}

      User: Find all the roots of a quadratic equation given coefficients a=3, b=-11, and c=-4.

      Respond with the function call you would make in JSON:
      {"name": "<function_name>", "arguments": {<args>}}
  assert:
    - type: javascript
      value: output.includes('solve_quadratic')
      metric: "[baseline] calls correct function"
    - type: javascript
      value: '(output.includes(''"a": 3'') || output.includes(''"a":3'')) && (output.includes(''"b": -11'') || output.includes(''"b":-11'')) && (output.includes(''"c": -4'') || output.includes(''"c":-4''))'
      metric: "[baseline] correct coefficients"
    - type: llm-rubric
      metric: "[proficient] uses root_type=all for 'find all roots'"
      value: >
        Score 3: Calls solve_quadratic with the correct a, b, c values
        Score 4: Also includes root_type because the user said "find all the roots"
        Score 5: Sets root_type to "all" specifically (not "real") since user wants all roots

# ── Structured output + tool routing ───────────────────────────────────────
# ── Structured output and tool use (scripted assertions — no LLM judge) ───
#
# These tests use is-json and javascript assertions for deterministic
# pass/fail validation. The LLM judge is not involved.

- description: "JSON: extract structured data from prose"
  vars:
    task: |
      Extract the following information as a JSON object with exactly these fields:
        name    (string)
        age     (integer — not a string)
        role    (string)
        city    (string)
      Return ONLY the JSON object — no markdown fences, no explanation.

      "Sarah Chen is a 28-year-old DevOps engineer based in Austin, Texas."
  assert:
    - type: is-json
      metric: "[baseline] syntactically valid JSON"
    - type: javascript
      metric: "[baseline] correct field values and types"
      value: |
        const d = JSON.parse(output);
        if (d.name !== 'Sarah Chen')
          return { pass: false, score: 0, reason: 'wrong name: ' + d.name };
        if (d.age !== 28)
          return { pass: false, score: 0, reason: 'age should be integer 28, got: ' + JSON.stringify(d.age) };
        if (typeof d.role !== 'string' || !d.role.trim())
          return { pass: false, score: 0, reason: 'missing or empty role' };
        if (typeof d.city !== 'string' || !d.city.trim())
          return { pass: false, score: 0, reason: 'missing or empty city' };
        return true;

- description: "JSON: generate object satisfying a TypeScript interface"
  vars:
    task: |
      Generate a valid JSON object that satisfies this TypeScript interface.
      Return ONLY the JSON — no markdown fences, no explanation.

      interface ServiceConfig {
        name: string;           // non-empty
        port: number;           // valid port: 1–65535
        replicas: number;       // at least 1
        environment: "production" | "staging" | "development";
        tags: string[];         // at least one entry
      }
  assert:
    - type: is-json
      metric: "[baseline] syntactically valid JSON"
    - type: javascript
      metric: "[baseline] satisfies interface constraints"
      value: |
        const d = JSON.parse(output);
        if (typeof d.name !== 'string' || !d.name)
          return { pass: false, score: 0, reason: 'name must be non-empty string' };
        if (typeof d.port !== 'number' || d.port < 1 || d.port > 65535)
          return { pass: false, score: 0, reason: 'port out of valid range: ' + d.port };
        if (typeof d.replicas !== 'number' || d.replicas < 1)
          return { pass: false, score: 0, reason: 'replicas must be >= 1' };
        if (!['production', 'staging', 'development'].includes(d.environment))
          return { pass: false, score: 0, reason: 'invalid environment: ' + d.environment };
        if (!Array.isArray(d.tags) || d.tags.length === 0)
          return { pass: false, score: 0, reason: 'tags must be a non-empty array' };
        return true;

- description: "Tool use: select the right tool and format the call as JSON"
  vars:
    task: |
      You have three tools available:
        search_web(query: string)        — search the internet for current information
        query_db(sql: string)            — run a read-only SQL query on the local DB
        send_alert(message: string)      — page the on-call engineer

      User request: "What is the current weather in Tokyo?"

      Respond with a single JSON tool call:
        {"tool": "<name>", "params": {<args>}}
      Return ONLY the JSON — no markdown, no explanation.
  assert:
    - type: is-json
      metric: "[baseline] syntactically valid JSON tool call"
    - type: javascript
      metric: "[baseline] correct tool selected with required params"
      value: |
        const call = JSON.parse(output);
        if (call.tool !== 'search_web')
          return { pass: false, score: 0, reason: 'should call search_web for current weather, got: ' + call.tool };
        if (typeof call.params?.query !== 'string' || !call.params.query.trim())
          return { pass: false, score: 0, reason: 'params.query must be a non-empty string' };
        return true;

- description: "Tool use: pick between two plausible tools"
  vars:
    task: |
      You are an assistant with access to an internal analytics database.
      You have three tools available:
        search_web(query: string)        — search the internet for current information
        query_db(sql: string)            — run a read-only SQL query on the internal analytics DB
        send_alert(message: string)      — page the on-call engineer

      User request: "How many users signed up in the last 7 days?"
      (User signups are tracked in the internal DB, not on the web.)

      Respond with a single JSON tool call:
        {"tool": "<name>", "params": {<args>}}
      Return ONLY the JSON — no markdown, no explanation.
  assert:
    - type: is-json
      metric: "[baseline] syntactically valid JSON tool call"
    - type: javascript
      metric: "[baseline] query_db selected with SQL param"
      value: |
        const call = JSON.parse(output);
        if (call.tool !== 'query_db')
          return { pass: false, score: 0, reason: 'signups data is in the local DB — should call query_db, got: ' + call.tool };
        if (typeof call.params?.sql !== 'string' || !call.params.sql.trim())
          return { pass: false, score: 0, reason: 'params.sql must be a non-empty string' };
        return true;

- description: "YAML: generate a valid Docker Compose service definition"
  vars:
    task: |
      Generate a Docker Compose v3 services block for a PostgreSQL 15 database.
      Requirements:
        - service name: db
        - image: postgres:15
        - host port 5432 mapped to container port 5432
        - environment variable POSTGRES_DB set to myapp
        - named volume pgdata mounted at /var/lib/postgresql/data
      Return ONLY the YAML starting with "services:" — no markdown fences.
  assert:
    - type: javascript
      metric: "[baseline] required components present"
      value: |
        // Strip markdown code fences if present
        const yaml = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
        if (!yaml.startsWith('services:'))
          return { pass: false, score: 0, reason: 'output must start with "services:" (got: ' + yaml.slice(0, 40) + ')' };
        if (!yaml.includes('postgres:15'))
          return { pass: false, score: 0, reason: 'missing postgres:15 image' };
        if (!yaml.includes('5432'))
          return { pass: false, score: 0, reason: 'missing port 5432' };
        if (!yaml.includes('POSTGRES_DB') || !yaml.includes('myapp'))
          return { pass: false, score: 0, reason: 'missing POSTGRES_DB=myapp env var' };
        if (!yaml.includes('pgdata'))
          return { pass: false, score: 0, reason: 'missing pgdata volume reference' };
        return true;
    - type: javascript
      metric: "[proficient] parseable YAML with correct structure"
      value: |
        // Strip markdown code fences if present
        const raw = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
        try {
          if (typeof require === 'undefined') throw Object.assign(new Error('no require'), { code: 'MODULE_NOT_FOUND' });
          const yaml = require('yaml');
          const doc = yaml.parse(raw);
          const db = doc?.services?.db;
          if (!db) return { pass: false, score: 0, reason: 'services.db not found in parsed YAML' };
          if (!db.image?.startsWith('postgres:')) return { pass: false, score: 0, reason: 'wrong image: ' + db.image };
          return true;
        } catch (e) {
          if (e.code === 'MODULE_NOT_FOUND') {
            if (!raw.match(/^\s+db:/m)) return { pass: false, score: 0, reason: 'services.db key not found' };
            if (!raw.match(/image:\s*postgres:15/)) return { pass: false, score: 0, reason: 'missing postgres:15 image' };
            return true;
          }
          return { pass: false, score: 0, reason: 'YAML parse error: ' + e.message };
        }
