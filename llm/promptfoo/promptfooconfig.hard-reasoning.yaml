# Hard reasoning — GPQA-style science MCQ + ZebraLogic-style puzzles
# Run: ./eval.sh --suite hard-reasoning [model]
evaluateOptions:
  timeoutMs: 600000
providers:
  - id: "openai:chat:{{ env.MODEL }}"
    config:
      apiBaseUrl: http://jason-server:11436/v1
      apiKey: llm-swap
prompts:
  - "{{task}}"
tests: hard-reasoning-tests.yaml
defaultTest:
  threshold: 0.8
  options:
    provider:
      id: openai:chat:selene
      config:
        apiBaseUrl: http://jason-server:11437/v1
        apiKey: llm-judge
    transform: "output.replace(/^(Thinking:|<think>)[\\s\\S]*?(<\\/think>|\\n\\n)/i, '').trim()"
    rubricPrompt: |
      You are grading a reasoning response. Use the rubric strictly.
      Output ONLY a JSON object on the last line — nothing after it.

      Rubric:
      {{rubric}}

      Prompt:
      {{prompt}}

      Response:
      {{output}}

      Output ONLY this JSON:
      {"pass": true/false, "score": <score (1-5) you gave that answer>, "reason": "<one sentance explaining why you gave that score>"}
