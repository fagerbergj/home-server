# GSM8K math word problems
# Run: ./eval.sh --math [model]
providers:
  - id: "openai:chat:{{ env.MODEL }}"
    config:
      apiBaseUrl: http://jason-server:11436/v1
      apiKey: llm-swap
      max_tokens: 8192
prompts:
  - "{{task}}"
tests: ../test-suites/math.yaml
defaultTest:
  threshold: 4
  options:
    transform: "output.replace(/^(Thinking:|<think>)[\\s\\S]*?(<\\/think>|\\n\\n)/i, '').trim()"
