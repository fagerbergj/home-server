# Backend systems knowledge — 32 tests
# Run: ./eval.sh --suite knowledge [model]
providers:
  - id: "openai:chat:{{ env.MODEL }}"
    config:
      apiBaseUrl: http://jason-server:11436/v1
      apiKey: llm-swap
      max_tokens: 8192
prompts:
  - "{{task}}"
tests: ../test-suites/architecture.yaml
defaultTest:
  threshold: 4
  options:
    provider:
      id: openai:chat:selene
      config:
        apiBaseUrl: http://jason-server:11436/v1
        apiKey: llm-swap
    transform: "output.replace(/^(Thinking:|<think>)[\\s\\S]*?(<\\/think>|\\n\\n)/i, '').trim()"
    rubricPrompt: |
      You are grading a technical response. Use the rubric to assess quality,
      then output ONLY a JSON object on the last line — nothing after it.

      Rubric:
      {{rubric}}

      Prompt given to the model:
      {{prompt}}

      Response to grade:
      {{output}}

      Then output ONLY this JSON (no trailing text):
      {"pass": true/false, "score": <integer 1-5 from rubric>, "reason": "<one sentence explaining why you gave that score>"}
