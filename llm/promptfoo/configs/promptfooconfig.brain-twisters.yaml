# Brain twisters — arxiv.org/abs/2405.19616 "Easy Problems That LLMs Get Wrong"
# Run: ./eval.sh --suite brain-twisters [model]
providers:
  - id: "openai:chat:{{ env.MODEL }}"
    config:
      apiBaseUrl: http://jason-server:11436/v1
      apiKey: llm-swap
      max_tokens: 16384
      omitDefaults: true     # defer sampling to llm-swap per-model --temp (no forced temp 0)
      showThinking: false    # grade the answer, not the model's prepended reasoning
prompts:
  - "{{task}}"
tests: ../test-suites/brain-twisters.yaml
defaultTest:
  options:
    factuality:
      differButFactual: 0
    provider:
      id: openai:chat:selene
      config:
        apiBaseUrl: http://jason-server:11436/v1
        apiKey: llm-swap
    transform: "output.replace(/^(Thinking:|<think>)[\\s\\S]*?(<\\/think>|\\n\\n)/i, '').trim()"
