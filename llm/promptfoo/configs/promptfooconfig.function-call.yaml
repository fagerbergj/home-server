# BFCL function calling tests
# Run: ./eval.sh --function-call [model]
# Best models: llama-3.3-70b, qwen3.6-35b
providers:
  - id: "openai:chat:{{ env.MODEL }}"
    config:
      apiBaseUrl: http://jason-server:11436/v1
      apiKey: llm-swap
      max_tokens: 8192
prompts:
  - "{{task}}"
tests: ../test-suites/function-call.yaml
defaultTest:
  threshold: 4
  options:
    provider:
      id: openai:chat:selene
      config:
        apiBaseUrl: http://jason-server:11436/v1
        apiKey: llm-swap
    transform: "output.replace(/^(Thinking:|<think>)[\\s\\S]*?(<\\/think>|\\n\\n)/i, '').trim()"
    rubricPrompt: |
      You are grading a function call response against the rubric below.

      Rubric:
      {{rubric}}

      Prompt given to the model:
      {{prompt}}

      Response to grade:
      {{output}}

      Reason step by step before scoring. The rubric levels are cumulative, so
      starting from the lowest, state for each level whether the response meets
      its criteria, citing the specific part of the response that does (or what
      is missing). The score is the highest level whose criteria are fully met.

      Then, on the LAST line only, output this JSON with nothing after it:
      {"pass": true/false, "score": <integer 1-5 from rubric>, "reason": "<one sentence naming the deciding factor>"}
