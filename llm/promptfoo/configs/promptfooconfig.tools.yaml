# promptfoo config — tool-call reasoning tests for document-pipeline ADK tools.
#
# Uses real OpenAI-style tool calling (config.tools) so the model exercises the
# same code path as production. Requires `--jinja` on each llama-server cmd in
# llm-swap.yaml (otherwise llama.cpp silently ignores the `tools` parameter and
# returns plain text). Tool definitions below are the same descriptions
# registered in ~/workspace/document-pipeline/server/core/adk/tools/*.go — keep
# in sync if the production registrations change.
#
# Grading: deterministic via tools-grader.js. promptfoo surfaces tool calls as
# the assertion's `output` directly when content is empty (array of
# {id, type:"function", function:{name, arguments:"<json>"}}).

evaluateOptions:
  timeoutMs: 600000

providers:
  - id: "openai:chat:{{ env.MODEL }}"
    config:
      apiBaseUrl: http://jason-server:11436/v1
      apiKey: llm-swap
      # temperature: promptfoo defaults to 0 which makes Llama 3.3 emit raw
      # JSON instead of <|python_tag|>-prefixed tool calls — llama.cpp's
      # parser then returns 500. A small non-zero temp restores the native
      # token preference.
      temperature: 0.2
      # tool_choice: auto — the "no_empty_search" / "no_retry_after_reject" /
      # "no_empty_get" tests EXPECT the model to NOT call a tool. With
      # `required` the model would be forced to invent a call.
      tool_choice: auto
      tools:
        - type: function
          function:
            name: search_documents
            description: |
              Lucene search for specific documents by title, tag, content, date, or series.
              Returns lean summaries (id, title, tags, date) — call get_document on a result's id
              to fetch its full text.
              Use whenever the user names a specific document, date, tag, or series, or whenever
              your query has a colon (`title:foo`, `tags:invoice`, `series:notebooks`,
              `date_month:2026-05`, `stage:done`). Bare words search full text; combine with
              AND / OR.
              IMPORTANT: quote multi-word field values, otherwise Lucene splits on the space
              and only matches the first word.
              Correct: `series:"Secret Campaign"`, `title:"may 16"`.
              Wrong: `series:Secret Campaign` (parses as series:Secret AND Campaign).
              For fuzzy or cross-doc topical questions use rag_search instead.
              Never call with an empty query.
            parameters:
              type: object
              properties:
                query: { type: string }
              required: [query]

        - type: function
          function:
            name: get_document
            description: |
              Fetch the full polished text (clarified_text) of a specific document by its UUID.
              Use after search_documents returns a candidate id, or when the user references a doc
              by an id you already have. Also returns the doc's summary, tags, and date.
              Never call with an empty id — run search_documents first to find one.
            parameters:
              type: object
              properties:
                id: { type: string }
              required: [id]

        - type: function
          function:
            name: rag_search
            description: |
              Semantic search across the personal knowledge base.
              Use for fuzzy / topical questions like "what's been said about X?" or when
              you need passages from many docs.
              Query must be PLAIN WORDS — no field:value syntax.
              If your query contains a colon (e.g. `series:foo`, `tags:bar`), use
              search_documents instead — this tool will match the colon literally and return junk.
              Never call with an empty query.
            parameters:
              type: object
              properties:
                query: { type: string }
              required: [query]

        - type: function
          function:
            name: update_document
            description: |
              Propose an edit to a specific stage output of a document. Requires user approval
              before applying — the runtime will pause and show the user a confirmation card with the
              before/after diff. The user may edit your proposed content before approving.

              Allowed `field` values:
                - raw_text          (transcribe/ocr output)
                - narrative_summary (summarize output)
                - clarified_text    (clarify output)
                - summary           (classify output — not the narrative one)

              After approval, downstream stages (including embed) automatically re-run, so the corrected
              text propagates through the pipeline.

              Status semantics:
                - pending  → user is deciding; you will see this only briefly
                - applied  → the edit was written and downstream stages requeued
                - rejected → user declined; do NOT immediately retry the same edit; ask the user what they want instead

              Errors: the stage must be in 'done' status. If the stage is still running/waiting/error,
              the tool returns an error — tell the user to wait and try again.
            parameters:
              type: object
              properties:
                id:      { type: string }
                field:   { type: string, enum: [raw_text, narrative_summary, clarified_text, summary] }
                content: { type: string }
              required: [id, field, content]

prompts:
  # Send the scenario as the bare user message. Llama 3.3's chat template
  # (activated by --jinja) injects tool-call instructions automatically;
  # adding our own 'decide whether to call a tool' wording confuses the
  # model into emitting JSON instead of native tool calls.
  - "{{scenario}}"

tests: ../test-suites/tools.yaml

defaultTest:
  threshold: 4
