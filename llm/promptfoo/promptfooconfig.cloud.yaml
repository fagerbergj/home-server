# promptfoo config — cloud models (Sonnet/Haiku) judged by Prometheus2
#
# Run:  npx promptfoo@latest eval -c promptfooconfig.cloud.yaml
# View: npx promptfoo@latest view
#
# Uses Prometheus2 as judge to avoid Claude self-bias when evaluating Sonnet/Haiku.
# Pull the judge model first:
#   ollama pull tensortemplar/prometheus2:8x7b-Q3_K_S
#
# Targets: Sonnet ≥90%, Haiku ≥70%.
# If a test fails for Sonnet, the prompt or rubric needs revision before
# running local models — don't adjust for Haiku failures alone.

evaluateOptions:
  maxConcurrency: 2
  timeoutMs: 120000  # 2 minutes — cloud models are fast

providers:
  - id: anthropic:claude-sonnet-4-6
  - id: anthropic:claude-haiku-4-5-20251001

prompts:
  - "{{task}}"

tests: tests.yaml

# Judge: Prometheus2 (local Ollama, fine-tuned for evaluation)
# Uses 1-5 scoring scale; threshold 0.66 ≈ score ≥ 3.3
defaultTest:
  threshold: 0.75
  options:
    provider: anthropic:claude-sonnet-4-6
    rubricPrompt: |
      ###Task Description:
      Evaluate the response based on the score rubric below.
      Write a brief feedback, then output a JSON object on the last line.

      ###The instruction to evaluate:
      {{prompt}}

      ###Response to evaluate:
      {{output}}

      ###Score Rubrics:
      [{{rubric}}]
      Score 1.0: Addresses all required points in the criterion; explanation is accurate, in-depth, and easy to act on.
      Score 0.9: Addresses all required points in the criterion; explanation is correct but may lack depth, precision, or clarity.
      Score 0.75: Addresses almost all required points but omits one minor detail; the points it covers are explained clearly and thoroughly.
      Score 0.5: Omits multiple required points from the criterion; the points it does cover are explained reasonably well.
      Score 0.25: Addresses very few required points from the criterion, or the explanation is so unclear or disorganized it is difficult to follow.
      Score 0.0: Response is incorrect, misleading, or does not address the criterion at all.

      ###Feedback:
      Write your feedback, then end with ONLY this JSON on the last line:
      {"pass": true/false, "score": 0.0, "reason": "one sentence"}
      Score must be one of: 0.0, 0.25, 0.5, 0.75, 0.9, 1.0. Pass if score >= 0.75.
