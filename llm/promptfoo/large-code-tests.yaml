# Large code generation tests — graded by compile + pytest coverage.
# Each test invokes large-code-runner.sh which:
#   1. Extracts Python code from the model output (```python blocks)
#   2. Writes to a tmpdir as solution.py
#   3. Runs `python3 -c 'import solution'` (compile check)
#   4. Runs the corresponding pytest file
#   5. Emits JSON: {compile, passed, total, reason}

- description: "Large code: Trie data structure"
  vars:
    test_name: "trie"
    task: |
      Implement a Trie (prefix tree) data structure in Python. Expose a class `Trie` with:
        - `insert(word: str) -> None`
        - `search(word: str) -> bool`  (True if exact word was inserted)
        - `starts_with(prefix: str) -> bool`  (True if any inserted word has this prefix)
        - `delete(word: str) -> bool`  (True if word was present and removed)

      Place all code in a single Python file. Use only the standard library.
  assert:
    - type: javascript
      metric: "[code] trie compiles + passes pytest"
      value: |
        const { execSync } = require('child_process');
        const fs = require('fs');
        const path = require('path');
        const tmpDir = fs.mkdtempSync('/tmp/eval-trie-');
        try {
          const runner = path.join(process.cwd(), 'large-code-runner.sh');
          const r = JSON.parse(execSync(`bash ${runner} trie ${tmpDir}`, {
            input: output, timeout: 120000, maxBuffer: 10 * 1024 * 1024
          }).toString());
          if (!r.compile) return { pass: false, score: 0, reason: 'compile fail: ' + r.reason };
          const score = r.total > 0 ? (r.passed / r.total) * 5 : 0;
          return { pass: score >= 4, score, reason: r.reason };
        } finally {
          fs.rmSync(tmpDir, { recursive: true, force: true });
        }

- description: "Large code: Markdown to HTML converter"
  vars:
    test_name: "markdown"
    task: |
      Implement a markdown-to-HTML converter in Python. Expose a function
      `to_html(markdown_text: str) -> str` that handles:
        - Headings: `# H1`, `## H2`, `### H3` → `<h1>`, `<h2>`, `<h3>`
        - Bold: `**text**` → `<strong>` (or `<b>`)
        - Italic: `*text*` → `<em>` (or `<i>`)
        - Links: `[text](url)` → `<a href="url">text</a>`
        - Unordered lists: `- item` → `<ul><li>...</li></ul>`
        - Fenced code blocks: triple backticks → `<pre><code>` (or `<code>`)
        - Plain paragraphs wrapped in `<p>`

      Single Python file. Standard library only.
  assert:
    - type: javascript
      metric: "[code] markdown compiles + passes pytest"
      value: |
        const { execSync } = require('child_process');
        const fs = require('fs');
        const path = require('path');
        const tmpDir = fs.mkdtempSync('/tmp/eval-md-');
        try {
          const runner = path.join(process.cwd(), 'large-code-runner.sh');
          const r = JSON.parse(execSync(`bash ${runner} markdown ${tmpDir}`, {
            input: output, timeout: 120000, maxBuffer: 10 * 1024 * 1024
          }).toString());
          if (!r.compile) return { pass: false, score: 0, reason: 'compile fail: ' + r.reason };
          const score = r.total > 0 ? (r.passed / r.total) * 5 : 0;
          return { pass: score >= 3.75, score, reason: r.reason };
        } finally {
          fs.rmSync(tmpDir, { recursive: true, force: true });
        }

- description: "Large code: SQLite job queue"
  vars:
    test_name: "job_queue"
    task: |
      Implement a SQLite-backed job queue in Python. Expose a class `JobQueue(db_path)` with:
        - `enqueue(payload: dict) -> int`  (returns job id)
        - `dequeue() -> tuple[int, dict] | None`  (FIFO order; None if empty)
        - `complete(job_id: int) -> None`  (removes the job from the queue)
        - `fail(job_id: int) -> None`  (increments retry counter; if exceeds MAX_RETRIES, move to DLQ)
        - `dlq() -> list[dict]`  (returns failed payloads)
        - `MAX_RETRIES` attribute (default 3)

      Use sqlite3 from the standard library. Single Python file.
  assert:
    - type: javascript
      metric: "[code] job_queue compiles + passes pytest"
      value: |
        const { execSync } = require('child_process');
        const fs = require('fs');
        const path = require('path');
        const tmpDir = fs.mkdtempSync('/tmp/eval-jq-');
        try {
          const runner = path.join(process.cwd(), 'large-code-runner.sh');
          const r = JSON.parse(execSync(`bash ${runner} job_queue ${tmpDir}`, {
            input: output, timeout: 120000, maxBuffer: 10 * 1024 * 1024
          }).toString());
          if (!r.compile) return { pass: false, score: 0, reason: 'compile fail: ' + r.reason };
          const score = r.total > 0 ? (r.passed / r.total) * 5 : 0;
          return { pass: score >= 3.5, score, reason: r.reason };
        } finally {
          fs.rmSync(tmpDir, { recursive: true, force: true });
        }

- description: "Large code: Rate-limited async HTTP client"
  vars:
    test_name: "rate_limiter"
    task: |
      Implement an async, rate-limited HTTP client in Python. Expose:
        `async def fetch(urls: list[str], rate: int) -> list[dict]`

      It must:
        - Issue at most `rate` requests per second across all URLs
        - Return one dict per URL: `{"url": str, "status": int, "body": str}` on success,
          or `{"url": str, "error": str}` after retries are exhausted
        - Retry transient failures (network errors, 5xx) with exponential backoff
        - Use aiohttp or httpx (async HTTP client)

      Single Python file. `pip install aiohttp` or `pip install httpx` is allowed
      (the runner will install if needed).
  assert:
    - type: javascript
      metric: "[code] rate_limiter compiles + passes pytest"
      value: |
        const { execSync } = require('child_process');
        const fs = require('fs');
        const path = require('path');
        const tmpDir = fs.mkdtempSync('/tmp/eval-rl-');
        try {
          const runner = path.join(process.cwd(), 'large-code-runner.sh');
          const r = JSON.parse(execSync(`bash ${runner} rate_limiter ${tmpDir}`, {
            input: output, timeout: 180000, maxBuffer: 10 * 1024 * 1024
          }).toString());
          if (!r.compile) return { pass: false, score: 0, reason: 'compile fail: ' + r.reason };
          const score = r.total > 0 ? (r.passed / r.total) * 5 : 0;
          return { pass: score >= 2.5, score, reason: r.reason };
        } finally {
          fs.rmSync(tmpDir, { recursive: true, force: true });
        }

- description: "Large code: Flappy Bird in Python"
  vars:
    test_name: "flappy_bird"
    task: |
      Implement a Flappy Bird clone in Python using pygame. The solution must expose
      these classes (importable from the module):
        - `Bird` — attributes: `x`, `y`, `velocity`; methods: `update()` (applies gravity),
          `jump()` (gives upward impulse), `draw(surface)`
        - `Pipe(x: int, gap_y: int)` — attributes: `x`, `gap_y`, `width`; methods:
          `update()` (moves left), `draw(surface)`, `collides_with(bird) -> bool`
        - `Game` — attributes: `bird`, `pipes` (list), `score`, `game_over`; methods:
          `update()` (advances one frame), `draw(surface)`

      You don't need to call `pygame.display.set_mode` or run the main loop at import
      time — the tests will instantiate the classes directly. Single Python file.
  assert:
    - type: javascript
      metric: "[code] flappy_bird compiles + has required structure"
      value: |
        const { execSync } = require('child_process');
        const fs = require('fs');
        const path = require('path');
        const tmpDir = fs.mkdtempSync('/tmp/eval-fb-');
        try {
          const runner = path.join(process.cwd(), 'large-code-runner.sh');
          const r = JSON.parse(execSync(`bash ${runner} flappy_bird ${tmpDir}`, {
            input: output, timeout: 120000, maxBuffer: 10 * 1024 * 1024
          }).toString());
          if (!r.compile) return { pass: false, score: 0, reason: 'compile fail: ' + r.reason };
          const score = r.total > 0 ? (r.passed / r.total) * 5 : 0;
          return { pass: score >= 3, score, reason: r.reason };
        } finally {
          fs.rmSync(tmpDir, { recursive: true, force: true });
        }
