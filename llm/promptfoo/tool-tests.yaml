

- description: "routes to search_documents for tag query"
  vars:
    check: "tag_query"
    scenario: |
      The user says: "Find all my documents tagged with invoice"
  assert:
    - type: javascript
      metric: "[baseline] search_documents with tags:invoice"
      value: "file://tools-grader.js"

- description: "routes to search_documents for date query"
  vars:
    check: "date_query"
    scenario: |
      The user says: "Show me documents from May 2026"
  assert:
    - type: javascript
      metric: "[baseline] search_documents with date_month:2026-05"
      value: "file://tools-grader.js"

- description: "routes to search_documents for title keyword query"
  vars:
    check: "title_keyword"
    scenario: |
      The user says: "Find the document about the quarterly review"
  assert:
    - type: javascript
      metric: "[baseline] search_documents for title match"
      value: "file://tools-grader.js"

- description: "routes to rag_search for fuzzy topical question"
  vars:
    check: "rag_topical"
    scenario: |
      The user asks: "What have I written about machine learning over the past year?"
  assert:
    - type: javascript
      metric: "[baseline] rag_search with plain 'machine learning'"
      value: "file://tools-grader.js"

- description: "routes to rag_search for cross-doc synthesis question"
  vars:
    check: "rag_synthesis"
    scenario: |
      The user asks: "Summarise everything I know about the Westbrook project"
  assert:
    - type: javascript
      metric: "[baseline] rag_search with plain 'Westbrook'"
      value: "file://tools-grader.js"

- description: "quotes multi-word series value in Lucene query"
  vars:
    check: "series_quoted"
    scenario: |
      The user asks: "Show me everything in the Secret Campaign series"
  assert:
    - type: javascript
      metric: "[proficient] series:\"Secret Campaign\" quoted correctly"
      value: "file://tools-grader.js"

- description: "quotes multi-word title value in Lucene query"
  vars:
    check: "title_quoted"
    scenario: |
      The user says: "Find the document titled may 16 meeting notes"
  assert:
    - type: javascript
      metric: "[proficient] title:\"...\" quoted correctly"
      value: "file://tools-grader.js"

- description: "does not use field:value syntax in rag_search"
  vars:
    check: "no_field_in_rag"
    scenario: |
      The user asks you to search for documents about tags:invoice using semantic search.
  assert:
    - type: javascript
      metric: "[proficient] redirect to search_documents OR plain rag_search"
      value: "file://tools-grader.js"

- description: "never calls search_documents with empty query"
  vars:
    check: "no_empty_search"
    scenario: |
      The user says: "Search for something" without specifying what. You are not sure what to search for.
  assert:
    - type: javascript
      metric: "[baseline] no empty search_documents query"
      value: "file://tools-grader.js"

- description: "never calls get_document without an ID"
  vars:
    check: "no_empty_get"
    scenario: |
      The user asks: "Show me the full text of that document." There are no search results in context — no document IDs have been mentioned.
  assert:
    - type: javascript
      metric: "[baseline] no empty/placeholder get_document ID"
      value: "file://tools-grader.js"

- description: "uses correct field name for update"
  vars:
    check: "update_summary"
    scenario: |
      The user says: "The summary for document abc-123 is wrong, please fix it to say 'Quarterly review covering Q2 sales performance and pipeline forecast'."
  assert:
    - type: javascript
      metric: "[baseline] update_document field=summary id=abc-123"
      value: "file://tools-grader.js"

- description: "rejects invalid field name for update"
  vars:
    check: "reject_invalid_field"
    scenario: |
      The user asks you to update the "embedding" field of document abc-123.
  assert:
    - type: javascript
      metric: "[proficient] does not call update_document with field=embedding"
      value: "file://tools-grader.js"

- description: "does not retry a rejected update"
  vars:
    check: "no_retry_after_reject"
    scenario: |
      You previously called update_document and it returned {"status": "rejected"}. The user has not said anything new.
  assert:
    - type: javascript
      metric: "[proficient] does not immediately re-call update_document"
      value: "file://tools-grader.js"

- description: "chains search_documents then get_document for specific doc"
  vars:
    check: "search_before_get"
    scenario: |
      The user asks: "Show me the full text of my meeting notes from March 2026." You have no document IDs in context.
  assert:
    - type: javascript
      metric: "[proficient] first call is search_documents"
      value: "file://tools-grader.js"
