# Competition-style math (MATH500 difficulty, levels 4-5).
# GSM8K was 9/9 saturated on llama-3.3-70b, so swapped to problems with
# headroom: function composition, complex powers, Vieta's, modular arithmetic,
# divisor sums, recurrence-style algebra, etc.
#
# Grading: deterministic — final numeric answer must appear in output. Rubric
# only checks that the model actually shows derivation (no signal otherwise).
# Each `answer` is the unique exact answer string.

- description: "MATH: function composition chain"
  vars:
    task: |
      Let f(x) = 3x + 1 and g(x) = x^2 - 2. Compute f(g(3)). Show your work, then state the final answer.
    answer: "22"
  assert:
    - type: javascript
      metric: "[baseline] answer: 22"
      value: "(/\\b22\\b/.test(output.trim().slice(-100))) ? 5 : 0"

- description: "MATH: sum of divisors of 196"
  vars:
    task: |
      Find the sum of all positive integer divisors of 196. Show your work, then state the final answer.
    answer: "399"
  assert:
    - type: javascript
      metric: "[baseline] answer: 399"
      value: "(/\\b399\\b/.test(output.trim().slice(-100))) ? 5 : 0"

- description: "MATH: complex power (1+i)^20"
  vars:
    task: |
      Compute (1+i)^20 where i is the imaginary unit. Show your work, then state the final answer as a single number (it is a real integer).
    answer: "-1024"
  assert:
    - type: javascript
      metric: "[baseline] answer: -1024"
      value: "(/-1024\\b/.test(output.trim().slice(-100))) ? 5 : 0"

- description: "MATH: solve exponential equation"
  vars:
    task: |
      Solve for x: (3/4)^x = 64/27. Show your work, then state the final answer.
    answer: "-3"
  assert:
    - type: javascript
      metric: "[baseline] answer: -3"
      value: "(/(^|[^0-9])-3(\\b|$)/.test(output.trim().slice(-100))) ? 5 : 0"

- description: "MATH: smallest n with divisibility constraints"
  vars:
    task: |
      Find the smallest positive integer n such that n^2 is divisible by 24 AND n^3 is divisible by 200. Show your work, then state the final answer.
    answer: "60"
  assert:
    - type: javascript
      metric: "[baseline] answer: 60"
      value: "(/\\b60\\b/.test(output.trim().slice(-120))) ? 5 : 0"

- description: "MATH: sum of squares of cubic roots (Vieta's)"
  vars:
    task: |
      Let r_1, r_2, r_3 be the roots of x^3 - 6x^2 + 11x - 6 = 0. Compute r_1^2 + r_2^2 + r_3^2. Show your work, then state the final answer.
    answer: "14"
  assert:
    - type: javascript
      metric: "[baseline] answer: 14"
      value: "(/\\b14\\b/.test(output.trim().slice(-100))) ? 5 : 0"

- description: "MATH: nested function evaluation"
  vars:
    task: |
      Let f(x) = x^2 + 6x + 1. Compute f(f(2)). Show your work, then state the final answer.
    answer: "392"
  assert:
    - type: javascript
      metric: "[baseline] answer: 392"
      value: "(/\\b392\\b/.test(output.trim().slice(-100))) ? 5 : 0"

- description: "MATH: equilateral triangle perimeter from area"
  vars:
    task: |
      An equilateral triangle has area 9*sqrt(3). What is its perimeter? Show your work, then state the final answer.
    answer: "18"
  assert:
    - type: javascript
      metric: "[baseline] answer: 18"
      value: "(/\\b18\\b/.test(output.trim().slice(-100))) ? 5 : 0"

- description: "MATH: identity for x^3 + 1/x^3"
  vars:
    task: |
      If x + 1/x = 5, find x^3 + 1/x^3. Show your work, then state the final answer.
    answer: "110"
  assert:
    - type: javascript
      metric: "[baseline] answer: 110"
      value: "(/\\b110\\b/.test(output.trim().slice(-100))) ? 5 : 0"

- description: "MATH: floor of (1 + sqrt 2)^4"
  vars:
    task: |
      Compute the floor of (1 + sqrt(2))^4. Show your work, then state the final answer as an integer.
    answer: "33"
  assert:
    - type: javascript
      metric: "[baseline] answer: 33"
      value: "(/\\b33\\b/.test(output.trim().slice(-100))) ? 5 : 0"
