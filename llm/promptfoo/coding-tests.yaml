# HumanEval Python coding problems
# Source: https://github.com/openai/human-eval (MIT License)
# Entries HumanEval/0-7
#
# The model must complete the function body given the signature + docstring.
# Assertions check for correct logic and edge case handling.

- description: "HumanEval/0: has_close_elements"
  vars:
    task: |
      Complete this Python function:

      from typing import List

      def has_close_elements(numbers: List[float], threshold: float) -> bool:
          """ Check if in given list of numbers, are any two numbers closer to each other than
          given threshold.
          >>> has_close_elements([1.0, 2.0, 3.0], 0.5)
          False
          >>> has_close_elements([1.0, 2.8, 3.0, 4.0, 5.0, 2.0], 0.3)
          True
          """
  assert:
    - type: llm-rubric
      metric: "[baseline] implements pairwise distance check"
      value: >
        Score 3: Produces a function that iterates over pairs of numbers and compares distances
        Score 4: Also handles the idx != idx2 guard to avoid comparing an element to itself
        Score 5: Also passes edge cases: empty list, threshold larger than all differences, all identical numbers

- description: "HumanEval/1: separate_paren_groups"
  vars:
    task: |
      Complete this Python function:

      from typing import List

      def separate_paren_groups(paren_string: str) -> List[str]:
          """ Input to this function is a string containing multiple groups of nested parentheses.
          Your goal is to separate those group into separate strings and return the list of those.
          Separate groups are balanced (each open brace is properly closed) and not nested within each other.
          Ignore any spaces in the input string.
          >>> separate_paren_groups('( ) (( )) (( )( ))')
          ['()', '(())', '(()())']
          """
  assert:
    - type: llm-rubric
      metric: "[baseline] depth tracking for balanced groups"
      value: >
        Score 3: Uses a depth counter to track nesting level and split groups correctly
        Score 4: Also strips spaces from the input before processing
        Score 5: Also resets state correctly between groups so nested groups don't bleed into each other

- description: "HumanEval/3: below_zero bank balance"
  vars:
    task: |
      Complete this Python function:

      from typing import List

      def below_zero(operations: List[int]) -> bool:
          """ You're given a list of deposit and withdrawal operations on a bank account that starts with
          zero balance. Your task is to detect if at any point the balance falls below zero, and
          at that point function should return True. Otherwise it should return False.
          >>> below_zero([1, 2, 3])
          False
          >>> below_zero([1, 2, -4, 5])
          True
          """
  assert:
    - type: llm-rubric
      metric: "[baseline] running balance check"
      value: >
        Score 3: Maintains a running balance and returns True as soon as it goes negative
        Score 4: Also handles an empty list correctly (returns False)
        Score 5: Also early-exits correctly — stops as soon as balance < 0 rather than scanning the full list

- description: "HumanEval/4: mean_absolute_deviation"
  vars:
    task: |
      Complete this Python function:

      from typing import List

      def mean_absolute_deviation(numbers: List[float]) -> float:
          """ For a given list of input numbers, calculate Mean Absolute Deviation
          around the mean of this dataset.
          Mean Absolute Deviation is the average absolute difference between each
          element and a centerpoint (mean in this case):
          MAD = average | x - x_mean |
          >>> mean_absolute_deviation([1.0, 2.0, 3.0, 4.0])
          1.0
          """
  assert:
    - type: llm-rubric
      metric: "[baseline] correct MAD formula"
      value: >
        Score 3: Computes the mean and then the average absolute deviation from it
        Score 4: Also uses sum() and len() or equivalent — doesn't reinvent them with explicit loops unnecessarily
        Score 5: Also correct for edge cases like single-element lists (MAD = 0.0)

- description: "HumanEval/5: intersperse"
  vars:
    task: |
      Complete this Python function:

      from typing import List

      def intersperse(numbers: List[int], delimeter: int) -> List[int]:
          """ Insert a number 'delimeter' between every two consecutive elements of input list.
          >>> intersperse([], 4)
          []
          >>> intersperse([1, 2, 3], 4)
          [1, 4, 2, 4, 3]
          """
  assert:
    - type: llm-rubric
      metric: "[baseline] correct intersperse without trailing delimiter"
      value: >
        Score 3: Inserts the delimiter between elements and does not add a trailing delimiter
        Score 4: Also handles the empty list case correctly
        Score 5: Also handles a single-element list (should return [element] with no delimiter)

- description: "HumanEval/6: parse_nested_parens depth"
  vars:
    task: |
      Complete this Python function:

      from typing import List

      def parse_nested_parens(paren_string: str) -> List[int]:
          """ Input to this function is a string representing multiple groups of nested parentheses
          separated by spaces. For each group, output the deepest level of nesting.
          E.g. (()()) has maximum two levels while ((())) has three.
          >>> parse_nested_parens('(()()) ((())) () ((())()())')
          [2, 3, 1, 3]
          """
  assert:
    - type: llm-rubric
      metric: "[baseline] max depth per group"
      value: >
        Score 3: Splits on spaces, tracks depth per group, and returns the max depth for each
        Score 4: Also correctly resets depth counter between groups
        Score 5: Also handles non-uniform spacing (e.g., groups separated by multiple spaces) or empty groups

- description: "HumanEval/7: filter_by_substring"
  vars:
    task: |
      Complete this Python function:

      from typing import List

      def filter_by_substring(strings: List[str], substring: str) -> List[str]:
          """ Filter an input list of strings only for ones that contain given substring.
          >>> filter_by_substring([], 'a')
          []
          >>> filter_by_substring(['abc', 'bacd', 'cde', 'array'], 'a')
          ['abc', 'bacd', 'array']
          """
  assert:
    - type: llm-rubric
      metric: "[baseline] correct substring filter"
      value: >
        Score 3: Returns a list of strings containing the substring (case-sensitive)
        Score 4: Also preserves the original order of matching strings
        Score 5: Also produces an idiomatic one-liner (list comprehension) and handles an empty input list
