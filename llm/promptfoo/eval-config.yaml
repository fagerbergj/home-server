# Maps each model to its test suites and concurrency.
#   ./eval.sh [model ...]          # a model's default suites
#   ./eval.sh --suite <s> [model]  # one suite
#
# ACTIVE suites (task-driven — see llm/MODEL_SELECTION.md):
#   livecodebench — A-2 bug-finding: generate + sandbox-execute (contamination-safe)
#   code-review   — A-3 ★: review PR diffs with planted regressions (Selene)
#   clarify       — B-3 ★: clean garbled OCR/transcripts; honesty tier (Selene)
#   structured    — B-6: JSON/format adherence; DETERMINISTIC (no judge, fast)
#   honesty       — A5/A6/B1: nonexistent-API/false-premise traps + controls (Selene)
#   coding        — A-4: multi-language static debug (Selene)
#   cruxeval      — code reasoning: predict-the-output + gotchas
#   architecture  — planner design-reasoning (Selene)
#   chat          — pipeline stages: summarize/classify/contextual (Selene)
#   tools         — document-pipeline tool routing
#   agentic       — opencode self-directs: solo + seeded bugfix + PR review + repo summary
#
# DISABLED (kept on disk; pruned 2026-05-25 per the discrimination×relevance audit):
#   brain-twisters — only 3/9 discriminate, low relevance
#   calibration    — saturated (9/10 all-pass); superseded by `honesty`
#   hard-reasoning — discriminates well but irrelevant (GPQA science) to the flows
#   math, chat-multiturn — saturated

models:
  gpt-oss-120b:
    concurrency: 1
    suites:
      - livecodebench
      - code-review
      - clarify
      - structured
      - honesty
      - coding
      - cruxeval
      - architecture
      - chat
      - tools
      - agentic

  gpt-oss-20b:
    concurrency: 1
    suites:
      - livecodebench
      - code-review
      - clarify
      - structured
      - honesty
      - coding
      - cruxeval
      - architecture
      - chat
      - tools
      - agentic

  qwen3.6-35b:
    concurrency: 1
    suites:
      - livecodebench
      - code-review
      - clarify
      - structured
      - honesty
      - coding
      - cruxeval
