# Maps each model to its test suites and concurrency.
#
# Suites (run with: ./eval.sh [model]):
#   architecture   (26 tests) — software systems & design (saturated tests culled)
#   coding         (9 tests)  — HumanEval + debugging (trivial ones culled)
#   function-call  (11 tests) — BFCL + structured output + tool routing
#   brain-twisters (9 tests)  — logical/spatial reasoning traps (saturated culled)
#   cruxeval       (15 tests) — predict-the-output + code gotchas
#   calibration    (10 tests) — does the model admit "I don't know"?
#   hard-reasoning (15 tests) — GPQA-style science MCQ + ZebraLogic puzzles
#   large-code     (5 tests)  — compile + pytest graded (Trie, Markdown, JobQueue, RateLimiter, FlappyBird)
#   math           (9 tests)  — GSM8K word problems
#   tools         (14 tests)  — document-pipeline specific tool routing

models:
  llama-3.3-70b:
    concurrency: 1
    suites:
      - architecture
      - coding
      - function-call
      - brain-twisters
      - cruxeval
      - calibration
      - hard-reasoning
      - large-code
      - math
      - tools

  qwen3.6-35b:
    concurrency: 2
    suites:
      - architecture
      - coding
      - function-call
      - brain-twisters
      - cruxeval
      - calibration
      - hard-reasoning
      - large-code
      - math
      - tools

  qwen3.5-9b:
    concurrency: 4
    suites:
      - architecture
      - coding
      - function-call
      - brain-twisters
      - cruxeval
      - calibration
      - hard-reasoning
      - large-code

  qwen3-coder-next:
    concurrency: 1
    suites:
      - architecture
      - coding
      - function-call
      - brain-twisters
      - cruxeval
      - calibration
      - hard-reasoning
      - large-code
      - math
      - tools
