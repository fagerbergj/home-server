# Maps each model to its test suites and concurrency.
#   ./eval.sh [model ...]          # a model's default suites (in the order below)
#   ./eval.sh --suite <s> [model]  # one suite/bundle
#
# Suites are ORDERED to minimize model↔Selene swaps (each swap is multi-minute):
# run the model-only suites first (model loads once, stays hot), then the grouped
# rubric bundles, then agentic. Rubric suites that share provider+judge+scale are
# BUNDLED into one config so the model loads once and Selene grades once for all
# of them — see configs/promptfooconfig.{coding-flow,chat-flow}.yaml.
#
# ACTIVE suites (task-driven — see llm/MODEL_SELECTION.md):
#   livecodebench — A-2: generate + sandbox-execute (custom provider, no judge)
#   structured    — B-6: JSON/format, DETERMINISTIC js (no judge)
#   tools         — document-pipeline tool routing, DETERMINISTIC js (no judge)
#   coding-flow   — BUNDLE: architecture + coding + code-review (openai:chat + Selene)
#   cruxeval      — code reasoning; 1-5 llm-rubric (separate scale → own config)
#   chat-flow     — BUNDLE: chat + clarify + honesty (openai:chat + Selene)
#   agentic       — opencode self-directs (custom provider; Selene for review/summary)
#
# Single-suite configs still exist for targeted runs (--suite code-review etc.).
# DISABLED (kept on disk): brain-twisters, calibration, hard-reasoning, math,
# chat-multiturn (see the 2026-05-25 discrimination×relevance audit).
# DEFERRED: longbench — slow (180k prefills) and the implementer is locked to 35b,
# so it's sanity not comparison. Run standalone when long-context QUALITY is the
# question: ./scripts/eval.sh --suite longbench qwen3.6-35b

models:
  # PLANNER — gpt-oss-120b. 128k context (clears 132k window via tolerance), 50 t/s.
  # Ties 35b on most planner signals; matches it on honesty. Full battery for
  # re-runs against new candidates.
  gpt-oss-120b:
    concurrency: 1
    suites: [livecodebench, tests-for-diff, structured, tools, bfcl, coding-flow, cruxeval, chat-flow, agentic, terminal]

  # CHAT — qwen3.6-35b. Best chat-flow (0.855), best clarify (0.85), tied-best
  # honesty (0.82), 60-70 t/s with margin for 2-4 concurrent. Full battery.
  qwen3.6-35b:
    concurrency: 1
    suites: [livecodebench, tests-for-diff, structured, tools, bfcl, coding-flow, cruxeval, chat-flow, agentic, terminal]

  # IMPLEMENTER — qwen3-coder-next. Wins agentic (6/9) AND is ~10x more token-
  # efficient than 35b on solo agentic tasks (8k vs 89k tokens, 1 vs 7.5 turns).
  # 80B/3B-active hybrid, 256K native, 32 t/s. Full battery.
  qwen3-coder-next:
    concurrency: 1
    suites: [livecodebench, tests-for-diff, structured, tools, bfcl, coding-flow, cruxeval, chat-flow, agentic, terminal]

  # DOC-PIPELINE WORKHORSE — qwen3.5-9b. Separate role ([[dp-stage-models]]); chat
  # baseline only (chat-flow + cheap deterministic suites).
  qwen3.5-9b:
    concurrency: 1
    suites: [chat-flow, structured, tools, bfcl]

  # JUDGE CANDIDATES — evaluated only on the `judge` suite (does a different-family
  # CPU model grade the agent-researcher G-Eval rubric as well as the incumbent
  # selene-mini, and faster?). All CPU builds; Selene-70B is the meta-grader.
  # Run: ./scripts/eval.sh --suite judge gemma4-12b gemma4-26b-a4b selene-mini
  gemma4-12b:
    concurrency: 1
    suites: [judge]
  gemma4-26b-a4b:
    concurrency: 1
    suites: [judge]
  selene-mini:
    concurrency: 1
    suites: [judge]
