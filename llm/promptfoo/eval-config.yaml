# Maps each model to its test suites and concurrency.
#
# Suites (run with: ./eval.sh [model]):
#   architecture   (10 tests) — only expert-level/known-discriminating tests kept
#   coding         (9 tests)  — HumanEval + debugging (trivial ones culled)
#   chat            (4)   — real OCR-pipeline prompts: summarize/clarify/classify/contextual
#   brain-twisters (9 tests)  — logical/spatial reasoning traps (saturated culled)
#   cruxeval       (15 tests) — predict-the-output + code gotchas
#   calibration    (10 tests) — does the model admit "I don't know"?
#   hard-reasoning (15 tests) — GPQA-style science MCQ + ZebraLogic puzzles
#   agentic        (5 tests)  — opencode self-directs in a sandbox; hidden pytest grades + reports tokens/turns
#   math           (disabled — saturated, all models passed; kept on disk)
#   tools         (14 tests)  — document-pipeline specific tool routing

models:
  gpt-oss-120b:
    concurrency: 1
    suites:
      - architecture
      - coding
      - chat
      - brain-twisters
      - cruxeval
      - calibration
      - hard-reasoning
      - agentic
      - tools

  qwen3.6-35b:
    concurrency: 1
    suites:
      - architecture
      - coding
      - chat
      - brain-twisters
      - cruxeval
      - calibration
      - hard-reasoning
      - agentic
      - tools

  qwen3-coder-next:
    concurrency: 1
    suites:
      - architecture
      - coding
      - chat
      - brain-twisters
      - cruxeval
      - calibration
      - hard-reasoning
      - agentic
      - tools

  qwen3.5-9b:
    concurrency: 1
    suites:
      - architecture
      - coding
      - chat
      - brain-twisters
      - cruxeval
