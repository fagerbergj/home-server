# promptfoo config — llm-swap stack judged by selene-mini
#
# Don't run directly — use eval.sh which sets MODEL and concurrency:
#
#   cd llm/promptfoo && ./eval.sh [model]
#
# Or run a single model manually:
#
#   MODEL=qwen3.5-9b npx promptfoo@latest eval -c promptfooconfig.llm-swap.yaml --max-concurrency 4

evaluateOptions:
  timeoutMs: 600000

providers:
  - id: "openai:chat:{{ env.MODEL }}"
    config:
      apiBaseUrl: http://jason-server:11436/v1
      apiKey: llm-swap

prompts:
  - "{{task}}"

tests: tests.yaml

# Judge: selene-1-mini-llama-3.1-8b (always-on, port 11437)
# Ensure it's running: make -C .. judge-up
defaultTest:
  threshold: 0.8
  options:
    provider:
      id: openai:chat:selene
      config:
        apiBaseUrl: http://jason-server:11437/v1
        apiKey: llm-judge
    transform: "output.replace(/^(Thinking:|<think>)[\\s\\S]*?(<\\/think>|\\n\\n)/i, '').trim()"
    rubricPrompt: |
      You are grading a technical response. Use the rubric to assess quality,
      then output ONLY a JSON object on the last line — nothing after it.

      Rubric:
      {{rubric}}

      Prompt given to the model:
      {{prompt}}

      Response to grade:
      {{output}}

      Think step by step:
      1. What score level does the rubric require?
      2. Does the response satisfy it? Quote the key part.

      Then output ONLY this JSON (no trailing text):
      {"pass": true/false, "score": <score (1-5) you gave that answer>, "reason": "<one sentance explaining why you gave that score>"}
