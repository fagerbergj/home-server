# promptfoo config — llm-swap stack judged by prometheus-7b
#
# Don't run directly — use eval.sh which sets MODEL and concurrency:
#
#   cd llm/promptfoo && ./eval.sh [model]
#
# Or run a single model manually:
#
#   MODEL=qwen3.5-9b npx promptfoo@latest eval -c promptfooconfig.llm-swap.yaml --max-concurrency 4

evaluateOptions:
  timeoutMs: 600000

providers:
  - id: "openai:chat:{{ env.MODEL }}"
    config:
      apiBaseUrl: "{{ env.LLM_SWAP_URL }}"
      apiKey: llm-swap

prompts:
  - "{{task}}"

tests: tests.yaml

# Judge: prometheus-7b-v2.0 (always-on, port 11437)
# Ensure it's running: make -C .. judge-up
defaultTest:
  threshold: 0.8
  options:
    provider:
      id: openai:chat:prometheus-7b
      config:
        apiBaseUrl: http://jason-server:11437/v1
        apiKey: llm-judge
    rubricPrompt: |
      You are grading a technical response against a specific criterion.

      Prompt given to the model:
      {{prompt}}

      Response to grade:
      {{output}}

      Scoring rubric:
      {{rubric}}

      Think through this carefully:
      1. What does the rubric specifically require at each score level?
      2. Which level does this response achieve? Quote the relevant part.
      3. If partial credit applies, explain why.

      Then output ONLY a JSON object on the last line — nothing after it:
      {"pass": true/false, "score": 0.0, "reason": "one sentence"}

      Score mapping: Score 5 → 1.0, Score 4 → 0.8, Score 3 → 0.6, Score 2 → 0.4, Score 1 → 0.2
      pass is true when score >= 0.8 (Score 4 or 5).
