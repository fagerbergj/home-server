- description: "JSON: extract structured data from prose"
  vars:
    task: |
      Extract the following information as a JSON object with exactly these fields:
        name    (string)
        age     (integer — not a string)
        role    (string)
        city    (string)
      Return ONLY the JSON object — no markdown fences, no explanation.

      "Sarah Chen is a 28-year-old DevOps engineer based in Austin, Texas."
  assert:
    - type: is-json
      metric: "[baseline] syntactically valid JSON"
    - type: javascript
      metric: "[baseline] correct field values and types"
      value: |
        const d = JSON.parse(output);
        if (d.name !== 'Sarah Chen')
          return { pass: false, score: 0, reason: 'wrong name: ' + d.name };
        if (d.age !== 28)
          return { pass: false, score: 0, reason: 'age should be integer 28, got: ' + JSON.stringify(d.age) };
        if (typeof d.role !== 'string' || !d.role.trim())
          return { pass: false, score: 0, reason: 'missing or empty role' };
        if (typeof d.city !== 'string' || !d.city.trim())
          return { pass: false, score: 0, reason: 'missing or empty city' };
        return true;

- description: "JSON: generate object satisfying a TypeScript interface"
  vars:
    task: |
      Generate a valid JSON object that satisfies this TypeScript interface.
      Return ONLY the JSON — no markdown fences, no explanation.

      interface ServiceConfig {
        name: string;           // non-empty
        port: number;           // valid port: 1–65535
        replicas: number;       // at least 1
        environment: "production" | "staging" | "development";
        tags: string[];         // at least one entry
      }
  assert:
    - type: is-json
      metric: "[baseline] syntactically valid JSON"
    - type: javascript
      metric: "[baseline] satisfies interface constraints"
      value: |
        const d = JSON.parse(output);
        if (typeof d.name !== 'string' || !d.name)
          return { pass: false, score: 0, reason: 'name must be non-empty string' };
        if (typeof d.port !== 'number' || d.port < 1 || d.port > 65535)
          return { pass: false, score: 0, reason: 'port out of valid range: ' + d.port };
        if (typeof d.replicas !== 'number' || d.replicas < 1)
          return { pass: false, score: 0, reason: 'replicas must be >= 1' };
        if (!['production', 'staging', 'development'].includes(d.environment))
          return { pass: false, score: 0, reason: 'invalid environment: ' + d.environment };
        if (!Array.isArray(d.tags) || d.tags.length === 0)
          return { pass: false, score: 0, reason: 'tags must be a non-empty array' };
        return true;

