- description: "YAML: generate a valid Docker Compose service definition"
  vars:
    task: |
      Generate a Docker Compose v3 services block for a PostgreSQL 15 database.
      Requirements:
        - service name: db
        - image: postgres:15
        - host port 5432 mapped to container port 5432
        - environment variable POSTGRES_DB set to myapp
        - named volume pgdata mounted at /var/lib/postgresql/data
      Return ONLY the YAML starting with "services:" — no markdown fences.
  assert:
    - type: javascript
      metric: "[baseline] required components present"
      value: |
        // Strip markdown code fences if present
        const yaml = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
        if (!yaml.startsWith('services:'))
          return { pass: false, score: 0, reason: 'output must start with "services:" (got: ' + yaml.slice(0, 40) + ')' };
        if (!yaml.includes('postgres:15'))
          return { pass: false, score: 0, reason: 'missing postgres:15 image' };
        if (!yaml.includes('5432'))
          return { pass: false, score: 0, reason: 'missing port 5432' };
        if (!yaml.includes('POSTGRES_DB') || !yaml.includes('myapp'))
          return { pass: false, score: 0, reason: 'missing POSTGRES_DB=myapp env var' };
        if (!yaml.includes('pgdata'))
          return { pass: false, score: 0, reason: 'missing pgdata volume reference' };
        return true;
    - type: javascript
      metric: "[proficient] parseable YAML with correct structure"
      value: |
        // Strip markdown code fences if present
        const raw = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
        try {
          if (typeof require === 'undefined') throw Object.assign(new Error('no require'), { code: 'MODULE_NOT_FOUND' });
          const yaml = require('yaml');
          const doc = yaml.parse(raw);
          const db = doc?.services?.db;
          if (!db) return { pass: false, score: 0, reason: 'services.db not found in parsed YAML' };
          if (!db.image?.startsWith('postgres:')) return { pass: false, score: 0, reason: 'wrong image: ' + db.image };
          return true;
        } catch (e) {
          if (e.code === 'MODULE_NOT_FOUND') {
            if (!raw.match(/^\s+db:/m)) return { pass: false, score: 0, reason: 'services.db key not found' };
            if (!raw.match(/image:\s*postgres:15/)) return { pass: false, score: 0, reason: 'missing postgres:15 image' };
            return true;
          }
          return { pass: false, score: 0, reason: 'YAML parse error: ' + e.message };
        }
