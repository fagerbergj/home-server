- description: "Docker: debug slow builds and security concerns"
  vars:
    task: |
      My Docker builds are painfully slow — every time I change a line of
      Python code it reinstalls all my dependencies from scratch. I'm also
      worried about security and noticed my container might be running as
      root. And sometimes my app doesn't shut down cleanly when I stop the
      container. Can you tell me what's wrong with this Dockerfile?

      ```dockerfile
      FROM ubuntu:latest
      RUN apt-get update && apt-get install -y python3 python3-pip
      COPY . /app
      RUN pip3 install -r /app/requirements.txt
      WORKDIR /app
      ENV DATABASE_URL=postgres://admin:secretpassword@db:5432/myapp
      CMD python3 app.py
      ```
  assert:
    - type: llm-rubric
      metric: "[baseline] secret in ENV"
      value: >
        Score 3: Identifies that hardcoding credentials in ENV bakes the secret into
        the image layer
        Score 4: Also explains it's visible via `docker history` and any registry the
        image is pushed to
        Score 5: Also explains the correct approach (runtime secret injection)
    - type: llm-rubric
      metric: "[baseline] COPY ordering breaks layer cache"
      value: >
        Score 3: Identifies that `COPY . /app` before `pip3 install` is the problem
        Score 4: Also explains this invalidates the pip layer on every code change,
        causing a full dependency reinstall
        Score 5: Also explains the fix: copy requirements.txt first, run pip, then copy
        the rest
    - type: llm-rubric
      metric: "[proficient] running as root"
      value: >
        Score 3: Identifies that there is no USER instruction
        Score 4: Also explains the container process runs as root
        Score 5: Also explains this is a security risk if the process or a dependency
        is compromised
    - type: llm-rubric
      metric: "[expert] CMD shell vs exec form"
      value: >
        Score 3: Identifies that `CMD python3 app.py` uses shell form
        Score 4: Also explains the process runs as a child of `/bin/sh`, so signals like
        SIGTERM are not forwarded, preventing graceful shutdown
        Score 5: Also explains the fix is exec form: `CMD ["python3", "app.py"]`

- description: "Go: debug wrong results in concurrent fetch"
  vars:
    task: |
      I have a Go function that fetches a list of URLs concurrently and
      returns the response bodies. It mostly works but sometimes returns
      wrong results — some slots in the results slice end up with the
      wrong body or are empty even when the request succeeded. I'm also
      seeing what looks like a file descriptor leak under load. Go 1.21.
      What's wrong with this code?

      ```go
      func fetchAll(urls []string) []string {
          results := make([]string, len(urls))
          var wg sync.WaitGroup
          for i, url := range urls {
              wg.Add(1)
              go func() {
                  defer wg.Done()
                  resp, err := http.Get(url)
                  if err != nil {
                    return
                  }
                  body, _ := io.ReadAll(resp.Body)
                  results[i] = string(body)
              }()
          }
          wg.Wait()
          return results
      }
      ```
  assert:
    - type: llm-rubric
      metric: "[baseline] loop variable capture"
      value: >
        Score 3: Identifies the loop variable capture bug — in Go 1.21, i and url are
        shared across goroutines
        Score 4: Also explains all goroutines may read the last loop values, causing
        incorrect results
        Score 5: Also explains the fix — capturing loop variables as function parameters
        in the goroutine closure
    - type: llm-rubric
      metric: "[baseline] resp.Body never closed"
      value: >
        Score 3: Identifies that resp.Body is never closed
        Score 4: Also explains this is a resource leak (file descriptor and memory) on
        every successful request
        Score 5: Also explains why this matters not just naming the issue
    - type: llm-rubric
      metric: "[proficient] io.ReadAll error ignored"
      value: >
        Score 3: Identifies that the io.ReadAll error is silently discarded with _
        Score 4: Also explains the function may return partial or empty results without
        any indication of failure
        Score 5: Also explains the impact on debugging and reliability
    - type: llm-rubric
      metric: "[expert] no timeout or context"
      value: >
        Score 3: Identifies that http.Get has no timeout or context
        Score 4: Also explains goroutines can hang indefinitely on slow or unresponsive
        servers
        Score 5: Also explains there is no way for the caller to cancel in-flight requests

- description: "Kotlin: debug NullPointerException in coroutine service"
  vars:
    task: |
      My Kotlin service is crashing with a NullPointerException that I can't
      reproduce consistently — it seems to happen more under load. I'm also
      seeing what might be a resource leak; memory creeps up over time even
      though I'm not holding onto data. Can you help me figure out what's
      wrong with this code?

      ```kotlin
      class UserService(private val repo: UserRepository) {
          private val scope = CoroutineScope(Dispatchers.IO)

          fun getUser(id: String): UserProfile {
              var result: UserProfile? = null
              scope.launch {
                  result = repo.findById(id)
              }
              Thread.sleep(1000)
              return result!!
          }

          fun shutdown() {
              scope.cancel()
          }
      }
      ```
  assert:
    - type: llm-rubric
      metric: "[baseline] race condition and NPE"
      value: >
        Score 3: Identifies the race between Thread.sleep and the coroutine
        Score 4: Also explains the coroutine may not complete within 1000ms, and
        result!! will throw NullPointerException
        Score 5: Also explains the mechanism, not just says "it might be null"
    - type: llm-rubric
      metric: "[baseline] blocking function should be suspend"
      value: >
        Score 3: Identifies that getUser is a blocking function pretending to be async
        Score 4: Also explains it should be a suspend function or return a Deferred,
        not use Thread.sleep to wait
        Score 5: Also explains why this is fundamentally wrong in the Kotlin coroutine model
    - type: llm-rubric
      metric: "[proficient] shared mutable variable visibility"
      value: >
        Score 3: Identifies that result is a shared mutable variable between the coroutine
        (Dispatchers.IO thread pool) and the calling thread
        Score 4: Also explains there is no visibility guarantee under the JVM memory model
        Score 5: Also explains the practical consequences of the visibility gap
    - type: llm-rubric
      metric: "[proficient] unscoped lifecycle"
      value: >
        Score 3: Identifies that scope has no lifecycle management
        Score 4: Also explains it leaks if shutdown() is never called
        Score 5: Also explains the caller has no way to know shutdown() is required
    - type: llm-rubric
      metric: "[expert] silent coroutine failure"
      value: >
        Score 3: Identifies that if repo.findById throws an exception, the coroutine fails
        silently
        Score 4: Also explains result stays null
        Score 5: Also explains the caller gets an NPE with no indication of the actual error

- description: "TypeScript: debug silent failures in event processor"
  vars:
    task: |
      My TypeScript event processor seems to silently fail sometimes — some
      delete operations don't run and I can't tell why, and downstream code
      is occasionally crashing on userId values it shouldn't be receiving.
      The TypeScript compiler is happy with everything. What's wrong here?

      ```typescript
      async function processEvents(events: unknown[]): Promise<void> {
        const results = await Promise.all(
          events.map(async (event) => {
            const e = event as { type: string; userId: string };
            if (e.type === "delete") {
              await deleteUser(e.userId);
            }
            return e.userId;
          })
        );
        console.log(`Processed ${results.length} events`);
      }
      ```
  assert:
    - type: llm-rubric
      metric: "[baseline] unsafe cast"
      value: >
        Score 3: Identifies that `as { type: string; userId: string }` is an unsafe cast
        Score 4: Also explains there is no runtime validation, so any value (null, number,
        wrong-shaped object) passes through the type system unchecked
        Score 5: Also explains the practical consequences of the unsafe cast
    - type: llm-rubric
      metric: "[baseline] Promise.all fails fast"
      value: >
        Score 3: Identifies that Promise.all fails fast
        Score 4: Also explains if one deleteUser call rejects, the remaining promises are
        abandoned and the error propagates with no cleanup
        Score 5: Also explains the cascading failure impact on the entire batch
    - type: llm-rubric
      metric: "[proficient] no error handling on deleteUser"
      value: >
        Score 3: Identifies that there is no error handling on deleteUser
        Score 4: Also explains if it throws, the entire function rejects
        Score 5: Also explains any remaining delete operations are abandoned mid-batch
    - type: llm-rubric
      metric: "[proficient] no input validation"
      value: >
        Score 3: Identifies that there is no validation of individual events
        Score 4: Also explains nulls, primitives, or objects with unexpected shapes all
        silently pass the type assertion
        Score 5: Also explains they may cause runtime errors downstream
    - type: llm-rubric
      metric: "[expert] results contain untrusted data"
      value: >
        Score 3: Identifies that the results array accumulates e.userId for all events
        including non-delete ones
        Score 4: Also explains these may be undefined at runtime despite the type
        claiming string
        Score 5: Also explains downstream consumers of this array would trust invalid data

