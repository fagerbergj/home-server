# Large code generation — compile + pytest grading via large-code-runner.sh
# Run: ./eval.sh --suite large-code [model]
#
# Requires: python3 + pytest installed on the host running eval.sh
# (pytest is invoked by large-code-runner.sh)
evaluateOptions:
  timeoutMs: 600000
providers:
  - id: "openai:chat:{{ env.MODEL }}"
    config:
      apiBaseUrl: http://jason-server:11436/v1
      apiKey: llm-swap
      max_tokens: 6000   # full implementations can be long; default truncates
prompts:
  # Suffix forbids the thinking preamble — qwen3.6-35b was burning its entire
  # token budget on chain-of-thought and never reaching the implementation.
  - |
    {{task}}

    Output ONLY the complete Python solution in a single fenced ```python``` block.
    No reasoning, no planning, no preamble, no commentary after the code.
tests: large-code-tests.yaml
# No judge needed — grading is deterministic via pytest. defaultTest omitted.
