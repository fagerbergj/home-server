# Large code generation — compile + pytest grading via large-code-runner.sh.
# Run: ./eval.sh --suite large-code [model]
#
# Uses real tool calling: the model writes its final solution to disk via
# write_file(path, content) — the same pattern Cursor / Aider / Claude Code
# use. This frees the model to reason in message.content as long as it wants,
# then deliver the implementation in a structured call. Avoids the "ran out
# of tokens before closing the markdown fence" failure mode.
#
# Requires `--jinja` on each llama-server cmd in llm-swap.yaml so llama.cpp
# honors the `tools` parameter.
#
# Requires: ~/.venvs/eval with pytest + aiohttp + pygame installed.

evaluateOptions:
  timeoutMs: 600000

providers:
  - id: "openai:chat:{{ env.MODEL }}"
    config:
      apiBaseUrl: http://jason-server:11436/v1
      apiKey: llm-swap
      max_tokens: 8000
      # temp=0 makes llama.cpp's tool parser fail (it picks raw JSON over the
      # <|python_tag|> token). See promptfooconfig.tools.yaml for details.
      temperature: 0.2
      tool_choice: required
      tools:
        - type: function
          function:
            name: write_file
            description: |
              Write text content to a file in the workspace. Use this to deliver
              the final implementation — the file you write will be imported and
              tested.
            parameters:
              type: object
              properties:
                path:
                  type: string
                  description: Workspace-relative path (e.g. "solution.py").
                content:
                  type: string
                  description: The complete file contents as a single string (raw source, no markdown fences).
              required: [path, content]

prompts:
  - |
    {{task}}

    Write your solution to `solution.py` using the write_file tool.

tests: large-code-tests.yaml
