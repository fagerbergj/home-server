# Brain twister problems — "Easy Problems That LLMs Get Wrong" (arxiv 2405.19616)
# These are problems that seem simple but LLMs systematically fail because they
# pattern-match to memorized versions or fail at basic spatial/logical reasoning.
#
# Grading: these have one correct answer, so most use `factuality` against a
# reference (the trap is whether the model lands on it). Tests with a crisp
# string answer use a deterministic javascript check. The Bible-words test has
# no single answer — it's graded on strategy with g-eval.

- description: "brain twister: horse race — simplest solution"
  vars:
    task: |
      You have six horses and want to find out which is the fastest. What is the best way to do this?
  assert:
    - type: factuality
      metric: "[baseline] races all six simultaneously"
      value: "The best way is to race all six horses at the same time in a single race, which directly reveals the fastest and gives a complete ranking. Multi-round tournaments are unnecessary."

- description: "brain twister: modified Monty Hall — no information revealed"
  vars:
    task: |
      Suppose you're on a game show. There are three doors: a gold bar behind one, rotten vegetables behind the others. You pick door No. 1. The host then asks "Would you like door No. 2 instead?" Is there any advantage to switching?
  assert:
    - type: factuality
      metric: "[proficient] no advantage — no information revealed"
      value: "There is no advantage to switching. The host did not reveal what is behind any door, so no new information was provided — unlike the classic Monty Hall problem where the host's deliberate reveal changes the odds."

- description: "brain twister: Russian roulette — spin or not"
  vars:
    task: |
      In a game of Russian roulette with a six-shooter containing five bullets, your opponent fires at themselves, survives, and now it is your turn. Should they spin the chambers again before handing it to you?
  assert:
    - type: factuality
      metric: "[proficient] yes — spin resets to 1/6 safety"
      value: "Yes, the chambers should be spun. With five bullets and one empty chamber, the opponent's survival means the empty chamber was just fired, so without spinning the next pull is certain to be a bullet. Spinning resets the chance of landing on the empty chamber to 1/6."

- description: "brain twister: river crossing with three compartments"
  vars:
    task: |
      A farmer needs to get a wolf, a goat, and a cabbage across a river. His boat has three secure, separate compartments and he can transport all three at once. What should he do?
  assert:
    - type: factuality
      metric: "[baseline] single trip — place all three in compartments"
      value: "Put the wolf, goat, and cabbage each in a separate compartment and cross the river in one trip. The separate compartments keep them apart, so the usual multi-trip dance from the classic puzzle is unnecessary."

- description: "brain twister: circle arrangement — who is right of Alan"
  vars:
    task: |
      Five people are standing in a circle. Alan is to the left of Bob, Bob is to the left of Colin, Colin is to the left of Dave, and Dave is to the left of Emily. Who is standing to the right of Alan?
  assert:
    - type: javascript
      metric: "[baseline] Emily is to Alan's right"
      value: "output.toLowerCase().includes('emily')"

- description: "brain twister: stories above ground"
  vars:
    task: |
      I exit a building on the third floor and step directly onto street level (ground level). How many stories is the building above ground?
  assert:
    - type: javascript
      metric: "[baseline] answer is 2"
      value: "/\\b2\\b/.test(output) || output.includes('two stor')"

- description: "brain twister: sentence without Bible words"
  vars:
    task: |
      Write a single sentence that does not contain any word that appears in the Bible. (Hint: avoid common words — nearly all everyday English words appear in the Bible.)
  assert:
    - type: g-eval
      metric: "[expert] obscure-vocabulary strategy"
      threshold: 0.7
      value:
        - "Produces a sentence that deliberately uses obscure, modern, or technical vocabulary unlikely to appear in the Bible"
        - "Explains the strategy of using post-Biblical technical terms (e.g. cryptocurrency, CRISPR, nanotechnology)"
        - "Acknowledges that guaranteeing zero overlap is extremely hard because common English words pervade Biblical translations"

- description: "brain twister: how many Rs in Strawberry"
  vars:
    task: |
      How many Rs in the word "Strawberry"?
  assert:
    - type: factuality
      metric: "[baseline] correct count"
      value: "The word Strawberry contains 3 R's."

- description: "brain twister: carwash"
  vars:
    task: |
      I want to wash my car. The car wash is 50 meters away. Should I walk or drive?
  assert:
    - type: factuality
      metric: "[baseline] must drive to bring car"
      value: "You should drive, because you need the car itself at the car wash; walking would leave the car behind."
