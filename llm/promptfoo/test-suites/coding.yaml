# Multi-language debugging / code-review problems: each presents a code snippet
# with several planted defects (correctness, security, performance) in SQL,
# Docker, Go, Kotlin, and TypeScript. Graded with g-eval — each issue is a
# discrete 0-1 criterion (baseline → expert tiers), scored with chain-of-thought.
# Pass threshold is in configs/promptfooconfig.coding.yaml.

- description: "SQL: debug unexpected query results"
  vars:
    task: |
      I wrote this query to show all users with their order counts for 2024,
      but users with no orders aren't showing up at all, and I'm getting
      duplicate/wrong names for some users. I also can't filter out deleted
      users — they keep appearing. What's wrong with it?

      ```sql
      SELECT u.name, COUNT(o.id) as order_count
      FROM users u
      LEFT JOIN orders o ON u.id = o.user_id
      WHERE o.created_at > '2024-01-01'
      AND u.deleted_at = NULL
      GROUP BY u.id
      ORDER BY order_count DESC
      ```
  assert:
    - type: g-eval
      metric: "[baseline] NULL comparison bug"
      value:
        - "Identifies that `u.deleted_at = NULL` is always false"
        - "Explains NULL comparisons require `IS NULL`, not `= NULL`, because NULL is not equal to anything including itself"
        - "Explains that the WHERE clause therefore excludes all rows where deleted_at is NULL, which may be most or all rows"
    - type: g-eval
      metric: "[baseline] LEFT JOIN converted to INNER JOIN"
      value:
        - "Identifies that filtering on `o.created_at` (a right-side table column) in the WHERE clause is the problem"
        - "Explains this silently converts the LEFT JOIN to an INNER JOIN, excluding all users with no orders in the date range"
        - "Explains the fix — moving the filter into the JOIN condition instead of the WHERE clause"
    - type: g-eval
      metric: "[proficient] GROUP BY non-aggregate column"
      value:
        - "Identifies that `u.name` is selected but not included in the GROUP BY clause and not wrapped in an aggregate"
        - "Explains it's non-deterministic in permissive SQL modes"
        - "Explains it's an error in strict SQL mode"
    - type: g-eval
      metric: "[expert] missing index"
      value:
        - "Identifies that `o.user_id` (the join column) needs an index"
        - "Identifies that `o.created_at` (the filter column) likely needs an index for this query to perform acceptably at scale"
        - "Explains the performance impact of the missing indexes on this specific query pattern"

- description: "Docker: debug slow builds and security concerns"
  vars:
    task: |
      My Docker builds are painfully slow — every time I change a line of
      Python code it reinstalls all my dependencies from scratch. I'm also
      worried about security and noticed my container might be running as
      root. And sometimes my app doesn't shut down cleanly when I stop the
      container. Can you tell me what's wrong with this Dockerfile?

      ```dockerfile
      FROM ubuntu:latest
      RUN apt-get update && apt-get install -y python3 python3-pip
      COPY . /app
      RUN pip3 install -r /app/requirements.txt
      WORKDIR /app
      ENV DATABASE_URL=postgres://admin:secretpassword@db:5432/myapp
      CMD python3 app.py
      ```
  assert:
    - type: g-eval
      metric: "[baseline] secret in ENV"
      value:
        - "Identifies that hardcoding credentials in ENV bakes the secret into the image layer"
        - "Explains it's visible via `docker history` and any registry the image is pushed to"
        - "Explains the correct approach (runtime secret injection)"
    - type: g-eval
      metric: "[baseline] COPY ordering breaks layer cache"
      value:
        - "Identifies that `COPY . /app` before `pip3 install` is the problem"
        - "Explains this invalidates the pip layer on every code change, causing a full dependency reinstall"
        - "Explains the fix: copy requirements.txt first, run pip, then copy the rest"
    - type: g-eval
      metric: "[proficient] running as root"
      value:
        - "Identifies that there is no USER instruction"
        - "Explains the container process runs as root"
        - "Explains this is a security risk if the process or a dependency is compromised"
    - type: g-eval
      metric: "[expert] CMD shell vs exec form"
      value:
        - "Identifies that `CMD python3 app.py` uses shell form"
        - "Explains the process runs as a child of `/bin/sh`, so signals like SIGTERM are not forwarded, preventing graceful shutdown"
        - "Explains the fix is exec form: CMD [\"python3\", \"app.py\"]"

- description: "Go: debug wrong results in concurrent fetch"
  vars:
    task: |
      I have a Go function that fetches a list of URLs concurrently and
      returns the response bodies. It mostly works but sometimes returns
      wrong results — some slots in the results slice end up with the
      wrong body or are empty even when the request succeeded. I'm also
      seeing what looks like a file descriptor leak under load. Go 1.21.
      What's wrong with this code?

      ```go
      func fetchAll(urls []string) []string {
          results := make([]string, len(urls))
          var wg sync.WaitGroup
          for i, url := range urls {
              wg.Add(1)
              go func() {
                  defer wg.Done()
                  resp, err := http.Get(url)
                  if err != nil {
                    return
                  }
                  body, _ := io.ReadAll(resp.Body)
                  results[i] = string(body)
              }()
          }
          wg.Wait()
          return results
      }
      ```
  assert:
    - type: g-eval
      metric: "[baseline] loop variable capture"
      value:
        - "Identifies the loop variable capture bug — in Go 1.21, i and url are shared across goroutines"
        - "Explains all goroutines may read the last loop values, causing incorrect results"
        - "Explains the fix — capturing loop variables as function parameters in the goroutine closure"
    - type: g-eval
      metric: "[baseline] resp.Body never closed"
      value:
        - "Identifies that resp.Body is never closed"
        - "Explains this is a resource leak (file descriptor and memory) on every successful request"
        - "Explains why this matters rather than just naming the issue"
    - type: g-eval
      metric: "[proficient] io.ReadAll error ignored"
      value:
        - "Identifies that the io.ReadAll error is silently discarded with _"
        - "Explains the function may return partial or empty results without any indication of failure"
        - "Explains the impact on debugging and reliability"
    - type: g-eval
      metric: "[expert] no timeout or context"
      value:
        - "Identifies that http.Get has no timeout or context"
        - "Explains goroutines can hang indefinitely on slow or unresponsive servers"
        - "Explains there is no way for the caller to cancel in-flight requests"

- description: "Kotlin: debug NullPointerException in coroutine service"
  vars:
    task: |
      My Kotlin service is crashing with a NullPointerException that I can't
      reproduce consistently — it seems to happen more under load. I'm also
      seeing what might be a resource leak; memory creeps up over time even
      though I'm not holding onto data. Can you help me figure out what's
      wrong with this code?

      ```kotlin
      class UserService(private val repo: UserRepository) {
          private val scope = CoroutineScope(Dispatchers.IO)

          fun getUser(id: String): UserProfile {
              var result: UserProfile? = null
              scope.launch {
                  result = repo.findById(id)
              }
              Thread.sleep(1000)
              return result!!
          }

          fun shutdown() {
              scope.cancel()
          }
      }
      ```
  assert:
    - type: g-eval
      metric: "[baseline] race condition and NPE"
      value:
        - "Identifies the race between Thread.sleep and the coroutine"
        - "Explains the coroutine may not complete within 1000ms, so result!! will throw NullPointerException"
        - "Explains the mechanism rather than just saying it might be null"
    - type: g-eval
      metric: "[baseline] blocking function should be suspend"
      value:
        - "Identifies that getUser is a blocking function pretending to be async"
        - "Explains it should be a suspend function or return a Deferred rather than using Thread.sleep to wait"
        - "Explains why this is fundamentally wrong in the Kotlin coroutine model"
    - type: g-eval
      metric: "[proficient] shared mutable variable visibility"
      value:
        - "Identifies that result is a shared mutable variable between the Dispatchers.IO coroutine and the calling thread"
        - "Explains there is no visibility guarantee under the JVM memory model"
        - "Explains the practical consequences of the visibility gap"
    - type: g-eval
      metric: "[proficient] unscoped lifecycle"
      value:
        - "Identifies that scope has no lifecycle management"
        - "Explains it leaks if shutdown() is never called"
        - "Explains the caller has no way to know shutdown() is required"
    - type: g-eval
      metric: "[expert] silent coroutine failure"
      value:
        - "Identifies that if repo.findById throws an exception, the coroutine fails silently"
        - "Explains result stays null"
        - "Explains the caller gets an NPE with no indication of the actual error"

- description: "TypeScript: debug silent failures in event processor"
  vars:
    task: |
      My TypeScript event processor seems to silently fail sometimes — some
      delete operations don't run and I can't tell why, and downstream code
      is occasionally crashing on userId values it shouldn't be receiving.
      The TypeScript compiler is happy with everything. What's wrong here?

      ```typescript
      async function processEvents(events: unknown[]): Promise<void> {
        const results = await Promise.all(
          events.map(async (event) => {
            const e = event as { type: string; userId: string };
            if (e.type === "delete") {
              await deleteUser(e.userId);
            }
            return e.userId;
          })
        );
        console.log(`Processed ${results.length} events`);
      }
      ```
  assert:
    - type: g-eval
      metric: "[baseline] unsafe cast"
      value:
        - "Identifies that the `as { type: string; userId: string }` cast is unsafe"
        - "Explains there is no runtime validation, so any value (null, number, wrong-shaped object) passes through the type system unchecked"
        - "Explains the practical consequences of the unsafe cast"
    - type: g-eval
      metric: "[baseline] Promise.all fails fast"
      value:
        - "Identifies that Promise.all fails fast"
        - "Explains that if one deleteUser call rejects, the remaining promises are abandoned and the error propagates with no cleanup"
        - "Explains the cascading failure impact on the entire batch"
    - type: g-eval
      metric: "[proficient] no error handling on deleteUser"
      value:
        - "Identifies that there is no error handling on deleteUser"
        - "Explains that if it throws, the entire function rejects"
        - "Explains that any remaining delete operations are abandoned mid-batch"
    - type: g-eval
      metric: "[proficient] no input validation"
      value:
        - "Identifies that there is no validation of individual events"
        - "Explains nulls, primitives, or objects with unexpected shapes silently pass the type assertion"
        - "Explains they may cause runtime errors downstream"
    - type: g-eval
      metric: "[expert] results contain untrusted data"
      value:
        - "Identifies that the results array accumulates e.userId for all events including non-delete ones"
        - "Explains these may be undefined at runtime despite the type claiming string"
        - "Explains downstream consumers of this array would trust invalid data"
