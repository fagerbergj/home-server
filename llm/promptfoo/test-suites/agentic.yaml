# Agentic-coding suite — the model self-directs inside the oc-agent sandbox
# container (opencode loop: read/write code, run its own tests, fix). The custom
# provider (agentic/provider.js) runs opencode against env.MODEL on llm-swap and
# returns {passed,total,turns,tokens}. Two graded shapes here:
#   solo   — empty sandbox; the model writes solution.py from scratch; graded by
#            the HIDDEN pytest in test-suites/large-code/<test_name>/.
#   seeded — a real buggy repo (fixtures/repos/<seed>, a document-pipeline tree
#            at a fix commit's parent) is copied in; the model must FIND and fix
#            a latent bug with no failing test to point at it; graded by copying
#            the HIDDEN test (fixtures/hidden/<hidden>) to <dest> and running
#            <grade_cmd>. Run fixtures/prep.sh once first.
# Tasks pin the symptom/API; they do NOT mention the hidden tests — self-direction
# is the point. Run ON jason-server with cache off.

- description: "agentic: Trie data structure"
  vars:
    test_name: trie
    pass_threshold: 4
    task: |
      Implement a Trie (prefix tree) data structure in Python. Write your solution to a single file named solution.py.

      Expose a class `Trie` with:
        - insert(word: str) -> None
        - search(word: str) -> bool  (True only if the exact word was inserted)
        - starts_with(prefix: str) -> bool  (True if any inserted word has this prefix)
        - delete(word: str) -> bool  (True if the word was present and removed, else False)

      Use only the Python standard library.
  assert:
    - type: javascript
      metric: "[agentic] trie hidden pytest"
      value: "(() => { const r = JSON.parse(output); return r.total > 0 && (r.passed / r.total * 5) >= context.vars.pass_threshold; })()"

- description: "agentic: Markdown to HTML converter"
  vars:
    test_name: markdown
    pass_threshold: 3.75
    task: |
      Implement a markdown-to-HTML converter in Python. Write your solution to a single file named solution.py.

      Expose a function `to_html(markdown_text: str) -> str` that handles:
        - Headings: `# H1`, `## H2`, `### H3` -> `<h1>`, `<h2>`, `<h3>`
        - Bold: `**text**` -> `<strong>` (or `<b>`)
        - Italic: `*text*` -> `<em>` (or `<i>`)
        - Links: `[text](url)` -> `<a href="url">text</a>`
        - Unordered lists: `- item` -> `<ul><li>...</li></ul>`
        - Fenced code blocks: triple backticks -> `<pre><code>` (or `<code>`)
        - Plain paragraphs wrapped in `<p>`

      Use only the Python standard library.
  assert:
    - type: javascript
      metric: "[agentic] markdown hidden pytest"
      value: "(() => { const r = JSON.parse(output); return r.total > 0 && (r.passed / r.total * 5) >= context.vars.pass_threshold; })()"

- description: "agentic: SQLite job queue"
  vars:
    test_name: job_queue
    pass_threshold: 3.5
    task: |
      Implement a SQLite-backed job queue in Python. Write your solution to a single file named solution.py.

      Expose a class `JobQueue(db_path)` with:
        - enqueue(payload: dict) -> int  (returns job id)
        - dequeue() -> tuple[int, dict] | None  (FIFO order; None if empty)
        - complete(job_id: int) -> None  (removes the job from the queue)
        - fail(job_id: int) -> None  (increments retry counter; if it exceeds MAX_RETRIES, move to the DLQ)
        - dlq() -> list[dict]  (returns failed payloads)
        - MAX_RETRIES attribute (default 3)

      Use sqlite3 from the Python standard library.
  assert:
    - type: javascript
      metric: "[agentic] job_queue hidden pytest"
      value: "(() => { const r = JSON.parse(output); return r.total > 0 && (r.passed / r.total * 5) >= context.vars.pass_threshold; })()"

- description: "agentic: Rate-limited async HTTP client"
  vars:
    test_name: rate_limiter
    pass_threshold: 2.5
    task: |
      Implement an async, rate-limited HTTP client in Python. Write your solution to a single file named solution.py.

      Expose:
        async def fetch(urls: list[str], rate: int) -> list[dict]

      It must:
        - Issue at most `rate` requests per second across all URLs
        - Return one dict per URL: {"url": str, "status": int, "body": str} on success,
          or {"url": str, "error": str} after retries are exhausted
        - Retry transient failures (network errors, 5xx) with exponential backoff
        - Use aiohttp (already installed)
  assert:
    - type: javascript
      metric: "[agentic] rate_limiter hidden pytest"
      value: "(() => { const r = JSON.parse(output); return r.total > 0 && (r.passed / r.total * 5) >= context.vars.pass_threshold; })()"

- description: "agentic: Flappy Bird in pygame"
  vars:
    test_name: flappy_bird
    pass_threshold: 3
    task: |
      Implement a Flappy Bird clone in Python using pygame (already installed). Write your solution to a single file named solution.py.

      Expose these classes (importable from the module):
        - Bird — attributes: x, y, velocity; methods: update() (applies gravity), jump() (upward impulse), draw(surface)
        - Pipe(x: int, gap_y: int) — attributes: x, gap_y, width; methods: update() (moves left), draw(surface), collides_with(bird) -> bool
        - Game — attributes: bird, pipes (list), score, game_over; methods: update() (advances one frame), draw(surface)

      Do not call pygame.display.set_mode or run a main loop at import time — the classes will be instantiated directly.
  assert:
    - type: javascript
      metric: "[agentic] flappy_bird hidden pytest"
      value: "(() => { const r = JSON.parse(output); return r.total > 0 && (r.passed / r.total * 5) >= context.vars.pass_threshold; })()"

# ── seeded bugfix: real latent bugs from document-pipeline's own history ──
# The buggy tree's existing tests all pass, so nothing points at the defect —
# the model must find it from the symptom alone. Graded by the test the real fix
# shipped (hidden until grade time). Full pass required.

- description: "bugfix: empty embedding input rejected (dp dbba582)"
  vars:
    mode: seeded
    seed: dp-empty-embed
    hidden: dp-empty-embed/zz_bugcheck_test.go
    dest: server/store/openai/zz_bugcheck_test.go
    grade_cmd: "go test ./server/store/openai -run TestGenerateEmbed_SubstitutesEmptyInput -v -count=1"
    grade_parse: gotest
    task: |
      This is the document-pipeline repository, a Go service. Bug report from
      production: generating embeddings fails whenever a document chunk has no
      text — the embedding server rejects the request because the input is
      empty. Locate the bug in the OpenAI-compatible embeddings client and fix
      it so empty input is handled gracefully. Build and test your change.
  assert:
    - type: javascript
      metric: "[bugfix] hidden regression test passes"
      value: "(() => { const r = JSON.parse(output); return r.total > 0 && r.passed === r.total; })()"

- description: "bugfix: stage-data input lookup returns empty (dp 63647ca)"
  vars:
    mode: seeded
    seed: dp-stage-input
    hidden: dp-stage-input/zz_bugcheck_test.go
    dest: server/core/zz_bugcheck_test.go
    grade_cmd: "go test ./server/core -run TestFindInput_PrefersNonEmpty -v -count=1"
    grade_parse: gotest
    task: |
      This is the document-pipeline repository, a Go service. Bug report:
      audio uploads intermittently fail the "clarify" stage — the model replies
      "I have not received any raw transcription text to process." even though
      transcription succeeded and produced text. The stage-data input lookup is
      selecting the wrong value across pipeline stages. Find and fix the bug.
      Build and test your change.
  assert:
    - type: javascript
      metric: "[bugfix] hidden regression test passes"
      value: "(() => { const r = JSON.parse(output); return r.total > 0 && r.passed === r.total; })()"

# ── repo summarization: explore the codebase, write an accurate overview ──
# Doc files are pruned from the seed so the model can't crib an existing summary;
# judge-graded on accuracy. (Provider captures the written file as output.)
- description: "summarize: write ARCHITECTURE.md for document-pipeline"
  vars:
    mode: summarize
    seed: dp-summary
    capture: file:ARCHITECTURE.md
    task: |
      This is the document-pipeline repository, a Go service (its existing
      top-level docs have been removed). Explore the codebase and write a concise
      ARCHITECTURE.md to the repository root that an engineer joining the project
      could read in five minutes: what the service does, its main components and
      how they fit together (the domain core, its port interfaces, the storage
      adapters, the HTTP API, and the document-processing pipeline), and the key
      top-level directories. Be accurate and specific to THIS codebase; do not
      invent components that aren't present.
  assert:
    - type: g-eval
      metric: "[summary] accurate architecture overview"
      threshold: 0.7
      value:
        - "Accurately describes the ports-and-adapters structure: a domain core (server/core) that depends on port interfaces, with swappable store adapters under server/store/* (e.g. sqlite/postgres, qdrant, openai)"
        - "Describes the document-processing pipeline stages and the HTTP API layer, and names real top-level directories (server, cmd, config, db)"
        - "Does not invent components or technologies absent from the repo; unclear things are omitted or hedged rather than fabricated"

# ── PR review: read a diff with planted defects, report the real ones ──
# Judge-graded on whether the review catches the planted issues without
# hallucinating. The diff is dropped at /work/PR.diff; output = the model's
# final review text.
- description: "review: flag bugs in a new search-handler PR"
  vars:
    mode: review
    seed: dp-summary
    diff: reviews/search-handler.diff
    capture: final_text
    task: |
      This is the document-pipeline repository. A teammate opened a pull request;
      the diff is at /work/PR.diff. Review it as you would a real PR: read the
      diff (and the surrounding code for context if helpful) and report the
      concrete problems — correctness, security, and resource-handling — with a
      short explanation of each and how you'd fix it. Be specific, and only flag
      genuine issues that are actually present.
  assert:
    - type: g-eval
      metric: "[review] catches planted issues without hallucinating"
      threshold: 0.7
      value:
        - "Identifies the SQL injection: the user-supplied query value is interpolated directly into the SQL string (fmt.Sprintf / string concatenation) instead of using a parameterized query with placeholders"
        - "Identifies the resource leak: the *sql.Rows returned by db.Query is never closed (missing defer rows.Close())"
        - "Identifies at least one of: the ignored error from rows.Scan, or the unchecked rows.Err() after the iteration loop"
        - "The review is grounded in the actual diff and does not fabricate issues that are not present in the code"
