# Blind A/B comparison: all chat models run the same prompts, Selene judge picks
# the best response anonymously. Invoked by eval.sh after per-model evals.
# Keep this provider list in sync with the chat models in eval-config.yaml.
#
# COMPARE_TESTS_FILE env var picks which suite's tests to compare on.
# Examples: architecture-tests.yaml, calibration-tests.yaml, etc.

evaluateOptions:
  timeoutMs: 600000

providers:
  - id: openai:chat:gpt-oss-120b
    config:
      apiBaseUrl: http://jason-server:11436/v1
      apiKey: llm-swap
  - id: openai:chat:qwen3.6-35b
    config:
      apiBaseUrl: http://jason-server:11436/v1
      apiKey: llm-swap
  - id: openai:chat:qwen3.5-9b
    config:
      apiBaseUrl: http://jason-server:11436/v1
      apiKey: llm-swap
  - id: openai:chat:qwen3-coder-next
    config:
      apiBaseUrl: http://jason-server:11436/v1
      apiKey: llm-swap

prompts:
  - "{{task}}"

tests: "{{ env.COMPARE_TESTS_FILE }}"

defaultTest:
  # GPU judge via llm-swap (model key "selene"). The compare phase runs off
  # cached model outputs, so the GPU has no model-under-test resident and
  # Selene judges at full speed. Per-suite configs still use the CPU judge
  # on :11437 (those run alongside the model under test).
  options:
    provider:
      id: openai:chat:selene
      config:
        apiBaseUrl: http://jason-server:11436/v1
        apiKey: llm-swap
    transform: "output.replace(/^(Thinking:|<think>)[\\s\\S]*?(<\\/think>|\\n\\n)/i, '').trim()"
  assert:
    - type: select-best
      value: >
        Pick the single best response based on accuracy, completeness, and clarity.
        Ignore presentation differences (markdown, length) and focus on whether the
        substance is correct and addresses the prompt fully.
