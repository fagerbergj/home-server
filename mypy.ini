[mypy]
python_version = 3.11
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
strict_equality = True
check_untyped_defs = True
ignore_missing_imports = True
# Applies to directory scans; CI also filters these vendored trees in its git diff pathspec.
exclude = ^(jaison/llm/vllm-patches|torrent/search)/
