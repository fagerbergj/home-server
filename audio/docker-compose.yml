services:
  faster-whisper:
    build: ./pyannote-diarize
    image: pyannote-diarize:latest
    container_name: faster-whisper
    ports:
      - "8005:8000"
    env_file:
      - ../.env
    environment:
      - WHISPER_MODEL_PATH=/models/ggml-large-v3.bin
      - VAD_MODEL_PATH=/models/ggml-silero-v5.1.2.bin
      # HF_TOKEN must be set in ../.env. See README for setup.
      - HF_TOKEN=${HF_TOKEN}
      # Switch HIP signal completion from busy-poll to interrupt-driven.
      # Without this, `import torch` initializes the ROCm runtime and a HIP
      # worker thread spins on a CPU core forever, even when idle.
      - HSA_ENABLE_INTERRUPT=1
    volumes:
      - ./model-cache:/root/.cache
      - /mnt/cache/whisper-models:/models:ro
    # NeMo's DataLoader workers exchange tensors via /dev/shm. Docker's default
    # 64 MB is way too small and fails with "Resource temporarily unavailable".
    shm_size: '2gb'
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "44"    # video
      - "993"   # render
    restart: unless-stopped
