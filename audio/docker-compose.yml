services:
  faster-whisper:
    build: ./nemo-diarize
    image: nemo-diarize:latest
    container_name: faster-whisper
    ports:
      - "8005:8000"
    env_file:
      - ../.env
    environment:
      - DEFAULT_WHISPER_MODEL=${WHISPER_MODEL:-Systran/faster-whisper-large-v3}
    volumes:
      - ./model-cache:/root/.cache
    # NeMo's DataLoader workers exchange tensors via /dev/shm. Docker's default
    # 64 MB is way too small and fails with "Resource temporarily unavailable".
    shm_size: '2gb'
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
