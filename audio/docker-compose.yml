services:
  faster-whisper:
    build: ./nemo-diarize
    image: nemo-diarize:latest
    container_name: faster-whisper
    ports:
      - "8005:8000"
    env_file:
      - ../.env
    environment:
      - DEFAULT_WHISPER_MODEL=${WHISPER_MODEL:-Systran/faster-whisper-large-v3}
    volumes:
      - ./model-cache:/root/.cache
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
