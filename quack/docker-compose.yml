# quack — GitHub PR-review bot (github.com/fagerbergj/quack).
# Pulls the CI-published image from GHCR (quack's cd.yaml pushes on a version tag:
# `git tag v0.1.0 && git push origin v0.1.0` → :latest moves). Watchtower watches
# this container (it's NOT in updater/'s WATCHTOWER_DISABLE list) and auto-updates
# it when a new release moves :latest. The GHCR package must be PUBLIC to pull
# without credentials.
# Ingress: NPM (TLS) → Traefik `api` entrypoint (:8090) → this container on
# api_gateway. The /api/v1/github/webhook path is PUBLIC (GitHub HMAC-verifies);
# the rest of the UI/API sits behind Authentik. Reuses llm-swap + qdrant from the
# `llm` compose via the external llm_default network. Brings its own postgres.
services:
  quack:
    image: ghcr.io/fagerbergj/quack:latest
    container_name: quack
    command: ["server", "run"]
    env_file:
      - ../.env
    environment:
      QUACK_CONFIG: /config/quack.yaml
      QUACK_DATABASE_URL: postgres://quack:${QUACK_DB_PASSWORD}@quack-postgres:5432/quack?sslmode=disable
      # LLM (llm-swap on the llm_default network). Empty key — llm-swap doesn't auth.
      QUACK_LLM_ENDPOINT: http://llm-swap:11436/v1
      QUACK_LLM_API_KEY: ""
      # Orchestrator/researcher on the 35b (strong conversational intent + planning;
      # coder-as-orch posted "please clarify" menus instead of reviewing). It doesn't
      # co-reside with the 48GB coder, so a review costs ONE 35b->coder swap — fine now
      # that gemma is CPU-only and never swaps. The 35b runs at full 256K context.
      QUACK_ORCH_MODEL: qwen3.6-35b
      QUACK_RESEARCHER_MODEL: qwen3.6-35b
      QUACK_CODER_MODEL: qwen3-coder-next
      QUACK_JUDGE_MODEL: gemma4-26b-a4b
      QUACK_IMAGE_MODEL: qwen3-vl-32b
      QUACK_MEDIA_MODEL: qwen3-omni-30b
      QUACK_COMPACTION_ENABLED: "true"
      # Compaction on the coder (GPU, co-resident, fast). gemma is CPU-only now (~5min
      # per call) so it's the JUDGE ONLY — compaction fires too often to sit on CPU.
      QUACK_COMPACTION_MODEL: qwen3-coder-next
      QUACK_EMBED_MODEL: qwen3-embed
      # Semantic memory — reuse the existing qdrant (llm_default), gRPC port.
      QUACK_QDRANT_URL: qdrant:6334
      # Web search (config uses kind: exa).
      QUACK_EXA_API_KEY: ${QUACK_EXA_API_KEY}
      # GitHub App (private key mounted below; client_id + webhook secret from .env).
      QUACK_GITHUB_APP_CLIENT_ID: ${QUACK_GITHUB_APP_CLIENT_ID}
      QUACK_GITHUB_APP_WEBHOOK_SECRET: ${QUACK_GITHUB_APP_WEBHOOK_SECRET}
      QUACK_WORKSPACE_ROOT: /workspace
    volumes:
      - ./quack.yaml:/config/quack.yaml:ro
      - ${QUACK_GITHUB_APP_PRIVATE_KEY_PATH}:/run/secrets/quack-app.pem:ro
      - quack-workspace:/workspace
    depends_on:
      quack-postgres:
        condition: service_healthy
      quack-init:
        condition: service_completed_successfully
    networks:
      - default
      - api_gateway
      - llm_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.quack.loadbalancer.server.port=8080"
      # PUBLIC webhook — GitHub can't SSO; it HMAC-signs. The Path rule out-prioritises
      # the Host-only router below, so this bypasses Authentik.
      - "traefik.http.routers.quack-webhook.rule=Host(`quack.jasonfagerberg.duckdns.org`) && Path(`/api/v1/github/webhook`)"
      - "traefik.http.routers.quack-webhook.entrypoints=api"
      - "traefik.http.routers.quack-webhook.service=quack"
      # Everything else (UI + API) behind Authentik SSO.
      - "traefik.http.routers.quack.rule=Host(`quack.jasonfagerberg.duckdns.org`)"
      - "traefik.http.routers.quack.entrypoints=api"
      - "traefik.http.routers.quack.service=quack"
      - "traefik.http.routers.quack.middlewares=authentik@file"
    restart: unless-stopped

  # One-shot: a freshly-created named volume is root-owned, but quack runs as the
  # distroless nonroot uid 65532 and must write its clones/jail under /workspace.
  # chown it before quack starts. Idempotent; exits immediately on subsequent runs.
  quack-init:
    image: alpine
    command: ["chown", "-R", "65532:65532", "/workspace"]
    volumes:
      - quack-workspace:/workspace
    restart: "no"

  quack-postgres:
    image: postgres:17-alpine
    container_name: quack-postgres
    environment:
      POSTGRES_USER: quack
      POSTGRES_PASSWORD: ${QUACK_DB_PASSWORD}
      POSTGRES_DB: quack
    volumes:
      - quack-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quack -d quack"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  default:
  api_gateway:
    external: true
  llm_default:
    external: true

volumes:
  quack-workspace:
  quack-pg:
