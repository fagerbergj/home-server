# quack — GitHub PR-review bot (github.com/fagerbergj/quack).
# PINNED to a release tag (quack's cd.yaml publishes an immutable X.Y.Z on `git tag
# vX.Y.Z && git push`). A pinned tag does NOT move, so Watchtower does not auto-update
# it — bump the tag below and `docker compose up -d` to deploy a new release. (Switch
# back to `:latest` to resume continuous auto-deploy of every merge to main.) The GHCR
# package must be PUBLIC to pull without credentials.
# Ingress: NPM (TLS) → Traefik `api` entrypoint (:8090) → this container on
# api_gateway. The /github/webhook path is PUBLIC (GitHub HMAC-verifies);
# the rest of the UI/API sits behind Authentik. Reuses llm-swap + qdrant from the
# `llm` compose via the external llm_default network. Brings its own postgres.
services:
  quack:
    image: ghcr.io/fagerbergj/quack:0.114.0
    container_name: quack
    init: true
    command: ["server", "run"]
    # Values interpolate from quack/.env, which compose reads by default; only
    # what is named here reaches the container. The private-key PATH is for the
    # host mount below, so it stays out of the container's env.
    environment:
      QUACK_CONFIG: /config/quack.yaml
      # debug while we iterate on delivery/loop behavior (per-round vetting +
      # compaction trace); drop back to info once the flow is stable.
      QUACK_LOG_LEVEL: debug
      # OTel emission (0.6.7): traces+metrics to the monitoring stack's collector
      # (otel-collector joins llm_default). Read path = Grafana / Tempo TraceQL.
      QUACK_OTEL_ENABLED: "true"
      QUACK_OTEL_OTLP_ENDPOINT: http://otel-collector:4318
      # Langfuse prompt store: host port of langfuse-web (langfuse_default is not
      # joined here); keys in .env, the pair the otel-collector already uses.
      LANGFUSE_BASE_URL: http://192.168.50.186:3008
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      QUACK_DATABASE_URL: postgres://quack:${QUACK_DB_PASSWORD}@quack-postgres:5432/quack?sslmode=disable
      # LLM (llm-swap-media on llm_default; peers to jaison). Empty key — llm-swap doesn't auth.
      QUACK_LLM_ENDPOINT: http://llm-swap:11436/v1   # llm-swap-media (3090 + peer to jaison)
      QUACK_LLM_API_KEY: ""
      # One model (qwen3.8-27b) for orchestrator/researcher/coder - dense hybrid
      # w/ MTP, beats qwen3.6-35b on GPQA/LiveCodeBench/SWE-bench-Pro despite
      # being smaller. Native vision. Co-resides with the GPU gemma judge at
      # full 262144 context - see llm-swap.yaml's qwen3.8-27b comment.
      QUACK_ORCH_MODEL: qwen3.8-27b
      QUACK_PUBLIC_URL: https://quack.jasonfagerberg.duckdns.org
      QUACK_TIMEZONE: America/Chicago
      QUACK_RESEARCHER_MODEL: qwen3.8-27b
      QUACK_CODER_MODEL: qwen3.8-27b
      QUACK_JUDGE_MODEL: qwen3.8-27b   # same id as the workers; vLLM serves 2 sequences
      QUACK_MEDIA_MODEL: qwen3-omni-30b
      QUACK_COMPACTION_ENABLED: "true"
      # Compaction on gemma (GPU, co-resident with the 35b workers set). During a 35b
      # run (plan/research/conversational) gemma is already loaded, so compaction is
      # swap-free. Coder-as-compactor forced a 56GB coder load (evicting the workers)
      # on every 35b run that compacted — pure swap waste. (During a coder run gemma
      # swaps in, but it already does for judging; and the coder never loads just to compact.)
      QUACK_COMPACTION_MODEL: qwen3.8-27b      # same model as the workers: no swap, shares the prefix cache
      QUACK_EMBED_MODEL: qwen3-embed
      # Semantic memory — reuse the existing qdrant (llm_default), gRPC port.
      QUACK_QDRANT_URL: qdrant:6334
      # Web search (config uses kind: exa).
      QUACK_EXA_API_KEY: ${QUACK_EXA_API_KEY}
      # GitHub App (private key mounted below; client_id + webhook secret from .env).
      QUACK_GITHUB_APP_CLIENT_ID: ${QUACK_GITHUB_APP_CLIENT_ID}
      QUACK_GITHUB_APP_WEBHOOK_SECRET: ${QUACK_GITHUB_APP_WEBHOOK_SECRET}
      QUACK_WORKSPACE_ROOT: /workspace
      # rmfakecloud UI account for extensions.remarkable (values in quack/.env)
      RMFAKECLOUD_EMAIL: ${RMFAKECLOUD_EMAIL}
      RMFAKECLOUD_PASSWORD: ${RMFAKECLOUD_PASSWORD}
      # pprof for diagnosing the post-plan hang; loopback-published only (see ports).
      QUACK_PPROF_ADDR: ":6060"
    ports:
      - "127.0.0.1:6060:6060"   # pprof, host-loopback only — never exposed publicly
      - "100.64.0.6:18080:8080" # quack API on the tailnet interface only — first-party
                                 # clients (quack CLI) over the tailnet; the tailnet is the
                                 # auth boundary here, Authentik keeps guarding the public UI
    volumes:
      - ./quack.yaml:/config/quack.yaml:ro
      - ${QUACK_GITHUB_APP_PRIVATE_KEY_PATH}:/run/secrets/quack-app.pem:ro
      - quack-workspace:/workspace
      # Android/JDK toolchain for the code agents + gate checks (quack 0.15.0
      # workspace.exec_path/env). Provisioned out-of-band, not by this compose -
      # declared external so a `down -v` can never wipe several GB of SDK.
      - quack-toolchains:/toolchains
    depends_on:
      quack-postgres:
        condition: service_healthy
      quack-init:
        condition: service_completed_successfully
    networks:
      - default
      - api_gateway
      - llm_default
    # Docker's embedded DNS on this host intermittently fails to resolve container
    # names for a few seconds (several times a day, each killing an in-flight run);
    # pin postgres by IP so quack never depends on that resolver.
    extra_hosts:
      - "quack-postgres:172.23.0.100"
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.quack.loadbalancer.server.port=8080"
      # The public /github/webhook route moved to quack-v1-github (D52).
      # Everything else (UI + API) behind Authentik SSO.
      - "traefik.http.routers.quack.rule=Host(`quack.jasonfagerberg.duckdns.org`)"
      - "traefik.http.routers.quack.entrypoints=api"
      - "traefik.http.routers.quack.service=quack"
      - "traefik.http.routers.quack.middlewares=authentik@file"
    # quack's SIGTERM drain (server.shutdown_grace_seconds, 20s) needs Docker to
    # wait longer than its 10s default before SIGKILL.
    stop_grace_period: 30s
    restart: unless-stopped

  # One-shot: a freshly-created named volume is root-owned, but quack runs as the
  # distroless nonroot uid 65532 and must write its clones/jail under /workspace.
  # chown it before quack starts. Idempotent; exits immediately on subsequent runs.
  quack-init:
    image: alpine
    command: ["chown", "-R", "65532:65532", "/workspace"]
    volumes:
      - quack-workspace:/workspace
    restart: "no"

  # quack v1 (fagerbergj/quack, v1/): the distributor runs each PR's session as a child process; the GitHub service
  # below takes the webhook and hands sessions PR data and git credentials. Both reuse v0's App values from .env.
  quack-v1:
    image: ghcr.io/fagerbergj/quack:v1-48be40d4350380f0be67e3524e3e9a19a4e12a2d
    container_name: quack-v1
    init: true
    command: ["node", "packages/distributor/src/main.ts"]
    ports:
      - "100.64.0.6:18081:8080" # v1 UI and API on the tailnet interface only; the tailnet is the auth boundary here
    environment:
      QUACK_DATA_DIR: /data
      QUACK_CONFIG: /config/deployment.json
      QUACK_AGENT: /app/agents/reviewer/agent.json
      # Agents a session can name with ?agent=; the reviewer stays the default for the GitHub service.
      QUACK_AGENTS_DIR: /app/agents
      QUACK_GH_SERVICE_URL: http://quack-v1-github:8090
      QUACK_GH_SERVICE_TOKEN: ${QUACK_V1_SERVICE_TOKEN}
      # The researcher's web_search, the same Exa key v0 uses.
      QUACK_EXA_API_KEY: ${QUACK_EXA_API_KEY}
      # The reMarkable ingest workflow reads documents and the topic list through the reMarkable service.
      QUACK_REMARKABLE_URL: http://quack-v1-remarkable:8093
      QUACK_REMARKABLE_TOKEN: ${QUACK_V1_SERVICE_TOKEN}
      # The Sleeper lineup workflow reads league data through the Sleeper service.
      QUACK_SLEEPER_URL: http://quack-v1-sleeper:8092
      QUACK_SLEEPER_TOKEN: ${QUACK_V1_SERVICE_TOKEN}
      # The page reaches extension services through /apps/<name>/*; the distributor adds the token.
      QUACK_SCHEDULES_TOKEN: ${QUACK_V1_SERVICE_TOKEN}
      QUACK_APPS: '{"sleeper":{"url":"http://quack-v1-sleeper:8092","tokenEnv":"QUACK_SLEEPER_TOKEN"},"remarkable":{"url":"http://quack-v1-remarkable:8093","tokenEnv":"QUACK_REMARKABLE_TOKEN"},"schedules":{"url":"http://quack-v1-schedules:8091","tokenEnv":"QUACK_SCHEDULES_TOKEN"},"github":{"url":"http://quack-v1-github:8090","tokenEnv":"QUACK_GH_SERVICE_TOKEN"}}'
      # Every session takes a model slot from quack-v1-slots before a generation; unreachable means no gate.
      QUACK_SLOTS_URL: http://quack-v1-slots:8092
      QUACK_SLOTS_TOKEN: ${QUACK_V1_SERVICE_TOKEN}
      # Enables DELETE /sessions/:key for the retention sweep in quack-v1-schedules (D24).
      QUACK_ADMIN_TOKEN: ${QUACK_V1_SERVICE_TOKEN}
      # llm-swap doesn't auth, but a provider needs a key set to be used.
      QUACK_LOCAL_API_KEY: none
      QUACK_CLEF_API_KEY: none
      # Eval (packages/eval) keeps datasets and experiments in the Langfuse v0 uses.
      LANGFUSE_BASE_URL: http://192.168.50.186:3008
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    volumes:
      - ./v1-deployment.json:/config/deployment.json:ro
      - quack-v1-data:/data
    depends_on:
      quack-v1-init:
        condition: service_completed_successfully
    networks:
      - default
      - llm_default
      - api_gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.quack-v1.loadbalancer.server.port=8080"
      # The v1 UI and API at /v1 behind Authentik SSO until v0 retires; PathPrefix out-prioritises v0's Host-only router.
      - "traefik.http.routers.quack-v1.rule=Host(`quack.jasonfagerberg.duckdns.org`) && PathPrefix(`/v1`)"
      - "traefik.http.routers.quack-v1.entrypoints=api"
      - "traefik.http.routers.quack-v1.service=quack-v1"
      - "traefik.http.routers.quack-v1.middlewares=authentik@file,quack-v1-slash,quack-v1-strip"
      # The bundle's URLs are page-relative, so /v1 must end in a slash before the prefix is stripped.
      - "traefik.http.middlewares.quack-v1-slash.redirectregex.regex=^(.*)/v1$$"
      - "traefik.http.middlewares.quack-v1-slash.redirectregex.replacement=$${1}/v1/"
      - "traefik.http.middlewares.quack-v1-strip.stripprefix.prefixes=/v1"
    # Sessions stop on SIGTERM and resume from their logs on boot.
    stop_grace_period: 30s
    restart: unless-stopped

  quack-v1-github:
    image: ghcr.io/fagerbergj/quack:v1-48be40d4350380f0be67e3524e3e9a19a4e12a2d
    container_name: quack-v1-github
    init: true
    # The uid v0 reads the App key as.
    user: "65532:65532"
    command: ["node", "packages/github/src/main.ts"]
    environment:
      QUACK_GH_APP_ID: ${QUACK_GITHUB_APP_CLIENT_ID}
      QUACK_GH_PRIVATE_KEY_FILE: /run/secrets/quack-app.pem
      QUACK_GH_WEBHOOK_SECRET: ${QUACK_GITHUB_APP_WEBHOOK_SECRET}
      QUACK_GH_SERVICE_TOKEN: ${QUACK_V1_SERVICE_TOKEN}
      QUACK_DISTRIBUTOR_URL: http://quack-v1:8080
      # A trusted `/fix` comment runs this agent; it pushes only after a person approves.
      QUACK_GH_IMPLEMENTER_AGENT: implementer
      # Webhook redelivery keeps its high-water mark here, so a restart doesn't re-scan or lose its place.
      QUACK_DATA_DIR: /data
    volumes:
      - ${QUACK_GITHUB_APP_PRIVATE_KEY_PATH}:/run/secrets/quack-app.pem:ro
      - quack-v1-github-data:/data
    networks:
      - default
      - api_gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.quack-v1-github.loadbalancer.server.port=8090"
      - "traefik.http.middlewares.quack-v1-webhook.replacepath.path=/webhook"
      # PUBLIC webhook — GitHub can't SSO; it HMAC-signs. The Path rule out-prioritises v0's Host-only router, so
      # this bypasses Authentik.
      - "traefik.http.routers.quack-webhook.rule=Host(`quack.jasonfagerberg.duckdns.org`) && Path(`/github/webhook`)"
      - "traefik.http.routers.quack-webhook.entrypoints=api"
      - "traefik.http.routers.quack-webhook.service=quack-v1-github"
      - "traefik.http.routers.quack-webhook.middlewares=quack-v1-webhook"
    restart: unless-stopped

  quack-v1-init:
    image: alpine
    command: ["sh", "-c", "chown -R 1000:1000 /data /services && chown -R 65532:65532 /github"]
    volumes:
      - quack-v1-data:/data
      - quack-v1-services-data:/services
      - quack-v1-github-data:/github
    restart: "no"

  # v1 schedules: durable timers that submit to session keys (SCH-1..4). Internal only.
  quack-v1-schedules:
    image: ghcr.io/fagerbergj/quack:v1-48be40d4350380f0be67e3524e3e9a19a4e12a2d
    container_name: quack-v1-schedules
    init: true
    command: ["node", "packages/schedules/src/main.ts"]
    environment:
      # Daily sweep: deletes sessions idle longer than their agent's retention (reviewer 14 days, Sleeper 30).
      QUACK_RETENTION_SWEEP: "1"
      QUACK_ADMIN_TOKEN: ${QUACK_V1_SERVICE_TOKEN}
      QUACK_DISTRIBUTOR_URL: http://quack-v1:8080
      QUACK_SCHEDULES_TOKEN: ${QUACK_V1_SERVICE_TOKEN}
      QUACK_SCHEDULES_DB: /data/schedules.db
      QUACK_AGENTS_DIR: /app/agents
    volumes:
      - quack-v1-services-data:/data
    depends_on:
      quack-v1-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # v1 reMarkable service half: browses rmfakecloud and submits picked documents for ingest; nothing is
  # ingested automatically (RMK-1). Internal only; reaches rmfakecloud over api_gateway like v0 does.
  quack-v1-remarkable:
    image: ghcr.io/fagerbergj/quack:v1-48be40d4350380f0be67e3524e3e9a19a4e12a2d
    container_name: quack-v1-remarkable
    init: true
    command: ["node", "packages/remarkable/src/main.ts"]
    environment:
      QUACK_REMARKABLE_TOKEN: ${QUACK_V1_SERVICE_TOKEN}
      QUACK_REMARKABLE_DB: /data/remarkable.db
      QUACK_DISTRIBUTOR_URL: http://quack-v1:8080
      RMFAKECLOUD_URL: http://rmfakecloud:3000
      RMFAKECLOUD_EMAIL: ${RMFAKECLOUD_EMAIL}
      RMFAKECLOUD_PASSWORD: ${RMFAKECLOUD_PASSWORD}
    volumes:
      - quack-v1-services-data:/data
    networks:
      - default
      - api_gateway
    depends_on:
      quack-v1-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # v1 Sleeper service half: read-only Sleeper API, league snapshots, job schedules. Internal only.
  quack-v1-sleeper:
    image: ghcr.io/fagerbergj/quack:v1-48be40d4350380f0be67e3524e3e9a19a4e12a2d
    container_name: quack-v1-sleeper
    init: true
    command: ["node", "packages/sleeper/src/main.ts"]
    environment:
      QUACK_SLEEPER_TOKEN: ${QUACK_V1_SERVICE_TOKEN}
      QUACK_SLEEPER_DB: /data/sleeper.db
      # The same league and owner v0's sleeper extension uses (quack.yaml extensions.sleeper).
      QUACK_SLEEPER_LEAGUE: "1356407594683482112"
      QUACK_SLEEPER_OWNER: jffagerberg
      QUACK_SCHEDULES_URL: http://quack-v1-schedules:8091
      QUACK_SCHEDULES_TOKEN: ${QUACK_V1_SERVICE_TOKEN}
      QUACK_DISTRIBUTOR_URL: http://quack-v1:8080
    volumes:
      - quack-v1-services-data:/data
    depends_on:
      quack-v1-init:
        condition: service_completed_successfully
    restart: unless-stopped

  quack-v1-slots:
    image: ghcr.io/fagerbergj/quack:v1-48be40d4350380f0be67e3524e3e9a19a4e12a2d
    container_name: quack-v1-slots
    init: true
    command: ["node", "packages/slots/src/main.ts"]
    environment:
      QUACK_SLOTS_TOKEN: ${QUACK_V1_SERVICE_TOKEN}
      # Runs at once per provider id in v1-deployment.json; the rest queue FIFO. 6 is llm-swap's stream width.
      QUACK_SLOTS_LIMITS: '{"local":6}'
      QUACK_SLOTS_DB: /data/slots.db
    volumes:
      - quack-v1-services-data:/data
    depends_on:
      quack-v1-init:
        condition: service_completed_successfully
    restart: unless-stopped

  quack-postgres:
    image: postgres:17-alpine
    container_name: quack-postgres
    environment:
      POSTGRES_USER: quack
      POSTGRES_PASSWORD: ${QUACK_DB_PASSWORD}
      POSTGRES_DB: quack
    volumes:
      - quack-pg:/var/lib/postgresql/data
    networks:
      default:
        ipv4_address: 172.23.0.100   # matches quack's extra_hosts pin above
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quack -d quack"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.23.0.0/16   # the subnet quack_default already has; fixed so the postgres pin is stable
  api_gateway:
    external: true
  llm_default:
    external: true

volumes:
  quack-workspace:
  quack-pg:
  quack-v1-data:
  quack-v1-services-data:
  quack-v1-github-data:
  quack-toolchains:
    external: true
