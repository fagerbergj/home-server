name: lint

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
      - name: Lint and typecheck changed Python files
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.py' ':!jaison/llm/vllm-patches/**')
          if [ "${#files[@]}" -gt 0 ]; then
            uvx ruff check "${files[@]}"
            uvx mypy "${files[@]}"
          fi

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint changed shell scripts with ShellCheck
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.sh')
          if [ "${#files[@]}" -gt 0 ]; then
            shellcheck "${files[@]}"
          fi
