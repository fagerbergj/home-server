version: 2
updates:
  # Base images for the compose stack — the reason this file exists is CVE
  # visibility on images we pin (traefik, authentik, postgres, clickhouse...).
  - package-ecosystem: docker-compose
    directories:
      - "/**/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
