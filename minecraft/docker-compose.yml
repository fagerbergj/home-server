services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    healthcheck:
      test: ["CMD", "mc-monitor", "status", "-host", "localhost", "-port", "25565"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    ports:
      - "0.0.0.0:25565:25565"
    environment:
      - EULA=TRUE
      - VERSION=1.21.1
      - TYPE=NEOFORGE
      - MEMORY=4G
      - TZ=America/Chicago
      - DIFFICULTY=normal
      - MAX_PLAYERS=10
      - MOTD=Home Server
      - ENABLE_AUTOPAUSE=TRUE   # pauses server when no players online to save resources
    volumes:
      - ./data:/data
      - ./mods:/data/mods
    restart: unless-stopped
