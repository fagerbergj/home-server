version: 7
daemon:
  log_level: info
  admin_group: sudo
  disable_clocks_cleanup: false
apply_settings_timer: 5
gpus:
  10DE:2204-19DA:1613-0000:41:00.0:
    fan_control_enabled: true
    fan_control_settings:
      mode: curve
      static_speed: 0.5
      temperature_key: GPU
      interval_ms: 1000
      spindown_delay_ms: 8000
      change_threshold: 3
      curve:
        30: 0.45
        55: 0.5
        65: 0.6
        75: 0.75
        85: 1.0
    power_cap: 250.0
current_profile: null
auto_switch_profiles: false
